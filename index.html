<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPV Shoko - T7 Fiel a T6</title>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --bg: #f4f7f6; --danger: #e74c3c; --warning: #f39c12; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        
        /* Estructura Idéntica a T6 */
        #pantalla-socios { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; }
        #interfaz-tpv { display: none; grid-template-columns: 1fr 350px; height: 100vh; }
        
        .btn-socio { background: var(--white); border: 2px solid var(--primary); border-radius: 15px; padding: 35px 10px; font-weight: bold; font-size: 1.4em; cursor: pointer; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-socio.activo { background: #ffeaa7; border-color: var(--warning); }

        .sidebar { background: var(--primary); color: var(--white); display: flex; flex-direction: column; padding: 15px; }
        .lista { flex: 1; overflow-y: auto; }
        .item-tiquet { display: flex; justify-content: space-between; padding: 8px; background: rgba(255,255,255,0.1); margin-bottom: 4px; border-radius: 6px; font-size: 0.9em; }
        .item-historial { color: #bdc3c7; font-style: italic; }
        
        .total-container { border-top: 2px solid rgba(255,255,255,0.3); padding: 10px 0; margin-top: 5px; }
        .tiquet-label { font-size: 0.9em; opacity: 0.8; }
        .total { font-size: 1.5em; font-weight: bold; }

        /* Botonera lateral T6 */
        .botonera-inferior { display: flex; flex-direction: column; gap: 8px; }
        .btn-side { border: none; border-radius: 12px; font-weight: bold; cursor: pointer; padding: 18px; color: white; font-size: 1em; }

        /* Estilo de los productos */
        .card { background: var(--white); border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
        
        /* Selector de Comensal sutil */
        .selector-mini { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; padding: 5px; background: #e2e8f0; border-radius: 10px; }
        .btn-mini { padding: 8px 15px; border-radius: 20px; border: 1px solid var(--primary); background: white; white-space: nowrap; font-size: 0.8em; font-weight: bold; }
        .btn-mini.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* Modal Tiquet Estilo T6 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .tiquet-papel { font-family: monospace; text-align: left; padding: 15px; border: 1px solid #ddd; background: #fdfdfd; }
    </style>
</head>
<body>

<div id="pantalla-socios"></div>

<div id="interfaz-tpv">
    <div style="padding:15px; display:flex; flex-direction:column;">
        <div id="selector-comensales" class="selector-mini"></div>
        <div id="tab-container" style="display:flex; gap:10px; margin-bottom:15px;"></div>
        <div id="grid-prods" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:15px;"></div>
    </div>

    <div class="sidebar">
        <h2 id="nombre-socio" style="text-align:center; margin-top:0;">SOCIO</h2>
        <div class="lista" id="ticket-lista"></div>
        
        <div class="total-container">
            <div class="tiquet-label">TIQUE SHOKO</div>
            <div class="total" id="total-txt">0.00€</div>
        </div>

        <div class="botonera-inferior">
            <button class="btn-side" style="background:var(--accent);" onclick="abrirComida()">COMIDA</button>
            <button class="btn-side" style="background:var(--warning); color:black;" onclick="verTiquetDetallado()">👁️ VER TIQUE</button>
            <button id="btn-cierre-parcial" class="btn-side" style="background:var(--success);" onclick="cierreParcial()">📦 CIERRE PARCIAL</button>
            <button class="btn-side" style="background:#4a5568;" onclick="location.reload()">🔙 ATRÁS</button>
        </div>
    </div>
</div>

<div id="modal-comida" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0;">Gestión Comida</h2>
        <div id="invitados-lista"></div>
        <button onclick="nuevoInv()" style="width:100%; padding:12px; margin:10px 0; border-radius:10px; border:1px dashed #666;">+ Añadir Invitado/Comensal</button>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-side" style="background:var(--primary); flex:1;" onclick="cerrarModales()">ACEPTAR</button>
            <button class="btn-side" style="background:var(--danger); flex:1;" onclick="resetComida()">RESET</button>
        </div>
    </div>
</div>

<div id="modal-tiquet" class="modal">
    <div class="modal-content">
        <h3 id="tiquet-header">DESGLOSE DE CUENTA</h3>
        <div id="papel-tiquet" class="tiquet-papel"></div>
        <button class="btn-side" style="background:var(--danger); width:100%; margin-top:15px;" onclick="cierreTotal()">🚩 CIERRE TOTAL</button>
        <button onclick="cerrarModales()" style="width:100%; border:none; background:none; color:gray; padding:10px;">Cerrar</button>
    </div>
</div>

<script>
// DATOS
const PRECIOS = { "MAHOU": 0.90, "REFRESCO": 1.00, "AGUA": 0.50, "PLATO": 8.00 };
const CATEGORIAS = { "BAR": ["MAHOU", "REFRESCO", "AGUA"], "COCINA": ["PLATO"] };

let storage = JSON.parse(localStorage.getItem('shoko_v7')) || {};
let socio = ""; let carrito = []; let historial = []; let invitados = []; let comensalActivo = "";

function renderSocios() {
    const p = document.getElementById('pantalla-socios');
    p.innerHTML = '<div style="grid-column:1/-1; background:var(--warning); padding:15px; border-radius:10px; font-weight:bold; text-align:center;">MENU PRINCIPAL</div>';
    ["FRAN", "SANTI", "SANTOS", "JESÚS", "MANU"].forEach(s => {
        const activo = storage[s] ? 'activo' : '';
        p.innerHTML += `<div class="btn-socio ${activo}" onclick="entrar('${s}')">${s}</div>`;
    });
}

function entrar(n) {
    socio = n;
    const data = storage[n] || { c: [], h: [], i: [] };
    carrito = data.c; historial = data.h; invitados = data.i;
    
    document.getElementById('pantalla-socios').style.display = 'none';
    document.getElementById('interfaz-tpv').style.display = 'grid';
    document.getElementById('nombre-socio').innerText = socio;
    
    renderTabs();
    actualizar();
    actualizarMiniSelector();
}

function actualizar() {
    const lista = document.getElementById('ticket-lista');
    let total = 0;
    lista.innerHTML = "";

    // Segunda Cuenta (Carrito)
    carrito.forEach((item, idx) => {
        total += item.p;
        lista.innerHTML += `<div class="item-tiquet" onclick="eliminar(${idx})"><span>${item.n}</span><span>${item.p.toFixed(2)}€</span></div>`;
    });

    // Primera Cuenta (Historial)
    historial.forEach(item => {
        total += item.p;
        lista.innerHTML += `<div class="item-tiquet item-historial"><span>(H) ${item.n}</span><span>${item.p.toFixed(2)}€</span></div>`;
    });

    // Cuota Mayores (Si hay invitados y no es solo bar)
    const cuotas = invitados.reduce((acc, inv) => acc + (inv.a * 1), 0);
    if(cuotas > 0) {
        total += cuotas;
        lista.innerHTML += `<div class="item-tiquet" style="border:1px dashed gold"><span>Cuota mayores de 13 años</span><span>${cuotas.toFixed(2)}€</span></div>`;
    }

    document.getElementById('total-txt').innerText = total.toFixed(2) + "€";
    document.getElementById('btn-cierre-parcial').style.display = historial.length > 0 ? 'none' : 'block';
    
    storage[socio] = { c: carrito, h: historial, i: invitados };
    localStorage.setItem('shoko_v7', JSON.stringify(storage));
}

function add(n) {
    const nombreFinal = comensalActivo ? `${n} (${comensalActivo})` : n;
    carrito.push({ n: nombreFinal, p: PRECIOS[n] });
    actualizar();
}

function eliminar(idx) {
    carrito.splice(idx, 1);
    actualizar();
}

function cierreParcial() {
    historial = [...historial, ...carrito];
    carrito = [];
    actualizar();
}

function abrirComida() {
    const cont = document.getElementById('invitados-lista');
    cont.innerHTML = `
        <div style="display:grid; grid-template-columns: 1fr 50px 50px 50px; font-size:0.7em; font-weight:bold; margin-bottom:5px; text-align:center;">
            <div>NOMBRE</div><div>>13</div><div><13</div><div>GASTOS</div>
        </div>
    `;
    invitados.forEach((inv, idx) => {
        cont.innerHTML += `
            <div style="display:grid; grid-template-columns: 1fr 50px 50px 50px; gap:5px; margin-bottom:5px;">
                <input type="text" value="${inv.n}" onchange="invitados[${idx}].n=this.value; actualizarMiniSelector()" style="width:90%">
                <input type="number" value="${inv.a}" onchange="invitados[${idx}].a=parseInt(this.value); actualizar()" style="width:100%">
                <input type="number" value="${inv.k}" onchange="invitados[${idx}].k=parseInt(this.value); actualizar()" style="width:100%">
                <input type="number" value="${inv.g}" onchange="invitados[${idx}].g=parseFloat(this.value); actualizar()" style="width:100%">
            </div>
        `;
    });
    document.getElementById('modal-comida').style.display = 'flex';
}

function nuevoInv() {
    invitados.push({ n: "Inv " + (invitados.length + 1), a: 1, k: 0, g: 0 });
    abrirComida();
    actualizarMiniSelector();
}

function actualizarMiniSelector() {
    const cont = document.getElementById('selector-comensales');
    if (invitados.length === 0) { cont.style.display = "none"; return; }
    cont.style.display = "flex";
    cont.innerHTML = `<button class="btn-mini ${comensalActivo===''?'active':''}" onclick="setComensal('')">COMÚN</button>`;
    invitados.forEach(inv => {
        cont.innerHTML += `<button class="btn-mini ${comensalActivo===inv.n?'active':''}" onclick="setComensal('${inv.n}')">${inv.n}</button>`;
    });
}

function setComensal(n) { comensalActivo = n; actualizarMiniSelector(); }

function verTiquetDetallado() {
    const papel = document.getElementById('papel-tiquet');
    const todos = [...historial, ...carrito];
    const hoy = new Date().toLocaleDateString();
    
    // Cálculos de Reparto
    const barComun = todos.filter(i => !i.n.includes("(")).reduce((acc, i) => acc + i.p, 0);
    const gastosComida = invitados.reduce((acc, i) => acc + i.g, 0);
    const totalReparto = barComun + gastosComida;
    
    const coefTotal = invitados.reduce((acc, i) => acc + (i.a * 1) + (i.k * 0.5), 0);
    const precioU = coefTotal > 0 ? totalReparto / coefTotal : 0;

    let txt = `<div style="text-align:center"><b>TIQUE SHOKO</b><br>${socio} - ${hoy}</div><br>`;
    
    txt += `<b>CONSUMO PRODUCTOS SHOKO (PRIMERA CUENTA):</b><br>`;
    historial.forEach(i => txt += `<span>- ${i.n}</span><span style="float:right">${i.p.toFixed(2)}</span><br>`);
    
    txt += `<br><b>CONSUMO PRODUCTOS SHOKO (SEGUNDA CUENTA):</b><br>`;
    carrito.forEach(i => txt += `<span>- ${i.n}</span><span style="float:right">${i.p.toFixed(2)}</span><br>`);

    txt += `<br><b>GASTOS COMIDA:</b><br>`;
    invitados.forEach(inv => { if(inv.g > 0) txt += `<span>- Gasto ${inv.n}</span><span style="float:right">${inv.g.toFixed(2)}</span><br>`; });
    
    const totalTique = todos.reduce((acc,i)=>acc+i.p,0) + invitados.reduce((acc,i)=>acc+i.a,0);
    txt += `<br><div style="border-top:1px solid #000; font-weight:bold">TOTAL TIQUE SHOKO: <span style="float:right">${totalTique.toFixed(2)}€</span></div><br>`;
    
    txt += `<b>--- DESGLOSE REPARTO ---</b><br>`;
    invitados.forEach(inv => {
        const pReparto = ((inv.a * 1) + (inv.k * 0.5)) * precioU;
        const pIndiv = todos.filter(i => i.n.includes(`(${inv.n})`)).reduce((acc, i) => acc + i.p, 0);
        const pCuota = (inv.a * 1);
        const debe = pReparto + pIndiv + pCuota;
        const balance = debe - inv.g;
        
        txt += `<b>${inv.n}:</b> ${debe.toFixed(2)}€<br>`;
        txt += `<small>(${inv.n === socio ? 'PAGA AL CLUB' : (balance > 0 ? 'PAGA A '+socio : 'RECIBE')} : ${Math.abs(balance).toFixed(2)}€)</small><br>`;
    });

    papel.innerHTML = txt;
    document.getElementById('modal-tiquet').style.display = 'flex';
}

function renderTabs() {
    const t = document.getElementById('tab-container');
    t.innerHTML = "";
    Object.keys(CATEGORIAS).forEach(cat => {
        t.innerHTML += `<button onclick="renderProds('${cat}')" style="flex:1; padding:10px; border:none; background:var(--primary); color:white; border-radius:8px; font-weight:bold;">${cat}</button>`;
    });
    renderProds("BAR");
}

function renderProds(cat) {
    const g = document.getElementById('grid-prods');
    g.innerHTML = "";
    CATEGORIAS[cat].forEach(p => {
        g.innerHTML += `<div class="card" onclick="add('${p}')"><b>${p}</b><br>${PRECIOS[p].toFixed(2)}€</div>`;
    });
}

function cerrarModales() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }
function resetComida() { invitados = []; comensalActivo = ""; actualizar(); actualizarMiniSelector(); cerrarModales(); }
function cierreTotal() { delete storage[socio]; localStorage.setItem('shoko_v7', JSON.stringify(storage)); location.reload(); }

renderSocios();
</script>
</body>
</html>
