<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPV Shoko - T6 Demo Gestión</title>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --bg: #f4f7f6; --danger: #e74c3c; --warning: #f39c12; --white: #ffffff; --gray: #95a5a6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        
        #pantalla-socios { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; height: 100vh; box-sizing: border-box; align-content: start; }
        #interfaz-tpv { display: none; grid-template-columns: 1fr 350px; height: 100vh; }
        
        .btn-socio { background: var(--white); border: 2px solid var(--primary); border-radius: 15px; padding: 35px 10px; font-weight: bold; font-size: 1.4em; cursor: pointer; text-align: center; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-socio.activo { background: #ffeaa7; border-color: var(--warning); }
        .nav-reponedor { background: var(--warning); color: var(--primary); padding: 20px; border-radius: 15px; text-align: center; font-weight: bold; cursor: pointer; width: 100%; border: 2px solid var(--primary); box-sizing: border-box; grid-column: 1 / -1; font-size: 1.3em; margin-bottom: 10px; }

        .card { background: var(--white); border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; height: 145px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; }
        .card img { height: 60px; width: auto; max-width: 90%; object-fit: contain; }
        
        .sidebar { background: var(--primary); color: var(--white); display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        .lista { flex: 1; overflow-y: auto; margin: 10px 0; }
        .item-tiquet { display: flex; justify-content: space-between; padding: 6px 10px; background: rgba(255,255,255,0.1); margin-bottom: 3px; border-radius: 6px; cursor: pointer; font-size: 0.9em; }
        .item-historial { background: rgba(255,255,255,0.05); color: #bdc3c7; font-size: 0.8em; cursor: default; }
        
        .total-container { border-top: 2px solid rgba(255,255,255,0.2); padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .tiquet-label, .total { font-size: 1.1em; font-weight: bold; }
        
        .botonera-inferior { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .fila-botones { display: flex; gap: 8px; }
        .btn-side { border: none; border-radius: 12px; font-weight: bold; cursor: pointer; padding: 15px; color: white; flex: 1; font-size: 0.9em; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--white); padding: 20px; border-radius: 20px; width: 95%; max-width: 650px; text-align: center; color: #333; max-height: 98vh; overflow-y: auto; }
        
        /* Estilos para el nuevo selector de modos */
        .selector-modos { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .btn-modo { flex: 1; padding: 15px 5px; border-radius: 10px; border: 2px solid #ddd; background: #f8f9fa; cursor: pointer; font-weight: bold; font-size: 0.8em; }
        .btn-modo.active { border-color: var(--accent); background: #e3f2fd; color: var(--accent); }

        .tiquet-papel { background: #fff; color: #000; padding: 20px; font-family: 'Courier New', monospace; text-align: left; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-top: 10px; }
        .tiquet-linea { display: flex; justify-content: space-between; margin-bottom: 3px; border-bottom: 1px dotted #ccc; }
        .fila-inv { display: grid; grid-template-columns: 1fr 60px 60px 80px 40px; gap: 8px; margin-bottom: 10px; }
        .fila-inv div { background: #f8fafc; border: 1px solid #cbd5e0; border-radius: 8px; padding: 12px 2px; text-align: center; font-size: 1.1em; font-weight: bold; }
        
        button:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="pantalla-socios"></div>

<div id="interfaz-tpv">
    <div style="padding:10px; display:flex; flex-direction:column; overflow:hidden;">
        <div id="selector-comensales" class="seccion-comensales" style="display:flex; gap:10px; margin-bottom:10px;"></div>
        <div class="tabs" id="tab-container" style="display:flex; gap:8px; margin-bottom:15px;"></div>
        <div id="grid-prods" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(145px, 1fr)); gap:12px; overflow-y:auto;"></div>
    </div>
    <div class="sidebar">
        <h2 id="nombre-socio" style="margin:0; font-size:1.8em; text-align:center;">Socio</h2>
        <div class="lista" id="ticket-lista"></div>
        <div class="total-container">
            <span class="tiquet-label">TIQUE SHOKO</span>
            <div class="total" id="total-txt">0.00€</div>
        </div>
        <div class="botonera-inferior">
            <div class="fila-botones">
                <button class="btn-side" style="background:var(--accent);" onclick="abrirModalReparto()">🍽️ COMIDA</button>
                <button class="btn-side" style="background:var(--warning); color:#000;" onclick="verTiquetDetallado()">👁️ VER TIQUE</button>
            </div>
            <button id="btn-cierre-parcial" class="btn-side" style="background:var(--success);" onclick="cierreParcial()">📦 CIERRE PARCIAL</button>
            <div class="fila-botones">
                <button class="btn-side" style="background:#7f8c8d;" onclick="alert('Limpieza')">🧹 LIMPIEZA</button>
                <button class="btn-side" style="background:#4a5568;" onclick="location.reload()">🔙 ATRÁS</button>
            </div>
        </div>
    </div>
</div>

<div id="modal-reparto" class="modal">
    <div class="modal-content">
        <h2>Gestión de la Sesión</h2>
        
        <p style="font-weight:bold; color:var(--primary); margin-bottom:5px;">¿Cómo se paga hoy?</p>
        <div class="selector-modos">
            <button id="m-escote" class="btn-modo active" onclick="setModo('escote')">🤝 A ESCOTE<br><small>Reparto igual</small></button>
            <button id="m-invito" class="btn-modo" onclick="setModo('invito')">🎁 INVITO YO<br><small>Socio paga todo</small></button>
            <button id="m-solo-bar" class="btn-modo" onclick="setModo('solo-bar')">🍻 SOLO BAR<br><small>Sin gastos comida</small></button>
        </div>

        <div id="area-invitados">
            <div id="invitados-cont"></div>
            <button id="btn-add-inv" onclick="addInv()" style="width:100%; padding:12px; margin: 10px 0; background:#f0f0f0; border:2px dashed #ccc; border-radius:12px; font-weight:bold;">+ Añadir Comensal</button>
        </div>

        <div style="display:flex; gap:10px; margin-top:15px;">
            <button style="flex:1; padding:15px; background:var(--primary); color:white; border:none; border-radius:12px; font-weight:bold;" onclick="document.getElementById('modal-reparto').style.display='none'">ACEPTAR</button>
            <button style="padding:15px; background:var(--danger); color:white; border:none; border-radius:12px; font-weight:bold;" onclick="resetearComida()">BORRAR</button>
        </div>
    </div>
</div>

<div id="modal-tiquet-final" class="modal">
    <div class="modal-content" style="max-width: 450px;">
        <h3>DESGLOSE DE CUENTA</h3>
        <div id="cont-tiquet-papel" class="tiquet-papel"></div>
        <button style="width:100%; background:var(--danger); color:white; border:none; padding:20px; border-radius:12px; font-weight:bold; margin-top:15px; cursor:pointer;" onclick="cerrarVenta()">🚩 CIERRE TOTAL</button>
        <button style="width:100%; border:none; background:none; color:gray; margin-top:10px; cursor:pointer;" onclick="document.getElementById('modal-tiquet-final').style.display='none'">Cerrar vista</button>
    </div>
</div>

<script>
const PRECIOS = { "MAHOU 25cl.": 0.90, "ALHAMBRA 33cl.": 1.50, "COCA COLA": 1.00, "AGUA": 0.50, "ATÚN": 8.00 };
const CATEGORIAS = { "BEBIDAS": ["MAHOU 25cl.", "ALHAMBRA 33cl.", "COCA COLA", "AGUA"], "COMIDA": ["ATÚN"] };

let tickets = JSON.parse(localStorage.getItem('demo_t6')) || {};
let socioActivo = ""; let carrito = []; let historial = []; let listInv = [];
let modoPago = 'escote'; // 'escote', 'invito', 'solo-bar'

function renderSocios() {
    const cont = document.getElementById('pantalla-socios');
    cont.innerHTML = '<div class="nav-reponedor">🛠️ MODO ADMINISTRACIÓN</div>';
    ["FRAN", "SANTI", "SANTOS", "JESÚS"].forEach(s => {
        const cant = (tickets[s] || []).filter(i => i.n && !i.esComida).length;
        cont.innerHTML += `<div class="btn-socio ${cant>0?'activo':''}" onclick="abrirTPV('${s}')">${s}</div>`;
    });
}

function abrirTPV(n) {
    socioActivo = n;
    let data = tickets[n] || [];
    carrito = data.filter(i => i.n && !i.esHistorial);
    historial = data.filter(i => i.esHistorial);
    let comidaG = data.find(i => i.esComida);
    listInv = comidaG ? comidaG.datos : [];
    modoPago = (data.find(i => i.esModo) || {m: 'escote'}).m;
    
    document.getElementById('pantalla-socios').style.display = 'none';
    document.getElementById('interfaz-tpv').style.display = 'grid';
    document.getElementById('nombre-socio').innerText = n;
    
    setModo(modoPago);
    renderTabs();
    actualizarTicket();
}

function setModo(m) {
    modoPago = m;
    document.querySelectorAll('.btn-modo').forEach(b => b.classList.remove('active'));
    document.getElementById('m-' + m).classList.add('active');
    
    // Si es "Solo Bar", ocultamos la lista de invitados porque no hay reparto
    document.getElementById('area-invitados').style.opacity = (m === 'solo-bar') ? '0.3' : '1';
    document.getElementById('area-invitados').style.pointerEvents = (m === 'solo-bar') ? 'none' : 'auto';
    
    guardarTicketParcial();
}

function verTiquetDetallado() {
    const cont = document.getElementById('cont-tiquet-papel');
    const totalBarHist = historial.reduce((acc, i) => acc + (i.p * i.cant), 0);
    const totalExterno = (modoPago === 'solo-bar') ? 0 : listInv.reduce((acc, i) => acc + i.g, 0);
    const canonTotal = (modoPago === 'solo-bar') ? 0 : listInv.reduce((acc, i) => acc + (i.a * 1), 0);
    
    const hayHistorial = historial.length > 0;
    const hoy = new Date().toLocaleDateString();

    let h = `<div style="text-align:center; font-weight:bold; border-bottom:2px solid #000; margin-bottom:10px;">TIQUE SHOKO - ${socioActivo}<br>MODO: ${modoPago.toUpperCase()}</div>`;
    
    // Lógica T6: Primera Cuenta / Segunda Cuenta
    h += `<b>--- CONSUMO PRODUCTOS (PRIMERA CUENTA) ---</b><br>`;
    if (!hayHistorial) {
        carrito.forEach(i => h += `<div class="tiquet-linea"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}</span></div>`);
    } else {
        historial.forEach(i => h += `<div class="tiquet-linea" style="color:#666;"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}</span></div>`);
        if(carrito.length > 0) {
            h += `<br><b>--- CONSUMO PRODUCTOS (SEGUNDA CUENTA) ---</b><br>`;
            carrito.forEach(i => h += `<div class="tiquet-linea"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}</span></div>`);
        }
    }

    h += `<br><b>--- COSTES FIJOS ---</b><br>`;
    h += `<div class="tiquet-linea"><span>Cuota > 13 años</span><span>${canonTotal.toFixed(2)}</span></div>`;
    h += `<div class="tiquet-linea"><span>Gastos Comida</span><span>${totalExterno.toFixed(2)}</span></div>`;
    
    const totalCtaTotal = carrito.reduce((acc,i)=>acc+(i.p*i.cant),0) + totalBarHist + canonTotal;
    h += `<br><div class="tiquet-linea" style="font-weight:bold; font-size:1.1em; border-top:1px solid #000;"><span>TOTAL TIQUE SHOKO</span><span>${totalCtaTotal.toFixed(2)}€</span></div><br>`;

    // Desglose de Reparto dinámico según modo
    h += `<b>--- DESGLOSE REPARTO ---</b><br>`;
    if (modoPago === 'invito') {
        h += `<div style="text-align:center; color:var(--success); font-weight:bold; border:1px dashed green; padding:5px;">EL SOCIO INVITA A TODOS</div>`;
    } else if (modoPago === 'solo-bar') {
        h += `<div style="text-align:center; color:gray;">SIN REPARTO DE COMIDA</div>`;
    } else {
        // Modo Escote (Cálculo T6)
        const baseReparto = totalBarHist + totalExterno;
        const totalCoef = listInv.reduce((acc, i) => acc + (i.a * 1) + (i.k * 0.5), 0);
        const precioU = totalCoef > 0 ? baseReparto / totalCoef : 0;

        listInv.forEach(inv => {
            const nom = inv.n || socioActivo;
            const pts = (inv.a * 1) + (inv.k * 0.5);
            const debe = (pts * precioU) + (inv.a * 1);
            const bal = debe - inv.g;
            h += `<div class="tiquet-linea"><span>${nom}</span><b>${(nom === socioActivo ? totalCtaTotal : bal).toFixed(2)}€</b></div>`;
        });
    }

    cont.innerHTML = h;
    document.getElementById('modal-tiquet-final').style.display = 'flex';
}

function renderTabs() {
    const cont = document.getElementById('tab-container');
    cont.innerHTML = Object.keys(CATEGORIAS).map(c => `<button style="flex:1; padding:10px; border-radius:8px; border:none; background:var(--primary); color:white;" onclick="renderProds('${c}')">${c}</button>`).join('');
    renderProds("BEBIDAS");
}

function renderProds(cat) {
    const cont = document.getElementById('grid-prods');
    cont.innerHTML = CATEGORIAS[cat].map(n => `<div class="card" onclick="addProd('${n}')"><b>${n}</b><br>${PRECIOS[n].toFixed(2)}€</div>`).join('');
}

function addProd(n) {
    let ex = carrito.find(i => i.n === n);
    if(ex) ex.cant++; else carrito.push({n: n, cant: 1, p: PRECIOS[n]});
    actualizarTicket();
    guardarTicketParcial();
}

function actualizarTicket() {
    let t = 0;
    let html = "";
    carrito.forEach(i => { t += i.p * i.cant; html += `<div class="item-tiquet"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}€</span></div>`; });
    historial.forEach(i => { t += i.p * i.cant; html += `<div class="item-tiquet item-historial"><span>(Hist) ${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}€</span></div>`; });
    
    // Añadir canon si no es modo solo-bar
    if(modoPago !== 'solo-bar') {
        const canon = listInv.reduce((acc, i) => acc + (i.a * 1), 0);
        if(canon > 0) html += `<div class="item-tiquet" style="border:1px dashed #fff;"><span>Canon Adultos</span><span>${canon.toFixed(2)}€</span></div>`;
        t += canon;
    }
    
    document.getElementById('ticket-lista').innerHTML = html;
    document.getElementById('total-txt').innerText = t.toFixed(2) + "€";
    document.getElementById('btn-cierre-parcial').disabled = (historial.length > 0);
}

function cierreParcial() {
    carrito.forEach(i => {
        let ex = historial.find(h => h.n === i.n);
        if(ex) ex.cant += i.cant; else historial.push({...i, esHistorial: true});
    });
    carrito = [];
    guardarTicketParcial();
    actualizarTicket();
}

function guardarTicketParcial() {
    let d = [...carrito, ...historial];
    if(listInv.length > 0) d.push({ esComida: true, datos: listInv });
    d.push({ esModo: true, m: modoPago });
    tickets[socioActivo] = d;
    localStorage.setItem('demo_t6', JSON.stringify(tickets));
}

function abrirModalReparto() {
    if(listInv.length === 0) listInv = [{n: socioActivo, a: 1, k: 0, g: 0}];
    renderInv();
    document.getElementById('modal-reparto').style.display = 'flex';
}

function addInv() {
    listInv.push({n: "Invitado " + listInv.length, a: 1, k: 0, g: 0});
    renderInv();
}

function renderInv() {
    const cont = document.getElementById('invitados-cont');
    cont.innerHTML = listInv.map((inv, i) => `
        <div class="fila-inv">
            <div style="text-align:left; font-size:0.7em;">${inv.n}</div>
            <div onclick="listInv[${i}].a = (listInv[${i}].a==1?0:1); renderInv(); actualizarTicket();">${inv.a}</div>
            <div>${inv.k}</div>
            <div>${inv.g}€</div>
            <button onclick="listInv.splice(${i},1); renderInv(); actualizarTicket();" style="border:none; color:red; background:none;">×</button>
        </div>
    `).join('');
}

function resetearComida() { listInv = []; modoPago = 'escote'; setModo('escote'); actualizarTicket(); }
function cerrarVenta() { delete tickets[socioActivo]; localStorage.setItem('demo_t6', JSON.stringify(tickets)); location.reload(); }

renderSocios();
</script>
</body>
</html>
