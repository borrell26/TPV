<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPV Club Pro - Restaurado</title>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --bg: #f4f7f6; --danger: #e74c3c; --warning: #f39c12; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        
        #pantalla-socios { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; height: 100vh; box-sizing: border-box; align-content: start; }
        #pantalla-reposicion { display: none; flex-direction: column; gap: 15px; padding: 20px; height: 100vh; box-sizing: border-box; overflow-y: auto; }
        #interfaz-tpv { display: none; grid-template-columns: 1fr 350px; height: 100vh; }

        .btn-socio { background: var(--white); border: 2px solid var(--primary); border-radius: 15px; padding: 35px 10px; font-weight: bold; font-size: 1.4em; cursor: pointer; text-align: center; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-socio.activo { background: #ffeaa7; border-color: var(--warning); }
        .nav-reponedor { background: var(--warning); color: var(--primary); padding: 20px; border-radius: 15px; text-align: center; font-weight: bold; cursor: pointer; width: 100%; border: 2px solid var(--primary); box-sizing: border-box; grid-column: 1 / -1; font-size: 1.3em; margin-bottom: 10px; }

        .card { background: var(--white); border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; height: 145px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; }
        .card img { height: 60px; width: auto; max-width: 90%; object-fit: contain; }
        
        .sidebar { background: var(--primary); color: var(--white); display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        .lista { flex: 1; overflow-y: auto; margin: 10px 0; }
        .item-tiquet { display: flex; justify-content: space-between; padding: 12px 15px; background: rgba(255,255,255,0.1); margin-bottom: 5px; border-radius: 8px; cursor: pointer; }
        
        .total { font-size: 2.8em; font-weight: bold; text-align: center; padding: 5px 0; border-top: 2px solid rgba(255,255,255,0.2); }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--white); padding: 20px; border-radius: 20px; width: 90%; max-width: 650px; text-align: center; color: #333; max-height: 98vh; overflow-y: auto; }
        
        .grid-teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .tecla { background: #edf2f7; border: none; padding: 20px; font-size: 1.5em; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-accion { padding: 18px; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 1.2em; cursor: pointer; flex: 1; }
        .btn-cancelar { background: #cbd5e0; color: #2d3748; padding: 12px; border-radius: 12px; border: none; font-weight: bold; margin-top: 10px; width: 100%; cursor: pointer; }
        
        /* Teclado Texto */
        .teclado-texto { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 10px; }
        .tecla-t { background: #edf2f7; border: none; padding: 15px 2px; font-size: 1.1em; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="pantalla-socios"></div>

<div id="pantalla-reposicion">
    <div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 style="font-size:1.8em; margin:0;">Reposición de Stock</h2>
        <div style="display:flex; gap:10px;">
            <button onclick="generarListaCompra()" style="background:var(--accent); color:white; padding:15px; border-radius:10px; border:none; font-weight:bold;">🛒 LISTA COMPRA</button>
            <button onclick="location.reload()" style="background:var(--success); color:white; padding:15px; border-radius:10px; border:none; font-weight:bold;">GUARDAR Y SALIR</button>
        </div>
    </div>
    <div id="repo-menu-cats" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:15px;"></div>
    <div id="repo-menu-items" style="display:none; width: 100%;">
        <button onclick="mostrarMenuCats()" style="margin-bottom:15px; padding:15px 30px; background:#4a5568; color:white; border:none; border-radius:10px; font-weight:bold;">⬅️ VOLVER A CATEGORÍAS</button>
        <div id="repo-grid-productos" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:15px;"></div>
    </div>
</div>

<div id="interfaz-tpv">
    <div style="padding:10px; display:flex; flex-direction:column; overflow:hidden;">
        <div class="tabs" id="tab-container" style="display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap;"></div>
        <div id="grid-prods" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(145px, 1fr)); gap:12px; overflow-y:auto;"></div>
    </div>
    <div class="sidebar">
        <h2 id="nombre-socio" style="margin:0; font-size:1.8em; text-align:center;">Socio</h2>
        <div id="quien-consume" style="text-align:center; font-size:0.9em; background:rgba(255,255,255,0.2); border-radius:5px; margin-top:5px; display:none; padding:5px;"></div>
        <div class="lista" id="ticket-lista"></div>
        
        <div id="seccion-historial" style="display:none; border-top: 1px dashed rgba(255,255,255,0.3); margin-top: 10px; padding-top: 10px;">
            <div style="font-size: 0.8em; color: #bdc3c7; margin-bottom: 5px; display: flex; justify-content: space-between;">
                <span>HISTORIAL (Cerrado Parcial)</span>
                <span id="total-historial">0.00€</span>
            </div>
            <div id="lista-historial" style="max-height: 100px; overflow-y: auto; font-size: 0.85em; opacity: 0.7;"></div>
        </div>

        <button onclick="abrirModalReparto()" style="background:var(--accent); color:white; border:none; padding:15px; border-radius:12px; font-weight:bold; margin-bottom:10px; cursor:pointer;">🍽️ COMIDA / REPARTO</button>
        <div class="total" id="total-txt">0.00€</div>
        <div style="display: flex; gap: 10px;">
            <button style="flex: 1; background:var(--success); color:white; border:none; padding:20px 5px; border-radius:15px; font-size:1.2em; font-weight:bold; cursor:pointer;" onclick="abrirOpcionesCierre()">✅ CERRAR</button>
            <button style="flex: 1; background:#4a5568; color:white; border:none; padding:20px 5px; border-radius:15px; font-size:1.2em; font-weight:bold; cursor:pointer;" onclick="location.reload()">🔙 ATRÁS</button>
        </div>
    </div>
</div>

<div id="modal-opciones-cierre" class="modal"><div class="modal-content" style="max-width:400px;"><h2>Opciones de Cierre</h2><button class="btn-accion" style="background:var(--success); width:100%; margin-bottom:10px;" onclick="cerrarVenta()">CIERRE TOTAL</button><button class="btn-accion" style="background:var(--accent); width:100%;" onclick="abrirDesgloseInvitados()">CIERRE PARCIAL / DIVIDIR</button><button class="btn-cancelar" onclick="cerrarModales()">CANCELAR</button></div></div>
<div id="modal-select-comensal" class="modal"><div class="modal-content"><h3>¿Quién consume?</h3><div id="lista-comensales-btn" style="display:grid; grid-template-columns:1fr; gap:10px;"></div><button class="btn-cancelar" onclick="cerrarModales()">VOLVER</button></div></div>
<div id="modal-edit" class="modal"><div class="modal-content"><h3 id="edit-nombre"></h3><p id="txt-actual"></p><div id="edit-input-display" style="font-size:4em; font-weight:bold; color:var(--accent); margin:10px 0;">0</div><div style="display:flex; gap:10px;"><button class="btn-accion" style="background:var(--danger);" onclick="aplicarEdicion(-1)">QUITAR</button><button class="btn-accion" style="background:var(--success);" onclick="aplicarEdicion(1)">AÑADIR</button></div><div class="grid-teclado" id="teclado-edit"></div><button id="btn-eliminar-fila" style="width:100%; padding:15px; background:var(--danger); color:white; border:none; border-radius:12px; margin-top:15px;" onclick="eliminarFilaEdicion()">ELIMINAR LÍNEA</button><button class="btn-cancelar" onclick="cerrarModales()">VOLVER</button></div></div>
<div id="modal-cantidad" class="modal"><div class="modal-content" style="width: 400px;"><h3 id="titulo-prod-modal"></h3><div id="input-cantidad" style="font-size:4em; font-weight:bold; margin-bottom:10px; color: var(--accent);">0</div><div class="grid-teclado" id="teclado-nums"></div><button class="btn-cancelar" onclick="cerrarModales()">CANCELAR</button></div></div>
<div id="modal-reparto" class="modal"><div class="modal-content" style="width: 95%; max-width: 750px;"><h2>Gestión Comida</h2><div id="invitados-cont"></div><button onclick="addInv()" style="width:100%; padding:15px; margin: 10px 0; background:#f0f0f0; border:2px dashed #ccc; border-radius:12px; font-weight:bold;">+ Añadir Comensal</button><div id="resumen-reparto" style="text-align:left; background:#eef2f7; padding:20px; border-radius:15px; margin-top:10px; display:none;"></div><div style="display:flex; gap:10px; margin-top:15px;"><button class="btn-accion" style="background:var(--accent);" onclick="calcularCuentas()">CALCULAR</button><button class="btn-accion" style="background:var(--primary);" onclick="cerrarModales()">CERRAR</button></div><button class="btn-cancelar" style="background:var(--danger); color:white;" onclick="resetearComida()">RESET COMIDA</button></div></div>
<div id="modal-teclado-texto" class="modal"><div class="modal-content" style="width:95%; max-width:900px;"><h3 id="titulo-teclado">Nombre</h3><div id="display-texto" style="font-size:2.5em; font-weight:bold; background:#f8fafc; padding:15px; border-radius:15px; margin-bottom:10px; border:2px solid #ccc;"></div><div class="teclado-texto" id="grid-teclado-texto"></div><div style="display:flex; gap:10px; margin-top:20px;"><button class="btn-accion" style="background:var(--success);" onclick="confirmarTexto()">ACEPTAR</button><button class="btn-accion" style="background:var(--danger);" onclick="cerrarModales()">CANCELAR</button></div></div></div>
<div id="modal-compra" class="modal"><div class="modal-content"><h3>🛒 Faltas</h3><div id="cuerpo-compra" style="text-align:left; max-height:400px; overflow-y:auto;"></div><button style="width:100%; padding:20px; margin-top:15px;" onclick="cerrarModales()">CERRAR</button></div></div>

<script>
// --- DATOS ---
const ML_COPA = 30;
const PRECIOS = { "MAHOU 25cl.": 0.90, "ALHAMBRA 33cl.": 1.50, "BUDWEISSER 33cl.": 1.50, "MAHOU SIN 25cl.": 0.90, "COCA COLA": 1.00, "COCA COLA ZERO": 1.00, "FANTA NARANJA": 1.00, "FANTA LIMÓN": 1.00, "SPRITE": 1.00, "ACUARIUS NARANJA": 1.00, "ACUARIUS LIMÓN": 1.00, "NESTEÁ LIMÓN": 1.00, "TÓNICA SCHWEPPES": 1.00, "TÓNICA SCHWEPPES ZERO": 1.00, "CASERA BLANCA 0,5L": 0.50, "AGUA": 0.50, "VIÑAS DEL VERO": 9.00, "BERONIA CRIANZA": 9.00, "BERONIA RESERVA": 16.00, "TIO PEPE 50cl.": 6.00, "MANZANILLA 50CL.": 6.00, "TINTO BÁSICO 70cl.": 2.00, "CROFT TWIST": 6.00, "DESCORCHE VINO": 2.00, "BARCELÓ": 2.00, "WHITE LABEL": 2.00, "RIVES": 2.00, "PINK RIVES": 2.00, "RIVES EXÓTICA": 2.00, "DESCORCHE COPA": 3.00, "ATÚN ENCEBOLLADO": 8.00, "ATÚN FRITADA": 8.00, "PATATAS FRITAS": 0.60 };
const CATEGORIAS = { "CERVEZAS": ["MAHOU 25cl.", "ALHAMBRA 33cl.", "BUDWEISSER 33cl.", "MAHOU SIN 25cl."], "REFRESCOS": ["COCA COLA", "COCA COLA ZERO", "FANTA NARANJA", "FANTA LIMÓN", "SPRITE", "ACUARIUS NARANJA", "ACUARIUS LIMÓN", "NESTEÁ LIMÓN", "TÓNICA SCHWEPPES", "TÓNICA SCHWEPPES ZERO", "CASERA BLANCA 0,5L", "AGUA"], "VINOS": ["VIÑAS DEL VERO", "BERONIA CRIANZA", "BERONIA RESERVA", "TIO PEPE 50cl.", "MANZANILLA 50CL.", "TINTO BÁSICO 70cl.", "CROFT TWIST", "DESCORCHE VINO"], "ESPIRITUOSOS": ["BARCELÓ", "WHITE LABEL", "RIVES", "PINK RIVES", "RIVES EXÓTICA", "DESCORCHE COPA"], "OTROS": ["ATÚN ENCEBOLLADO", "ATÚN FRITADA", "PATATAS FRITAS"] };
const STOCK_IDEAL = { "MAHOU 25cl.": 180, "ALHAMBRA 33cl.": 12, "BUDWEISSER 33cl.": 12, "MAHOU SIN 25cl.": 60, "COCA COLA": 60, "COCA COLA ZERO": 60, "FANTA NARANJA": 60, "FANTA LIMÓN": 60, "SPRITE": 60, "ACUARIUS NARANJA": 60, "ACUARIUS LIMÓN": 60, "NESTEÁ LIMÓN": 60, "TÓNICA SCHWEPPES": 60, "TÓNICA SCHWEPPES ZERO": 60, "CASERA BLANCA 0,5L": 60, "AGUA": 60, "VIÑAS DEL VERO": 6, "BERONIA CRIANZA": 6, "BERONIA RESERVA": 6, "TIO PEPE 50cl.": 6, "MANZANILLA 50CL.": 6, "TINTO BÁSICO 70cl.": 6, "CROFT TWIST": 6, "BARCELÓ": 3000, "WHITE LABEL": 3000, "RIVES": 3000, "PINK RIVES": 3000, "RIVES EXÓTICA": 3000, "ATÚN ENCEBOLLADO": 8, "ATÚN FRITADA": 8, "PATATAS FRITAS": 20 };

let stockActual = JSON.parse(localStorage.getItem('v29_stock')) || {...STOCK_IDEAL};
let tickets = JSON.parse(localStorage.getItem('v29_tickets')) || {};
let socioActivo = ""; let carrito = []; let catActiva = "CERVEZAS";
let prodTemp = null; let inputVal = ""; let modoRepoActivo = false;
let listInv = []; let editingInvIdx = -1; let currentTexto = "";
let currentEditType = ""; let comensalActual = ""; let consumidoConfirmado = [];

function getImg(n) { return `img/${n.replace(/ /g, '_').toUpperCase()}.jpg`; }

function renderSocios() {
    modoRepoActivo = false;
    const cont = document.getElementById('pantalla-socios');
    cont.innerHTML = '<div class="nav-reponedor" onclick="abrirReposicion()">🛠️ MODO REPONEDOR</div>';
    ["FRAN", "SANTI", "SANTOS", "JESÚS", "MANU", "JR", "MIGUEL", "NUÑEZ", "SILVA", "LUIS", "ROSADO"].forEach(s => {
        const data = tickets[s] || [];
        const cant = data.filter(i => i.n && !i.esComida).reduce((acc, i) => acc + i.cant, 0);
        cont.innerHTML += `<div class="btn-socio ${cant > 0 ? 'activo' : ''}" onclick="abrirTPV('${s}')">${s} ${cant > 0 ? `<span style="position:absolute; top:-8px; right:-8px; background:var(--danger); color:white; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:2px solid white; font-size:14px;">${cant}</span>` : ''}</div>`;
    });
}

// --- MODO REPONEDOR ---
function abrirReposicion() {
    modoRepoActivo = true;
    document.getElementById('pantalla-socios').style.display = 'none';
    document.getElementById('pantalla-reposicion').style.display = 'flex';
    mostrarMenuCats();
}

function mostrarMenuCats() {
    document.getElementById('repo-menu-items').style.display = 'none';
    const cont = document.getElementById('repo-menu-cats');
    cont.style.display = 'grid';
    cont.innerHTML = Object.keys(CATEGORIAS).map(cat => `<div class="btn-socio" onclick="mostrarProductosRepo('${cat}')">${cat}</div>`).join('');
}

function mostrarProductosRepo(cat) {
    catActiva = cat;
    document.getElementById('repo-menu-cats').style.display = 'none';
    document.getElementById('repo-menu-items').style.display = 'block';
    const cont = document.getElementById('repo-grid-productos');
    cont.innerHTML = CATEGORIAS[cat].map(n => {
        const esE = (cat === "ESPIRITUOSOS");
        const stockTxt = esE ? (stockActual[n]/700).toFixed(1)+' Bot.' : stockActual[n]+' uds';
        return `<div class="card" onclick="abrirEdicionStock('${n}')">
            <b>${n}</b>
            <span style="font-size:1.5em; color:var(--accent)">${stockTxt}</span>
            <small>Ideal: ${esE ? (STOCK_IDEAL[n]/700).toFixed(1) : STOCK_IDEAL[n]}</small>
        </div>`;
    }).join('');
}

function abrirEdicionStock(n) {
    prodTemp = n; inputVal = "";
    document.getElementById('edit-nombre').innerText = n;
    document.getElementById('txt-actual').innerText = "Stock Actual: " + stockActual[n];
    document.getElementById('edit-input-display').innerText = "0";
    document.getElementById('btn-eliminar-fila').style.display = 'none';
    document.getElementById('modal-edit').style.display = 'flex';
}

// --- TPV ---
function abrirTPV(n) {
    modoRepoActivo = false; socioActivo = n; comensalActual = n;
    let data = tickets[n] || [];
    carrito = data.filter(i => i.n && !i.esComida);
    let comidaG = data.find(i => i.esComida);
    listInv = comidaG ? comidaG.datos : [];
    consumidoConfirmado = JSON.parse(localStorage.getItem('v29_historial_' + n)) || [];
    
    document.getElementById('pantalla-socios').style.display = 'none';
    document.getElementById('interfaz-tpv').style.display = 'grid';
    document.getElementById('nombre-socio').innerText = n;
    renderTabs(); renderProds(); actualizarTicket();
}

function confirmar() {
    const valStr = document.getElementById('input-cantidad').innerText;
    const valorNum = parseFloat(valStr) || 0;
    if (currentEditType === 'prod') {
        const c = parseFloat(valStr) || 1;
        const nombreItem = (comensalActual !== socioActivo) ? `[${comensalActual}] ${prodTemp}` : prodTemp;
        const ex = carrito.find(i => i.n === nombreItem);
        if(ex) ex.cant += c; 
        else carrito.push({n: nombreItem, cant: c, p: PRECIOS[prodTemp], esLicor: CATEGORIAS["ESPIRITUOSOS"].includes(prodTemp), originalName: prodTemp});
    } 
    else if (currentEditType === 'adulto') listInv[editingInvIdx].a = parseInt(valorNum) || 0;
    else if (currentEditType === 'nino') listInv[editingInvIdx].k = valorNum || 0;
    else if (currentEditType === 'gasto') listInv[editingInvIdx].g = valorNum || 0;
    guardarTicketParcial(); cerrarModales();
    if (currentEditType !== 'prod') renderInv();
}

function aplicarEdicion(signo) {
    const val = parseFloat(inputVal) || 0;
    if (modoRepoActivo) {
        const esE = CATEGORIAS["ESPIRITUOSOS"].includes(prodTemp);
        stockActual[prodTemp] += ((esE ? val * 700 : val) * signo);
        localStorage.setItem('v29_stock', JSON.stringify(stockActual));
        mostrarProductosRepo(catActiva);
    } else {
        const item = carrito.find(i => i.n === prodTemp);
        if (item) { item.cant += (val * signo); if (item.cant <= 0) carrito = carrito.filter(i => i.n !== prodTemp); }
    }
    guardarTicketParcial(); cerrarModales();
}

function actualizarTicket() {
    let tS = 0; let tH = 0;
    document.getElementById('ticket-lista').innerHTML = carrito.map(i => {
        tS += i.p * i.cant;
        return `<div class="item-tiquet" onclick="abrirEdicionTicket('${i.n}')"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}€</span></div>`;
    }).join('');
    
    const seccionH = document.getElementById('seccion-historial');
    if (consumidoConfirmado.length > 0) {
        seccionH.style.display = 'block';
        document.getElementById('lista-historial').innerHTML = consumidoConfirmado.map(i => {
            tH += i.p * i.cant;
            return `<div style="display:flex; justify-content:space-between; padding: 2px 5px; color:#bdc3c7;"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}€</span></div>`;
        }).join('');
        document.getElementById('total-historial').innerText = tH.toFixed(2) + "€";
    } else { seccionH.style.display = 'none'; }

    const canon = listInv.reduce((acc, i) => acc + (i.a * 1), 0);
    if(canon > 0) document.getElementById('ticket-lista').innerHTML += `<div class="item-tiquet" style="border:1px dashed #fff; background:rgba(39, 174, 96, 0.2);"><span>Canon Comida (${canon})</span><span>${canon.toFixed(2)}€</span></div>`;
    document.getElementById('total-txt').innerText = (tS + tH + canon).toFixed(2) + "€";
}

function abrirDesgloseInvitados() {
    if (carrito.length > 0 && confirm("¿Archivar consumos en Historial?")) {
        consumidoConfirmado = consumidoConfirmado.concat(carrito);
        carrito = [];
        localStorage.setItem('v29_historial_' + socioActivo, JSON.stringify(consumidoConfirmado));
        guardarTicketParcial(); actualizarTicket();
    }
    cerrarModales(); 
    const cont = document.getElementById('lista-comensales-btn');
    cont.innerHTML = `<button class="btn-accion" style="background:var(--primary);" onclick="setComensal('${socioActivo}')">SOCIO (${socioActivo})</button>`;
    listInv.forEach(inv => { if(inv.n) cont.innerHTML += `<button class="btn-accion" style="background:var(--warning); color:black;" onclick="setComensal('${inv.n}')">${inv.n}</button>`; });
    document.getElementById('modal-select-comensal').style.display = 'flex';
}

function setComensal(nombre) { comensalActual = nombre; const ind = document.getElementById('quien-consume'); ind.innerText = "Cargando a: " + nombre; ind.style.display = 'block'; cerrarModales(); }

function calcularCuentas() {
    const totalBar = carrito.reduce((acc, i) => acc + (i.p * i.cant), 0) + consumidoConfirmado.reduce((acc, i) => acc + (i.p * i.cant), 0);
    const totalExterno = listInv.reduce((acc, i) => acc + i.g, 0);
    const totalCoeficientes = listInv.reduce((acc, i) => acc + (i.a * 1) + (i.k * 0.5), 0);
    if (totalCoeficientes === 0) return;
    const precioPorUnidad = (totalBar + totalExterno) / totalCoeficientes;
    let h = `<h4>Cuentas (Inc. Historial):</h4>`;
    listInv.forEach(inv => {
        const p = (inv.a * 1) + (inv.k * 0.5);
        const deb = (p * precioPorUnidad) + (inv.a * 1); 
        const bal = deb - inv.g;
        h += `<div style="font-size:0.9em; margin-bottom:5px;">${inv.n || '?'} ${bal > 0 ? `<span style="color:var(--danger)">DEBE ${bal.toFixed(2)}€</span>` : `<span style="color:var(--success)">RECIBE ${Math.abs(bal).toFixed(2)}€</span>`}</div>`;
    });
    document.getElementById('resumen-reparto').innerHTML = h; document.getElementById('resumen-reparto').style.display = 'block'; 
}

function cerrarVenta() {
    const todo = carrito.concat(consumidoConfirmado);
    todo.forEach(i => {
        const nombreReal = i.originalName || i.n;
        if(!nombreReal.includes("DESCORCHE")) { stockActual[nombreReal] -= (i.esLicor ? i.cant*ML_COPA : i.cant); }
    });
    localStorage.setItem('v29_stock', JSON.stringify(stockActual));
    localStorage.removeItem('v29_historial_' + socioActivo);
    delete tickets[socioActivo]; localStorage.setItem('v29_tickets', JSON.stringify(tickets)); location.reload();
}

function renderTabs() { document.getElementById('tab-container').innerHTML = Object.keys(CATEGORIAS).map(c => `<button style="padding:12px; flex:1; border:none; border-radius:10px; font-weight:bold; background:${c===catActiva?'var(--accent)':'#cbd5e0'}; color:${c===catActiva?'white':'black'}" onclick="catActiva='${c}'; renderTabs(); renderProds()">${c}</button>`).join(''); }
function renderProds() {
    document.getElementById('grid-prods').innerHTML = CATEGORIAS[catActiva].map(n => `
        <div class="card" onclick="abrirTecladoProd('${n}')">
            <img src="${getImg(n)}" onerror="this.style.opacity='0.1'">
            <b>${n}</b>
            <span style="color:var(--success); font-weight:bold;">${PRECIOS[n].toFixed(2)}€</span>
        </div>`).join('');
}
function presionarNum(v) { if(v === '.' && inputVal.includes('.')) return; inputVal += v; document.getElementById('input-cantidad').innerText = inputVal || "0"; }
function presionarNumEdit(v) { if(v === '.' && inputVal.includes('.')) return; inputVal += v; document.getElementById('edit-input-display').innerText = inputVal; }
function abrirModalReparto() { if (listInv.length === 0) listInv = [{n: socioActivo, a: 1, k: 0, g: 0}]; renderInv(); document.getElementById('modal-reparto').style.display = 'flex'; }
function addInv() { listInv.push({n: "", a: 0, k: 0, g: 0}); renderInv(); }
function renderInv() {
    const cont = document.getElementById('invitados-cont');
    cont.innerHTML = `<div style="display:grid; grid-template-columns: 1fr 60px 60px 80px 40px; gap:8px; font-weight:bold; font-size:0.8em; margin-bottom:8px;"><span>Nombre</span><span>>13</span><span><13</span><span>Gasto</span><span></span></div>`;
    listInv.forEach((inv, i) => {
        cont.innerHTML += `<div class="fila-inv">
            <div onclick="abrirTecladoTexto(${i})">${inv.n || '...'}</div>
            <div onclick="abrirTecladoNumComida(${i}, 'adulto')">${inv.a}</div>
            <div onclick="abrirTecladoNumComida(${i}, 'nino')">${inv.k}</div>
            <div onclick="abrirTecladoNumComida(${i}, 'gasto')">${inv.g.toFixed(2)}€</div>
            <button onclick="listInv.splice(${i},1); renderInv(); guardarTicketParcial();" style="color:red; border:none; background:none; font-size:1.8em;">×</button>
        </div>`;
    });
}
function abrirTecladoNumComida(idx, tipo) { editingInvIdx = idx; currentEditType = tipo; inputVal = ""; document.getElementById('titulo-prod-modal').innerText = "Valor"; document.getElementById('input-cantidad').innerText = "0"; document.getElementById('modal-cantidad').style.display = 'flex'; }
function abrirTecladoTexto(idx) { editingInvIdx = idx; currentTexto = listInv[idx].n; document.getElementById('display-texto').innerText = currentTexto; document.getElementById('modal-teclado-texto').style.display = 'flex'; renderTecladoTexto(); }
function renderTecladoTexto() { const cont = document.getElementById('grid-teclado-texto'); const teclas = "1234567890QWERTYUIOPASDFGHJKLÑZXCVBNM ".split(""); cont.innerHTML = teclas.map(l => `<button class="tecla-t" onclick="addLetra('${l}')">${l===' '?'_':l}</button>`).join(''); cont.innerHTML += `<button class="tecla-t" style="background:var(--warning);" onclick="addLetra('BACK')">DEL</button>`; }
function addLetra(l) { if(l === 'BACK') currentTexto = currentTexto.slice(0, -1); else if(currentTexto.length < 15) currentTexto += l; document.getElementById('display-texto').innerText = currentTexto; }
function confirmarTexto() { listInv[editingInvIdx].n = currentTexto; cerrarModales(); renderInv(); }
function resetearComida() { if(confirm("¿Borrar comida?")) { listInv = []; document.getElementById('resumen-reparto').style.display = 'none'; guardarTicketParcial(); } }
function guardarTicketParcial() {
    let d = [...carrito]; if(listInv.length > 0) d.push({ esComida: true, datos: listInv });
    tickets[socioActivo] = d; localStorage.setItem('v29_tickets', JSON.stringify(tickets)); actualizarTicket();
}
function abrirTecladoProd(n) { prodTemp = n; currentEditType = 'prod'; inputVal = ""; document.getElementById('titulo-prod-modal').innerText = n; document.getElementById('input-cantidad').innerText = "1"; document.getElementById('modal-cantidad').style.display = 'flex'; }
function abrirEdicionTicket(n) { prodTemp = n; inputVal = ""; const item = carrito.find(i => i.n === n); document.getElementById('edit-nombre').innerText = n; document.getElementById('txt-actual').innerText = "Cant: " + item.cant; document.getElementById('edit-input-display').innerText = "0"; document.getElementById('btn-eliminar-fila').style.display = 'block'; document.getElementById('modal-edit').style.display = 'flex'; }
function eliminarFilaEdicion() { carrito = carrito.filter(i => i.n !== prodTemp); guardarTicketParcial(); cerrarModales(); }
function generarListaCompra() {
    let h = "";
    Object.keys(STOCK_IDEAL).forEach(n => {
        const f = STOCK_IDEAL[n] - stockActual[n];
        if(f > 0) h += `<div style="padding:10px; border-bottom:1px solid #eee;"><span>${n}: </span><b>${STOCK_IDEAL[n]>1000 ? (f/1000).toFixed(1)+'L' : f+' uds'}</b></div>`;
    });
    document.getElementById('cuerpo-compra').innerHTML = h || "Stock OK"; document.getElementById('modal-compra').style.display = 'flex';
}
function abrirOpcionesCierre() { document.getElementById('modal-opciones-cierre').style.display = 'flex'; }
function cerrarModales() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
function crearTeclado(id, func) {
    const cont = document.getElementById(id); cont.innerHTML = "";
    for(let i=1; i<=9; i++) cont.innerHTML += `<button class="tecla" onclick="${func}('${i}')">${i}</button>`;
    cont.innerHTML += `<button class="tecla" onclick="${func}('.')">.</button><button class="tecla" onclick="${func}('0')">0</button>`;
    cont.innerHTML += `<button class="tecla" style="background:#ccc;" onclick="inputVal=''; document.getElementById('${id==='teclado-nums'?'input-cantidad':'edit-input-display'}').innerText='0'">C</button>`;
    if (id === 'teclado-nums') cont.innerHTML += `<button class="tecla" style="background:var(--success);color:white; grid-column: span 3; padding: 25px;" onclick="confirmar()">ACEPTAR</button>`;
}
crearTeclado('teclado-nums', 'presionarNum');
crearTeclado('teclado-edit', 'presionarNumEdit');
renderSocios();
</script>
</body>
</html>
