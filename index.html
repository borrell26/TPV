<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPV Shoko - MASTER 3</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() { emailjs.init("lc8woRfpiuAUn_9QM"); })(); 
    </script>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --bg: #f4f7f6; --danger: #e74c3c; --warning: #f39c12; --white: #ffffff; --gray: #95a5a6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        
        #pantalla-socios { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; height: 100vh; box-sizing: border-box; align-content: start; }
        #interfaz-tpv { display: none; grid-template-columns: 1fr 350px; height: 100vh; }
        #pantalla-reposicion { display: none; flex-direction: column; gap: 15px; padding: 20px; height: 100vh; box-sizing: border-box; overflow-y: auto; }

        .btn-socio { background: var(--white); border: 2px solid var(--primary); border-radius: 15px; padding: 35px 10px; font-weight: bold; font-size: 1.4em; cursor: pointer; text-align: center; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-socio.activo { background: #ffeaa7; border-color: var(--warning); }
        .nav-reponedor { background: #cbd5e0; color: var(--primary); padding: 10px; border-radius: 10px; text-align: center; font-weight: normal; cursor: pointer; width: 100%; border: 1px solid var(--gray); box-sizing: border-box; grid-column: 1 / -1; font-size: 1em; margin-top: 20px; opacity: 0.7; }

        .card { background: var(--white); border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; height: 145px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; }
        .card img { height: 60px; width: auto; max-width: 90%; object-fit: contain; }
        
        .sidebar { background: var(--primary); color: var(--white); display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        .lista { flex: 1; overflow-y: auto; margin: 10px 0; }
        .item-tiquet { display: flex; justify-content: space-between; padding: 6px 10px; background: rgba(255,255,255,0.1); margin-bottom: 3px; border-radius: 6px; cursor: pointer; font-size: 0.9em; }
        .item-historial { background: rgba(255,255,255,0.05); color: #bdc3c7; font-size: 0.8em; cursor: default; }
        
        .total-container { border-top: 2px solid rgba(255,255,255,0.2); padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .tiquet-label, .total { font-size: 1.1em; font-weight: bold; }
        
        .botonera-inferior { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .fila-botones { display: flex; gap: 8px; }
        .btn-side { border: none; border-radius: 12px; font-weight: bold; cursor: pointer; padding: 15px; color: white; flex: 1; font-size: 0.9em; }
        button:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.5); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        #modal-teclado-texto, #modal-cantidad, #modal-asignar-comensal { z-index: 2000; } 
        
        .modal-content { background: var(--white); padding: 20px; border-radius: 20px; width: 90%; max-width: 650px; text-align: center; color: #333; max-height: 98vh; overflow-y: auto; }
        .tiquet-papel { background: #fff; color: #000; padding: 20px; font-family: 'Courier New', monospace; text-align: left; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-top: 10px; }
        .tiquet-linea { display: flex; justify-content: space-between; margin-bottom: 3px; border-bottom: 1px dotted #ccc; }
        .btn-cancelar { background: #cbd5e0; color: #2d3748; padding: 12px; border-radius: 12px; border: none; font-weight: bold; margin-top: 10px; width: 100%; cursor: pointer; }
        
        .grid-teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .tecla { background: #edf2f7; border: none; padding: 20px; font-size: 1.5em; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-accion { padding: 18px; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 1.2em; cursor: pointer; flex: 1; }
        .btn-comensal-modal { padding: 20px; border-radius: 12px; border: 2px solid var(--primary); background: white; font-weight: bold; cursor: pointer; font-size: 1.2em; }
        .tecla-t { background: #edf2f7; border: none; padding: 15px 2px; font-size: 1.1em; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .teclado-texto { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 10px; }
        .fila-inv { display: grid; grid-template-columns: 1fr 60px 60px 80px 40px; gap: 8px; margin-bottom: 10px; }
        .fila-inv div { background: #f8fafc; border: 1px solid #cbd5e0; border-radius: 8px; padding: 12px 2px; text-align: center; font-size: 1.1em; font-weight: bold; }
    </style>
</head>
<body>

<div id="pantalla-socios"></div>

<div id="pantalla-reposicion">
    <div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 style="font-size:1.8em; margin:0;">Reposición</h2>
        <div style="display:flex; gap:10px;">
            <button onclick="generarListaCompra()" style="background:var(--accent); color:white; padding:15px; border-radius:10px; border:none; font-weight:bold;">🛒 LISTA COMPRA</button>
            <button onclick="location.reload()" style="background:var(--success); color:white; padding:15px; border-radius:10px; border:none; font-weight:bold;">💾 SALIR</button>
        </div>
    </div>
    <div id="repo-menu-cats" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:15px;"></div>
    <div id="repo-menu-items" style="display:none; width: 100%;">
        <button onclick="mostrarMenuCats()" style="margin-bottom:15px; padding:15px 30px; background:#4a5568; color:white; border:none; border-radius:10px; font-weight:bold;">⬅️ VOLVER</button>
        <div id="repo-grid-productos" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:15px;"></div>
    </div>
</div>

<div id="interfaz-tpv">
    <div style="padding:10px; display:flex; flex-direction:column; overflow:hidden;">
        <div class="tabs" id="tab-container" style="display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap;"></div>
        <div id="grid-prods" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(145px, 1fr)); gap:12px; overflow-y:auto;"></div>
    </div>
    <div class="sidebar">
        <h2 id="nombre-socio" style="margin:0; font-size:1.8em; text-align:center;">Socio</h2>
        <div class="lista" id="ticket-lista"></div>
        <div class="total-container">
            <span class="tiquet-label">TIQUE SHOKO</span>
            <div class="total" id="total-txt">0.00€</div>
        </div>
        <div class="botonera-inferior">
            <div class="fila-botones">
    <button class="btn-side" style="background:var(--accent);" onclick="abrirModalReparto()">🍽️ COMIDA</button>
    <button class="btn-side" style="background:var(--warning); color:#000;" onclick="verTiquetDetallado()">👁️ VER TIQUE</button>
</div>

<div class="fila-botones" style="margin-top: 8px;">
    
</div>
            
            <div class="fila-botones">
               
                <button class="btn-side" style="background:#4a5568;" onclick="location.reload()">🔙 ATRÁS</button>
            </div>
        </div>
    </div>
</div>

<div id="modal-tiquet-final" class="modal">
    <div class="modal-content" style="max-width: 450px;">
        <h3>DESGLOSE DE TIQUE</h3>
        <div id="cont-tiquet-papel" class="tiquet-papel"></div>
        
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 20px;">
            
            <button id="btn-final-enviar" 
                style="width:100%; background:var(--danger); color:white; border:none; padding:18px; border-radius:12px; font-weight:bold; cursor:pointer; font-size:1.1em; margin:0;" 
                onclick="cerrarVenta()">🚩 CIERRE TOTAL</button>

            <button id="btn-cierre-parcial" 
                style="width:100%; background:var(--success); color:white; border:none; padding:18px; border-radius:12px; font-weight:bold; cursor:pointer; font-size:1.1em; margin:0;" 
                onclick="cierreParcial()">📦 CIERRE PARCIAL</button>
            
            <button id="btn-volver-tpv" 
    style="width:100%; background:var(--primary); color:white; border:none; padding:18px; border-radius:12px; font-weight:bold; cursor:pointer; font-size:1.1em;" 
    onclick="cerrarModalTiquet()">
    VOLVER AL TPV
</button>
        </div>
    </div>
</div>
<div id="modal-compra" class="modal">
    <div class="modal-content" style="max-width: 400px;">
        <h3>🛒 LISTA DE COMPRA</h3>
        <div id="cuerpo-compra" style="text-align: left; max-height: 400px; overflow-y: auto; margin: 15px 0; border: 1px solid #eee; padding: 10px; border-radius: 10px;"></div>
        <button class="btn-side" style="background:var(--success); width: 100%; padding: 15px;" onclick="document.getElementById('modal-compra').style.display='none'">CERRAR</button>
    </div>
</div>

<div id="modal-teclado-texto" class="modal"><div class="modal-content" style="width: 95%; max-width: 900px;"><h3 id="titulo-teclado">Nombre</h3><div id="display-texto" style="font-size:2.5em; font-weight:bold; background:#f8fafc; padding:15px; border-radius:15px; margin-bottom:10px; min-height:1.2em; border:2px solid #ccc;"></div><div class="teclado-texto" id="grid-teclado-texto"></div><div style="display:flex; gap:10px; margin-top:20px;"><button class="btn-accion" style="background:var(--success);" onclick="confirmarTexto()">ACEPTAR</button><button class="btn-accion" style="background:var(--danger);" onclick="document.getElementById('modal-teclado-texto').style.display='none'">CANCELAR</button></div></div></div>
<div id="modal-cantidad" class="modal"><div class="modal-content" style="width: 400px;"><h3 id="titulo-prod-modal"></h3><div id="input-cantidad" style="font-size:4em; font-weight:bold; margin-bottom:10px; color: var(--accent);">0</div><div class="grid-teclado" id="teclado-nums"></div><button class="btn-cancelar" onclick="document.getElementById('modal-cantidad').style.display='none'">CANCELAR</button></div></div>

<div id="modal-edit" class="modal">
    <div class="modal-content" style="width: 280px; padding: 15px;">
        <h3 id="edit-nombre" style="font-size: 1.1em;"></h3>
        <p id="txt-actual" style="margin: 5px 0; font-size: 1.1em; font-weight: bold; color: #444; text-align: center;"></p>
        <div id="edit-input-display" style="font-size: 2.5em; font-weight:bold; color:var(--accent); margin:5px 0;">0</div>
        <div style="display:flex; gap:10px; margin-bottom: 10px;">
            <button class="btn-accion" style="background:var(--danger); padding: 10px;" onclick="aplicarEdicion(-1)">-</button>
            <button class="btn-accion" style="background:var(--success); padding: 10px;" onclick="aplicarEdicion(1)">+</button>
        </div>
        <div class="grid-teclado" id="teclado-edit"></div>
        <button id="btn-eliminar-fila" style="width:100%; padding:10px; background:var(--danger); color:white; border:none; border-radius:12px; margin-top:10px; font-size: 0.8em;" onclick="eliminarFilaEdicion()">ELIMINAR LÍNEA</button>
        <button class="btn-cancelar" style="margin-top: 5px;" onclick="document.getElementById('modal-edit').style.display='none'">VOLVER</button>
    </div>
</div>

<div id="modal-reparto" class="modal"><div class="modal-content" style="width: 95%; max-width: 750px;"><h2>Gestión Comida</h2><div id="invitados-cont"></div><button id="btn-add-inv" onclick="addInv()" style="width:100%; padding:15px; margin: 10px 0; background:#f0f0f0; border:2px dashed #ccc; border-radius:12px; font-weight:bold;">+ Añadir Comensal</button><div style="display:flex; flex-direction:column; gap:10px; margin-top:15px;"><button class="btn-accion" style="background:var(--primary);" onclick="cerrarTPVCompletamente()">VOLVER AL TICKET</button><button class="btn-cancelar" style="background:var(--danger); color:white;" onclick="resetearComida()" id="btn-reset-comida">BORRAR TODO</button></div></div></div>
<div id="modal-asignar-comensal" class="modal"><div class="modal-content"><h3>¿A quién asignar consumición?</h3><div id="grid-comensales-modal" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;"></div><button class="btn-cancelar" onclick="document.getElementById('modal-asignar-comensal').style.display='none'">CANCELAR</button></div></div>

<script>
const ML_COPA = 30;
const EMAILS_SOCIOS = { "MIGUEL": "mguardiz@gmail.com", "SANTI": "sbborrell@gmail.com" };
const PRECIOS = { "MAHOU 25cl.": 0.90, "ALHAMBRA 33cl.": 1.50, "BUDWEISSER 33cl.": 1.50, "MAHOU SIN 25cl.": 0.90, "COCA COLA": 1.00, "COCA COLA ZERO": 1.00, "FANTA NARANJA": 1.00, "FANTA LIMÓN": 1.00, "SPRITE": 1.00, "ACUARIUS NARANJA": 1.00, "ACUARIUS LIMÓN": 1.00, "NESTEÁ LIMÓN": 1.00, "TÓNICA SCHWEPPES": 1.00, "TÓNICA SCHWEPPES ZERO": 1.00, "CASERA BLANCA 0,5L": 0.50, "AGUA": 0.50, "VIÑAS DEL VERO": 9.00, "BERONIA CRIANZA": 9.00, "BERONIA RESERVA": 16.00, "TIO PEPE 50cl.": 6.00, "MANZANILLA 50CL.": 6.00, "TINTO BÁSICO 70cl.": 2.00, "CROFT TWIST": 6.00, "DESCORCHE VINO": 2.00, "BARCELÓ": 2.00, "WHITE LABEL": 2.00, "RIVES": 2.00, "PINK RIVES": 2.00, "RIVES EXÓTICA": 2.00, "DESCORCHE COPA": 3.00, "ATÚN ENCEBOLLADO": 8.00, "ATÚN FRITADA": 8.00, "PATATAS FRITAS": 0.60, "LIMPIEZA": 12.00 };
const CATEGORIAS = { "CERVEZAS": ["MAHOU 25cl.", "ALHAMBRA 33cl.", "BUDWEISSER 33cl.", "MAHOU SIN 25cl."], "REFRESCOS": ["COCA COLA", "COCA COLA ZERO", "FANTA NARANJA", "FANTA LIMÓN", "SPRITE", "ACUARIUS NARANJA", "ACUARIUS LIMÓN", "NESTEÁ LIMÓN", "TÓNICA SCHWEPPES", "TÓNICA SCHWEPPES ZERO", "CASERA BLANCA 0,5L", "AGUA"], "VINOS": ["VIÑAS DEL VERO", "BERONIA CRIANZA", "BERONIA RESERVA", "TIO PEPE 50cl.", "MANZANILLA 50CL.", "TINTO BÁSICO 70cl.", "CROFT TWIST", "DESCORCHE VINO"], "ESPIRITUOSOS": ["BARCELÓ", "WHITE LABEL", "RIVES", "PINK RIVES", "RIVES EXÓTICA", "DESCORCHE COPA"], "OTROS": ["ATÚN ENCEBOLLADO", "ATÚN FRITADA", "PATATAS FRITAS"], "LIMPIEZA": ["LIMPIEZA"] };
const STOCK_IDEAL = { "MAHOU 25cl.": 180, "ALHAMBRA 33cl.": 12, "BUDWEISSER 33cl.": 12, "MAHOU SIN 25cl.": 60, "COCA COLA": 60, "COCA COLA ZERO": 60, "FANTA NARANJA": 60, "FANTA LIMÓN": 60, "SPRITE": 60, "ACUARIUS NARANJA": 60, "ACUARIUS LIMÓN": 60, "NESTEÁ LIMÓN": 60, "TÓNICA SCHWEPPES": 60, "TÓNICA SCHWEPPES ZERO": 60, "CASERA BLANCA 0,5L": 60, "AGUA": 60, "VIÑAS DEL VERO": 6, "BERONIA CRIANZA": 6, "BERONIA RESERVA": 6, "TIO PEPE 50cl.": 6, "MANZANILLA 50CL.": 6, "TINTO BÁSICO 70cl.": 6, "CROFT TWIST": 6, "BARCELÓ": 3000, "WHITE LABEL": 3000, "RIVES": 3000, "PINK RIVES": 3000, "RIVES EXÓTICA": 3000, "ATÚN ENCEBOLLADO": 8, "ATÚN FRITADA": 8, "PATATAS FRITAS": 20 };

let stockActual = JSON.parse(localStorage.getItem('v29_stock')) || {...STOCK_IDEAL};
let tickets = JSON.parse(localStorage.getItem('v29_tickets')) || {};
let socioActivo = ""; let carrito = []; let historial = []; let catActiva = "CERVEZAS";
let prodTemp = null; let inputVal = "";
let listInv = []; let modoRepoActivo = false;
let editingInvIdx = -1; let currentTexto = "";
let currentEditType = "";
let comensalSel = "";
let cantTemp = 1;
let flgNuevoInv = false;

function getImg(n) { return `img/${n.replace(/ /g, '_').toUpperCase()}.jpg`; }

function renderSocios() {
    modoRepoActivo = false;
    const cont = document.getElementById('pantalla-socios');
    cont.innerHTML = '';
    
    // --- ESTILO DEL FONDO ---
    cont.style.position = 'relative';
    cont.style.backgroundColor = 'black'; // Este es un gris oscuro azulado muy elegante
    cont.style.minHeight = '100vh';         // Asegura que cubra toda la pantalla
    cont.style.padding = '20px';            // Espacio para que los botones no peguen al borde

    // 1. LOGO DE FONDO (Marca de agua)
    // Al ser el fondo oscuro, la opacidad debe ser baja para que no brille demasiado
    cont.innerHTML += `
        <img src="img/LOGO.png" style="
           position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%; 
            opacity: 0.15; /* Subimos un pelín la opacidad para que resalte sobre el negro */
            z-index: 0; 
            pointer-events: none;
            filter: grayscale(100%); /* Opcional: hace que el logo sea blanco y negro para que sea más elegante */
        ">`;

    // 2. Dibujamos tus socios
    ["FRAN", "SANTI", "SANTOS", "JESÚS", "MANU", "JR", "MIGUEL", "NUÑEZ", "SILVA", "LUIS", "ROSADO"].forEach(s => {
        const data = tickets[s] || [];
        const cant = data.filter(i => i.n && !i.esComida).reduce((acc, i) => acc + i.cant, 0);
        const claseActivo = cant > 0 ? "activo" : "";
        
        // Importante: he añadido z-index: 1 a los botones para que queden por encima del logo
        cont.innerHTML += `
            <div class="btn-socio ${claseActivo}" 
                 style="position: relative; z-index: 1;" 
                 onclick="abrirTPV('${s}')">
                 ${s} ${cant > 0 ? `<span style="position:absolute; top:-8px; right:-8px; background:var(--danger); color:white; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:2px solid white; font-size:14px;">${cant}</span>` : ''}
            </div>`;
    });

    // 3 y 4. CONTENEDOR DE BOTONES (HISTORIAL Y REPONEDOR)
    cont.innerHTML += `
        <div style="position: absolute; bottom: 25px; right: 25px; display: flex; gap: 20px; z-index: 10;">
            
            <button onclick="abrirReposicion()" 
                style="width: 110px; height: 110px; border-radius: 25px; background: #546e7a; color: white; border: 4px solid white; box-shadow: 0 6px 20px rgba(0,0,0,0.4); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.85em; font-weight: bold; transition: transform 0.1s;">
                <span style="font-size: 2.5em; margin-bottom: 5px;">🛠️</span>
                REPONEDOR
            </button>

            <button onclick="mostrarHistorialTiquets()" 
                style="width: 110px; height: 110px; border-radius: 25px; background: var(--primary); color: white; border: 4px solid white; box-shadow: 0 6px 20px rgba(0,0,0,0.4); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.85em; font-weight: bold; transition: transform 0.1s;">
                <span style="font-size: 2.5em; margin-bottom: 5px;">📂</span>
                HISTORIAL
            </button>

        </div>`;
}
function abrirTPV(n) { 
    socioActivo = n; 
    let data = tickets[n] || []; 
    carrito = data.filter(i => i.n && !i.esHistorial); 
    historial = data.filter(i => i.esHistorial); 
    let comidaG = data.find(i => i.esComida); 
    listInv = comidaG ? comidaG.datos : []; 
    comensalSel = ""; 

    // Al ocultar esta pantalla, el botón que hemos metido dentro también desaparece
    document.getElementById('pantalla-socios').style.display = 'none'; 
    
    document.getElementById('interfaz-tpv').style.display = 'grid'; 
    document.getElementById('nombre-socio').innerText = n; 
    renderTabs(); 
    renderProds(); 
    actualizarTicket(); 
}
function renderTabs() { const cont = document.getElementById('tab-container'); cont.innerHTML = Object.keys(CATEGORIAS).map(c => `<button style="padding:12px; flex:1; border:none; border-radius:10px; font-weight:bold; font-size:0.85em; background:${c===catActiva?'var(--accent)':'#cbd5e0'}; color:${c===catActiva?'white':'black'}" onclick="catActiva='${c}'; renderTabs(); renderProds()">${c}</button>`).join(''); }
function renderProds() { 
    document.getElementById('grid-prods').innerHTML = CATEGORIAS[catActiva].map(n => { 
        const esE = (catActiva === "ESPIRITUOSOS"); 
        const stockTxt = esE ? (stockActual[n]/700).toFixed(1)+' Bot.' : stockActual[n]+' uds'; 
        
        // 1. Ocultamos stock para LIMPIEZA y DESCORCHES
        const htmlStock = (n === "LIMPIEZA" || n.includes("DESCORCHE")) ? '' : `<small style="color:#666; font-size:0.7em;">Quedan: ${stockTxt}</small>`;

        // 2. Acortamos el nombre si es DESCORCHE
        const nombreAMostrar = n.includes("DESCORCHE") ? "DESCORCHE" : n;

        // 3. ¡ESTA ES LA CLAVE!: Todos llaman a abrirTecladoProd('${n}')
        return `<div class="card" onclick="abrirTecladoProd('${n}')">
                    <img src="${getImg(n)}" onerror="this.style.opacity='0.1'">
                    <b>${nombreAMostrar}</b>
                    <span style="color:var(--success); font-weight:bold; font-size:1em;">${PRECIOS[n].toFixed(2)}€</span>
                    ${htmlStock}
                </div>`; 
    }).join(''); 
}
function verTiquetDetallado() {
    document.getElementById('btn-final-enviar').style.display = 'block';
    document.getElementById('btn-cierre-parcial').style.display = 'block';
    document.querySelector('#modal-tiquet-final h3').innerText = "DESGLOSE DE TIQUE";   
    const cont = document.getElementById('cont-tiquet-papel');
    const totalBarHist = historial.reduce((acc, i) => acc + (i.p * i.cant), 0);
    const totalExterno = listInv.reduce((acc, i) => acc + i.g, 0);
    const canonTotal = listInv.reduce((acc, i) => acc + (i.a * 1), 0);
    const baseRepartoHistorial = totalBarHist + totalExterno;
    const totalCoef = listInv.reduce((acc, i) => acc + (i.a * 1) + (i.k * 0.5), 0);
    const precioU = totalCoef > 0 ? baseRepartoHistorial / totalCoef : 0;
    const hoy = new Date().toLocaleDateString();
    const hayHistorial = historial.length > 0;

    let h = `<div style="text-align:center; font-weight:bold; border-bottom:2px solid #000; margin-bottom:10px;">TIQUE SHOKO - ${socioActivo} - ${hoy}</div>`;
    
    // --- LÓGICA PARA EL DESGLOSE EN PANTALLA (Filtrando Limpieza) ---
    if (!hayHistorial) {
        if (carrito.length > 0) {
            h += `<b>--- CONSUMO PRODUCTOS SHOKO ---</b><br>`;
            // Filtramos LIMPIEZA para que no salga aquí
            carrito.filter(i => !i.n.includes("LIMPIEZA")).forEach(i => {
                h += `<div class="tiquet-linea"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}</span></div>`;
            });
        }
    } else {
        h += `<b>--- CONSUMO PRODUCTOS SHOKO (1ª CUENTA) ---</b><br>`;
        // Filtramos LIMPIEZA en el historial
        historial.filter(i => i.p > 0 && !i.n.includes("LIMPIEZA")).forEach(i => {
            h += `<div class="tiquet-linea"><span style="color:#555;">${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}</span></div>`;
        });
        
        if (carrito.length > 0) {
            h += `<br><b>--- CONSUMO PRODUCTOS SHOKO (2ª CUENTA) ---</b><br>`;
            // Filtramos LIMPIEZA en el carrito actual
            carrito.filter(i => !i.n.includes("LIMPIEZA")).forEach(i => {
                h += `<div class="tiquet-linea"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}</span></div>`;
            });
        }
    }

    // --- SECCIÓN COSTES FIJOS ---
    if (canonTotal > 0) {
        h += `<br><b>--- COSTES FIJOS ---</b><br>`;
        h += `<div class="tiquet-linea"><span>Cuota mayores de 13 años</span><span>${canonTotal.toFixed(2)}</span></div>`;
    }

    // --- SECCIÓN GASTOS COMIDA (Solo ingredientes) ---
    if (totalExterno > 0) {
        h += `<br><b>--- GASTOS COMIDA ---</b><br>`;
        h += `<div class="tiquet-linea"><span>Total gastos en ingredientes</span><span>${totalExterno.toFixed(2)}</span></div>`;
    }

    // --- SECCIÓN INDEPENDIENTE: SERVICIO DE LIMPIEZA ---
    const itemLimpieza = [...carrito, ...historial].find(i => i.n.includes("LIMPIEZA"));
    if (itemLimpieza) {
        const costeL = itemLimpieza.cant * itemLimpieza.p;
        const textoHora = itemLimpieza.cant === 1 ? "hora" : "horas";
        
        h += `<br><b>--- SERVICIO DE LIMPIEZA ---</b><br>`;
        h += `<div class="tiquet-linea">
                <span>${itemLimpieza.cant} ${textoHora}</span>
                <span>${costeL.toFixed(2)}</span>
              </div>`;
    }

    // --- TOTAL FINAL ---
    const totalCuentaSocio = carrito.reduce((acc, i)=>acc+(i.p*i.cant),0) + totalBarHist + canonTotal;
    h += `<br><div class="tiquet-linea" style="font-weight:bold; font-size:1.2em;"><span>TOTAL TIQUE SHOKO</span><span>${totalCuentaSocio.toFixed(2)}€</span></div><br>`;
    
    // --- DESGLOSE REPARTO ---
    if (listInv.length > 0) {
        h += `<b>--- DESGLOSE REPARTO ---</b><br>`;
        listInv.forEach(inv => {
            const nombreLimpio = inv.n || socioActivo;
            const puntos = (inv.a * 1) + (inv.k * 0.5);
            const parteHistorial = (puntos * precioU) + (inv.a * 1);
            const consumoIndividualActual = carrito.filter(item => item.n.includes(`(${nombreLimpio})`)).reduce((acc, item) => acc + (item.p * item.cant), 0);
            const totalDebe = parteHistorial + consumoIndividualActual;
            const bal = totalDebe - inv.g;
            let leyendaEstado = "";
            
            if (nombreLimpio === socioActivo) {
                leyendaEstado = `PAGAR A SHOKO: ${totalCuentaSocio.toFixed(2)}€`;
            } else if (bal > 0) {
                leyendaEstado = `PAGAR A ${socioActivo}: ${bal.toFixed(2)}€`;
            } else {
                leyendaEstado = `RECIBIR DE ${socioActivo}: ${Math.abs(bal).toFixed(2)}€`;
            }

            h += `<div style="border-bottom:1px solid #eee; margin-bottom:5px; padding-bottom:2px;">
                    <div class="tiquet-linea"><b>${nombreLimpio}</b> <span>${totalDebe.toFixed(2)}€</span></div>
                    <div style="font-size:0.7em; color:#666; display:flex; justify-content:space-between;">
                        <span>1ª: ${parteHistorial.toFixed(2)} + 2ª: ${consumoIndividualActual.toFixed(2)}</span>
                        <span style="color:${(nombreLimpio === socioActivo || bal > 0) ? 'red' : 'green'}; font-weight:bold;">${leyendaEstado}</span>
                    </div>
                  </div>`;
        });
    }
    
    cont.innerHTML = h;
    document.getElementById('modal-tiquet-final').style.display = 'flex';
}

    Object.values(tickets).forEach(tiquetSocio => {
        tiquetSocio.forEach(item => {
            if (item.n && !item.n.includes("DESCORCHE") && item.p > 0) {

            }
        });
    });

    cont.innerHTML = CATEGORIAS[cat].filter(n => STOCK_IDEAL[n]).map(n => { 
        const esE = (cat === "ESPIRITUOSOS"); 
        // Stock real = Stock en almacén - lo que se está consumiendo ahora mismo
        const stockRealTime = stockActual[n] - (retenido[n] || 0);
        return `<div class="card" onclick="abrirEdicionRepo('${n}')">
            <img src="${getImg(n)}" onerror="this.style.opacity='0.1'">
            <b>${n}</b>

    const valStr = document.getElementById('input-cantidad').innerText; 
    const valorNum = parseFloat(valStr) || 0; 

    if (currentEditType === 'prod') { 
        cantTemp = parseFloat(valStr) || 1; 
        document.getElementById('modal-cantidad').style.display = 'none'; 
        
        // CAMBIO AQUÍ: Solo pide comensal si HAY HISTORIAL (Cierre parcial hecho)
        if (historial.length > 0 && listInv.length > 0) {
            abrirSelectorComensal(); 
        } else {
            finalizarApunte(""); 
        } 
    } else if (currentEditType === 'adulto') { 
        listInv[editingInvIdx].a = parseInt(valorNum) || 0; 
        renderInv(); 
        document.getElementById('modal-cantidad').style.display = 'none'; 
    } else if (currentEditType === 'nino') { 
        listInv[editingInvIdx].k = valorNum || 0; 
        renderInv(); 
        document.getElementById('modal-cantidad').style.display = 'none'; 
    } else if (currentEditType === 'gasto') { 
        listInv[editingInvIdx].g = valorNum || 0; 
        renderInv(); 
        document.getElementById('modal-cantidad').style.display = 'none'; 
    } 
    guardarTicketParcial(); 
}

function abrirSelectorComensal() { const cont = document.getElementById('grid-comensales-modal'); cont.innerHTML = ""; listInv.forEach(inv => { const nombre = inv.n || socioActivo; cont.innerHTML += `<button class="btn-comensal-modal" onclick="finalizarApunte('${nombre}')">${nombre}</button>`; }); cont.innerHTML += `<button class="btn-comensal-modal" style="background:#f8fafc; border-style:dashed; color:var(--accent);" onclick="abrirNuevoInvitadoDirecto()">+ NUEVO INVITADO</button>`; document.getElementById('modal-asignar-comensal').style.display = 'flex'; }
function abrirNuevoInvitadoDirecto() { document.getElementById('modal-asignar-comensal').style.display = 'none'; flgNuevoInv = true; listInv.push({n: "", a: 0, k: 0, g: 0}); abrirTecladoTexto(listInv.length - 1); }
function finalizarApunte(com) { 
    const nFinal = com ? `${prodTemp} (${com})` : prodTemp; 
    const ex = carrito.find(i => i.n === nFinal); 
    if(ex) ex.cant += cantTemp; 
    else carrito.push({n: nFinal, cant: cantTemp, p: PRECIOS[prodTemp], esLicor: CATEGORIAS["ESPIRITUOSOS"].includes(prodTemp)}); 
    
    // Solo resta stock si NO es descorche Y NO es limpieza
    if (!prodTemp.includes("DESCORCHE") && prodTemp !== "LIMPIEZA" && PRECIOS[prodTemp] > 0) {
        const factor = CATEGORIAS["ESPIRITUOSOS"].includes(prodTemp) ? ML_COPA : 1;
        stockActual[prodTemp] -= (cantTemp * factor);
    }
    document.getElementById('modal-asignar-comensal').style.display = 'none'; 
    guardarTicketParcial(); 
}
function abrirEdicionTicket(n) { prodTemp = n; inputVal = ""; const item = carrito.find(i => i.n === n); document.getElementById('edit-nombre').innerText = n; document.getElementById('txt-actual').innerText = "Cantidad actual: " + item.cant; document.getElementById('edit-input-display').innerText = "0"; document.getElementById('btn-eliminar-fila').style.display = 'block'; document.getElementById('modal-edit').style.display = 'flex'; }
function presionarNum(v) { 
    // Forzamos a que inputVal sea tratado como cadena
    if (typeof inputVal !== 'string') inputVal = "";

    if (inputVal === "" || inputVal === "0") {
        inputVal = v.toString();
    } else {
        if (v === '.' && inputVal.includes('.')) return;
        inputVal += v.toString();
    }
    
    // Actualizamos el display del modal de CANTIDAD
    const display = document.getElementById('input-cantidad');
    if(display) display.innerText = inputVal;
}
function presionarNumEdit(v) {
    if (typeof inputVal !== 'string') inputVal = "";
    
    if (inputVal === "" || inputVal === "0") {
        inputVal = v.toString();
    } else {
        if (v === '.' && inputVal.includes('.')) return;
        inputVal += v.toString();
    }
    
    const display = document.getElementById('edit-input-display');
    if(display) display.innerText = inputVal;
}
function aplicarEdicion(signo) { 
    const val = parseFloat(document.getElementById('edit-input-display').innerText) || 0; 
    if (modoRepoActivo) { 
        const esE = CATEGORIAS["ESPIRITUOSOS"].includes(prodTemp); 
        stockActual[prodTemp] += ((esE ? val * 700 : val) * signo); 
        localStorage.setItem('v29_stock', JSON.stringify(stockActual)); 
        mostrarProductosRepo(catActiva); 
    } else { 
        const item = carrito.find(i => i.n === prodTemp); 
        if (item) { 
            const base = prodTemp.split(" (")[0];
            const factor = CATEGORIAS["ESPIRITUOSOS"].includes(base) ? ML_COPA : 1;
            stockActual[base] += (item.cant * factor);
            item.cant += (val * signo); 
            if (item.cant <= 0) carrito = carrito.filter(i => i.n !== prodTemp);
            else stockActual[base] -= (item.cant * factor);
        } 
    } 
    guardarTicketParcial(); 
    document.getElementById('modal-edit').style.display = 'none'; 
}
function eliminarFilaEdicion() { 
    const item = carrito.find(i => i.n === prodTemp);
    if(item) {
        const base = prodTemp.split(" (")[0];
        const factor = CATEGORIAS["ESPIRITUOSOS"].includes(base) ? ML_COPA : 1;
        stockActual[base] += (item.cant * factor);
    }
    carrito = carrito.filter(i => i.n !== prodTemp); 
    guardarTicketParcial(); 
    document.getElementById('modal-edit').style.display = 'none'; 
}
function generarListaCompra() { 
    let h = `
        <div style="display: grid; grid-template-columns: 1fr 50px 50px 60px; gap: 5px; font-weight: bold; font-size: 0.75em; border-bottom: 2px solid #333; padding-bottom: 5px; margin-bottom: 10px; text-align: center;">
            <div style="text-align: left;">Producto</div>
            <div>Ideal</div>
            <div>Stock</div>
            <div>Pedir</div>
        </div>
    `; 

    let hayFaltas = false;

    Object.keys(STOCK_IDEAL).forEach(n => { 
        const ideal = STOCK_IDEAL[n];
        const actual = stockActual[n];
        const falta = ideal - actual; 

        if(falta > 0) { 
            hayFaltas = true;
            const esE = CATEGORIAS["ESPIRITUOSOS"].includes(n); 
            
            // Formateo de cantidades para que quepan bien
            const idealTxt = esE ? (ideal/700).toFixed(1) : ideal;
            const actualTxt = esE ? (actual/700).toFixed(1) : actual;
            const faltaTxt = esE ? (falta/700).toFixed(1) : falta;

            h += `
                <div style="display: grid; grid-template-columns: 1fr 50px 50px 60px; gap: 5px; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.85em; align-items: center; text-align: center;">
                    <div style="text-align: left; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${n}</div>
                    <div style="color: #7f8c8d;">${idealTxt}</div>
                    <div style="color: #3498db;">${actualTxt}</div>
                    <div style="color: var(--danger); font-weight: bold; background: #fff5f5;">${faltaTxt}</div>
                </div>
            `; 
        } 
    }); 

    document.getElementById('cuerpo-compra').innerHTML = hayFaltas ? h : "<p style='text-align:center; padding: 20px;'>✅ El stock está completo</p>"; 
    document.getElementById('modal-compra').style.display = 'flex'; 
}
function cerrarTPVCompletamente() { document.getElementById('modal-reparto').style.display = 'none'; }
function crearTeclado(id, funcName) { 
    const cont = document.getElementById(id); 
    if (!cont) return;
    cont.innerHTML = ""; 
    
    for(let i=1; i<=9; i++) {
        cont.innerHTML += `<button class="tecla" onclick="${funcName}('${i}')">${i}</button>`;
    }
    
    cont.innerHTML += `<button class="tecla" onclick="${funcName}('.')">.</button>`; 
    cont.innerHTML += `<button class="tecla" onclick="${funcName}('0')">0</button>`; 
    
    // El botón C ahora limpia la variable global y el dibujo
    cont.innerHTML += `<button class="tecla" style="background:#ccc;" onclick="inputVal=''; document.getElementById('${id==='teclado-nums'?'input-cantidad':'edit-input-display'}').innerText='0'">C</button>`; 
    
    if (id === 'teclado-nums') {
        cont.innerHTML += `<button class="tecla" style="background:var(--success);color:white; grid-column: span 3; padding: 25px;" onclick="confirmar()">ACEPTAR</button>`;
    }
}

// 4. Inicialización (Asegúrate de que esto esté al final)
crearTeclado('teclado-nums', 'presionarNum');
crearTeclado('teclado-edit', 'presionarNumEdit');
renderSocios();

function cerrarModalTiquet() {
    // 1. Cerramos la ventana
    document.getElementById('modal-tiquet-final').style.display = 'none';
    
    // 2. Restauramos el título original por si venimos del historial
    const titulo = document.querySelector('#modal-tiquet-final h3');
    if(titulo) titulo.innerText = "DESGLOSE DE TIQUE";
    
    // 3. Volvemos a mostrar los botones de cobro
    const btnCierre = document.getElementById('btn-final-enviar');
    const btnParcial = document.getElementById('btn-cierre-parcial');
    
    if(btnCierre) btnCierre.style.display = 'block';
    if(btnParcial) btnParcial.style.display = 'block';
}
