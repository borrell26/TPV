<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPV Shoko - T7 Híbrido</title>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --bg: #f4f7f6; --danger: #e74c3c; --warning: #f39c12; --white: #ffffff; --gray: #95a5a6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        
        #pantalla-socios { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; height: 100vh; box-sizing: border-box; align-content: start; }
        #interfaz-tpv { display: none; grid-template-columns: 1fr 350px; height: 100vh; }

        .btn-socio { background: var(--white); border: 2px solid var(--primary); border-radius: 15px; padding: 35px 10px; font-weight: bold; font-size: 1.4em; cursor: pointer; text-align: center; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-socio.activo { background: #ffeaa7; border-color: var(--warning); }
        .nav-reponedor { background: var(--warning); color: var(--primary); padding: 20px; border-radius: 15px; text-align: center; font-weight: bold; cursor: pointer; width: 100%; border: 2px solid var(--primary); box-sizing: border-box; grid-column: 1 / -1; font-size: 1.3em; margin-bottom: 10px; }

        .card { background: var(--white); border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; height: 145px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; }
        .card img { height: 60px; width: auto; max-width: 90%; object-fit: contain; }
        
        .sidebar { background: var(--primary); color: var(--white); display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        .lista { flex: 1; overflow-y: auto; margin: 10px 0; }
        .item-tiquet { display: flex; justify-content: space-between; padding: 6px 10px; background: rgba(255,255,255,0.1); margin-bottom: 3px; border-radius: 6px; cursor: pointer; font-size: 0.9em; }
        .item-historial { background: rgba(255,255,255,0.05); color: #bdc3c7; font-size: 0.8em; cursor: default; }
        
        .total-container { border-top: 2px solid rgba(255,255,255,0.2); padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .tiquet-label, .total { font-size: 1.1em; font-weight: bold; }
        
        .botonera-inferior { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .fila-botones { display: flex; gap: 8px; }
        .btn-side { border: none; border-radius: 12px; font-weight: bold; cursor: pointer; padding: 15px; color: white; flex: 1; font-size: 0.9em; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--white); padding: 20px; border-radius: 20px; width: 95%; max-width: 700px; text-align: center; color: #333; max-height: 98vh; overflow-y: auto; }
        
        .selector-modos { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-modo { flex: 1; padding: 12px 5px; border-radius: 10px; border: 2px solid #ddd; background: #f8f9fa; cursor: pointer; font-weight: bold; font-size: 0.8em; }
        .btn-modo.active { border-color: var(--accent); background: #e3f2fd; color: var(--accent); }

        .tiquet-papel { background: #fff; color: #000; padding: 20px; font-family: 'Courier New', monospace; text-align: left; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-top: 10px; font-size: 0.9em; }
        .tiquet-linea { display: flex; justify-content: space-between; margin-bottom: 3px; border-bottom: 1px dotted #ccc; }
        
        .grid-teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .tecla { background: #edf2f7; border: none; padding: 20px; font-size: 1.5em; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        .seccion-comensales { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; padding: 10px; background: #e2e8f0; border-radius: 12px; align-items: center; }
        .btn-comensal { padding: 8px 12px; border-radius: 8px; border: 2px solid var(--primary); background: white; font-weight: bold; cursor: pointer; font-size: 0.85em; }
        .btn-comensal.sel { background: var(--accent); color: white; border-color: var(--accent); }
        
        .fila-inv { display: grid; grid-template-columns: 1fr 50px 50px 70px 40px; gap: 5px; margin-bottom: 8px; align-items: center; }
        .fila-inv div { background: #f8fafc; border: 1px solid #cbd5e0; border-radius: 8px; padding: 10px 2px; text-align: center; font-weight: bold; font-size: 0.9em; }
        .badge-solo-bebida { font-size: 0.6em; background: #718096; color: white; padding: 2px 4px; border-radius: 4px; margin-left: 4px; }
    </style>
</head>
<body>

<div id="pantalla-socios"></div>

<div id="interfaz-tpv">
    <div style="padding:10px; display:flex; flex-direction:column; overflow:hidden;">
        <div id="selector-comensales" class="seccion-comensales" style="display:none;"></div>
        <div class="tabs" id="tab-container" style="display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap;"></div>
        <div id="grid-prods" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(145px, 1fr)); gap:12px; overflow-y:auto;"></div>
    </div>
    <div class="sidebar">
        <h2 id="nombre-socio" style="margin:0; font-size:1.8em; text-align:center;">Socio</h2>
        <div class="lista" id="ticket-lista"></div>
        <div class="total-container">
            <span class="tiquet-label">TIQUE SHOKO</span>
            <div class="total" id="total-txt">0.00€</div>
        </div>
        <div class="botonera-inferior">
            <div class="fila-botones">
                <button class="btn-side" style="background:var(--accent);" onclick="abrirModalReparto()">🍽️ COMIDA</button>
                <button class="btn-side" style="background:var(--warning); color:#000;" onclick="verTiquetDetallado()">👁️ VER TIQUE</button>
            </div>
            <button id="btn-cierre-parcial" class="btn-side" style="background:var(--success);" onclick="cierreParcial()">📦 CIERRE PARCIAL</button>
            <div class="fila-botones">
                <button class="btn-side" style="background:#7f8c8d;" onclick="alert('Limpieza')">🧹 LIMPIEZA</button>
                <button class="btn-side" style="background:#4a5568;" onclick="location.reload()">🔙 ATRÁS</button>
            </div>
        </div>
    </div>
</div>

<div id="modal-reparto" class="modal">
    <div class="modal-content">
        <h2>Gestión de Reparto</h2>
        
        <div class="selector-modos">
            <button id="m-escote" class="btn-modo active" onclick="setModo('escote')">🤝 A ESCOTE<br><small>Híbrido (Proporcional + Individual)</small></button>
            <button id="m-invito" class="btn-modo" onclick="setModo('invito')">🎁 INVITO YO<br><small>Socio paga todo el bar</small></button>
            <button id="m-solo-bar" class="btn-modo" onclick="setModo('solo-bar')">🍻 SOLO BAR<br><small>Anular canon/comida</small></button>
        </div>

        <div id="area-invitados">
            <div id="invitados-cont"></div>
            <button onclick="addInv()" style="width:100%; padding:12px; margin: 10px 0; background:#f0f0f0; border:2px dashed #ccc; border-radius:12px; font-weight:bold;">+ Añadir Comensal</button>
        </div>

        <div style="display:flex; flex-direction:column; gap:8px; margin-top:15px;">
            <button style="padding:15px; background:var(--primary); color:white; border:none; border-radius:12px; font-weight:bold;" onclick="document.getElementById('modal-reparto').style.display='none'">ACEPTAR</button>
            <button style="padding:10px; background:var(--danger); color:white; border:none; border-radius:12px; font-size:0.8em;" onclick="resetearComida()">BORRAR GESTIÓN COMIDA</button>
        </div>
    </div>
</div>

<div id="modal-tiquet-final" class="modal">
    <div class="modal-content" style="max-width: 480px;">
        <h3>DESGLOSE DE CUENTA</h3>
        <div id="cont-tiquet-papel" class="tiquet-papel"></div>
        <button style="width:100%; background:var(--danger); color:white; border:none; padding:20px; border-radius:12px; font-weight:bold; margin-top:15px; cursor:pointer;" onclick="cerrarVenta()">🚩 CIERRE TOTAL</button>
        <button style="width:100%; border:none; background:none; color:gray; margin-top:10px;" onclick="document.getElementById('modal-tiquet-final').style.display='none'">Cerrar vista</button>
    </div>
</div>

<div id="modal-cantidad" class="modal">
    <div class="modal-content" style="width: 350px;">
        <h3 id="titulo-modal">Cantidad</h3>
        <div id="input-cantidad" style="font-size:3em; font-weight:bold; color:var(--accent); margin-bottom:15px;">0</div>
        <div class="grid-teclado" id="teclado-nums"></div>
        <button style="width:100%; margin-top:15px; padding:15px; border:none; border-radius:12px;" onclick="document.getElementById('modal-cantidad').style.display='none'">CANCELAR</button>
    </div>
</div>

<script>
const PRECIOS = { "MAHOU 25cl.": 0.90, "ALHAMBRA 33cl.": 1.50, "COCA COLA": 1.00, "AGUA": 0.50, "VINO COPA": 2.00, "ATÚN": 8.00 };
const CATEGORIAS = { "BEBIDAS": ["MAHOU 25cl.", "ALHAMBRA 33cl.", "COCA COLA", "AGUA", "VINO COPA"], "COMIDA": ["ATÚN"] };

let tickets = JSON.parse(localStorage.getItem('shoko_t7')) || {};
let socioActivo = ""; let carrito = []; let historial = []; let listInv = [];
let modoPago = 'escote'; let comensalSel = ""; let prodTemp = ""; let inputVal = ""; let currentEditType = ""; let editingInvIdx = -1;

function renderSocios() {
    const cont = document.getElementById('pantalla-socios');
    cont.innerHTML = '<div class="nav-reponedor">🛠️ CONFIGURACIÓN TPV</div>';
    ["FRAN", "SANTI", "SANTOS", "JESÚS", "MANU"].forEach(s => {
        const cant = (tickets[s] || []).filter(i => i.n && !i.esComida && !i.esModo).length;
        cont.innerHTML += `<div class="btn-socio ${cant>0?'activo':''}" onclick="abrirTPV('${s}')">${s}</div>`;
    });
}

function abrirTPV(n) {
    socioActivo = n;
    let data = tickets[n] || [];
    carrito = data.filter(i => i.n && !i.esHistorial && !i.esComida && !i.esModo);
    historial = data.filter(i => i.esHistorial);
    let comidaG = data.find(i => i.esComida);
    listInv = comidaG ? comidaG.datos : [];
    modoPago = (data.find(i => i.esModo) || {m: 'escote'}).m;
    
    document.getElementById('pantalla-socios').style.display = 'none';
    document.getElementById('interfaz-tpv').style.display = 'grid';
    document.getElementById('nombre-socio').innerText = n;
    
    setModo(modoPago);
    actualizarSelectorComensales();
    renderTabs();
    actualizarTicket();
}

function setModo(m) {
    modoPago = m;
    document.querySelectorAll('.btn-modo').forEach(b => b.classList.remove('active'));
    document.getElementById('m-' + m).classList.add('active');
    document.getElementById('area-invitados').style.opacity = (m === 'solo-bar') ? '0.3' : '1';
    guardarTicketParcial();
    actualizarTicket();
}

function actualizarSelectorComensales() {
    const cont = document.getElementById('selector-comensales');
    if (listInv.length > 0) {
        cont.style.display = 'flex';
        cont.innerHTML = '<small>Para:</small>';
        listInv.forEach(inv => {
            const nom = inv.n || "Socio";
            cont.innerHTML += `<button class="btn-comensal ${comensalSel === nom ? 'sel' : ''}" onclick="comensalSel='${nom}'; actualizarSelectorComensales()">${nom}</button>`;
        });
        cont.innerHTML += `<button class="btn-comensal ${comensalSel === '' ? 'sel' : ''}" onclick="comensalSel=''; actualizarSelectorComensales()">COMÚN</button>`;
    } else { cont.style.display = 'none'; }
}

function addProd(n) {
    prodTemp = n;
    currentEditType = 'prod';
    inputVal = "";
    document.getElementById('titulo-modal').innerText = n;
    document.getElementById('input-cantidad').innerText = "1";
    document.getElementById('modal-cantidad').style.display = 'flex';
}

function confirmar() {
    const cant = parseFloat(document.getElementById('input-cantidad').innerText) || 0;
    if (currentEditType === 'prod') {
        const nombreFinal = comensalSel ? `${prodTemp} (${comensalSel})` : prodTemp;
        let ex = carrito.find(i => i.n === nombreFinal);
        if(ex) ex.cant += cant; else carrito.push({n: nombreFinal, cant: cant, p: PRECIOS[prodTemp]});
    } else if (currentEditType === 'adulto') { listInv[editingInvIdx].a = cant; }
    else if (currentEditType === 'gasto') { listInv[editingInvIdx].g = cant; }
    
    guardarTicketParcial();
    actualizarTicket();
    document.getElementById('modal-cantidad').style.display = 'none';
}

function verTiquetDetallado() {
    const cont = document.getElementById('cont-tiquet-papel');
    const todosProductos = [...historial, ...carrito];
    
    // 1. SEPARAR CONSUMOS
    const consumoComun = todosProductos.filter(i => !i.n.includes("("));
    const totalComunBar = consumoComun.reduce((acc, i) => acc + (i.p * i.cant), 0);
    const totalExternoComida = (modoPago === 'solo-bar') ? 0 : listInv.reduce((acc, i) => acc + i.g, 0);
    
    // 2. CALCULAR REPARTO COMÚN (Solo para los que NO son "Solo Bebida")
    const baseReparto = totalComunBar + totalExternoComida;
    const invitadosActivos = listInv.filter(inv => inv.a > 0 || inv.k > 0); // Los que participan en comida
    const totalCoef = invitadosActivos.reduce((acc, i) => (i.a * 1) + (i.k * 0.5), 0);
    const precioU = totalCoef > 0 ? baseReparto / totalCoef : 0;

    let h = `<div style="text-align:center; font-weight:bold; border-bottom:2px solid #000; margin-bottom:10px;">TIQUE SHOKO - ${socioActivo}<br>MODO: ${modoPago.toUpperCase()}</div>`;
    
    // Sección Productos (Visual)
    h += `<b>PRODUCTOS (TOTAL)</b><br>`;
    todosProductos.forEach(i => h += `<div class="tiquet-linea"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}</span></div>`);
    
    const canonT = (modoPago === 'solo-bar') ? 0 : listInv.reduce((acc, i) => acc + (i.a * 1), 0);
    const totalTiqueSocio = todosProductos.reduce((acc,i)=>acc+(i.p*i.cant),0) + canonT;
    
    h += `<br><div class="tiquet-linea" style="font-weight:bold; border-top:1px solid #000;"><span>TOTAL A PAGAR AL CLUB</span><span>${totalTiqueSocio.toFixed(2)}€</span></div><br>`;

    // DESGLOSE POR PERSONA
    h += `<b>--- DESGLOSE PERSONAL ---</b><br>`;
    if (modoPago === 'invito') {
        h += `<div style="text-align:center; border:1px dashed green; color:green; padding:5px;">EL SOCIO GESTOR INVITA AL BAR COMÚN</div>`;
    }

    listInv.forEach(inv => {
        const nom = inv.n || socioActivo;
        const esParticipanteComida = (inv.a > 0 || inv.k > 0);
        
        // A. Parte proporcional (Si no invita el socio y es participante)
        const parteComun = (modoPago === 'escote' && esParticipanteComida) ? ( ((inv.a*1)+(inv.k*0.5)) * precioU ) : 0;
        
        // B. Canon fijo (Solo participantes)
        const cuotaFija = (modoPago !== 'solo-bar' && esParticipanteComida) ? (inv.a * 1) : 0;
        
        // C. Consumo Individual (Bebidas marcadas con su nombre)
        const consumoIndiv = todosProductos.filter(i => i.n.includes(`(${nom})`)).reduce((acc, i) => acc + (i.p * i.cant), 0);
        
        const totalPersonaDebe = parteComun + cuotaFija + consumoIndiv;
        const balance = totalPersonaDebe - inv.g;

        h += `<div style="margin-bottom:8px; border-bottom:1px solid #eee;">
                <div class="tiquet-linea"><b>${nom}</b> <span>${totalPersonaDebe.toFixed(2)}€</span></div>
                <div style="font-size:0.7em; color:#666;">Prop: ${parteComun.toFixed(2)} | Indiv: ${consumoIndiv.toFixed(2)} | Cuota: ${cuotaFija.toFixed(2)}</div>
                <div style="text-align:right; font-size:0.8em; font-weight:bold; color:${nom===socioActivo?'red':(balance>0?'#e67e22':'green')}">
                    ${nom===socioActivo ? 'Paga a Club: '+totalTiqueSocio.toFixed(2) : (balance>0?'Paga a '+socioActivo+': '+balance.toFixed(2) : 'Recibe: '+Math.abs(balance).toFixed(2))}€
                </div>
              </div>`;
    });

    cont.innerHTML = h;
    document.getElementById('modal-tiquet-final').style.display = 'flex';
}

// FUNCIONES BASE T6
function renderTabs() {
    const cont = document.getElementById('tab-container');
    cont.innerHTML = Object.keys(CATEGORIAS).map(c => `<button style="flex:1; padding:10px; border-radius:8px; border:none; background:var(--primary); color:white;" onclick="renderProds('${c}')">${c}</button>`).join('');
    renderProds("BEBIDAS");
}
function renderProds(cat) {
    const cont = document.getElementById('grid-prods');
    cont.innerHTML = CATEGORIAS[cat].map(n => `<div class="card" onclick="addProd('${n}')"><b>${n}</b><br>${PRECIOS[n].toFixed(2)}€</div>`).join('');
}
function actualizarTicket() {
    let t = 0; let html = "";
    carrito.forEach(i => { t += i.p * i.cant; html += `<div class="item-tiquet" onclick="eliminarFila('${i.n}')"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}€</span></div>`; });
    historial.forEach(i => { t += i.p * i.cant; html += `<div class="item-tiquet item-historial"><span>(H) ${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}€</span></div>`; });
    if(modoPago !== 'solo-bar') {
        const canon = listInv.reduce((acc, i) => acc + (i.a * 1), 0);
        if(canon > 0) html += `<div class="item-tiquet" style="border:1px dashed #fff;"><span>Cuota Mayores</span><span>${canon.toFixed(2)}€</span></div>`;
        t += canon;
    }
    document.getElementById('ticket-lista').innerHTML = html;
    document.getElementById('total-txt').innerText = t.toFixed(2) + "€";
    document.getElementById('btn-cierre-parcial').disabled = (historial.length > 0);
}
function addInv() { listInv.push({n: "Inv " + (listInv.length+1), a: 1, k: 0, g: 0}); renderInv(); actualizarSelectorComensales(); }
function renderInv() {
    const cont = document.getElementById('invitados-cont');
    cont.innerHTML = listInv.map((inv, i) => `
        <div class="fila-inv">
            <div style="text-align:left; font-size:0.7em;">${inv.n}</div>
            <div onclick="editingInvIdx=${i}; currentEditType='adulto'; abrirModalNum()">${inv.a}</div>
            <div onclick="listInv[${i}].k = (listInv[${i}].k==1?0:1); renderInv();">${inv.k}</div>
            <div onclick="editingInvIdx=${i}; currentEditType='gasto'; abrirModalNum()">${inv.g}€</div>
            <button onclick="listInv.splice(${i},1); renderInv(); actualizarSelectorComensales();" style="border:none; color:red; background:none;">×</button>
        </div>
    `).join('');
}
function abrirModalNum() { document.getElementById('input-cantidad').innerText="0"; document.getElementById('modal-cantidad').style.display='flex'; }
function presionarNum(v) { let d = document.getElementById('input-cantidad'); if(v==='C') d.innerText="0"; else d.innerText = (d.innerText==="0"?v:d.innerText+v); }
function cierreParcial() { carrito.forEach(i => historial.push({...i, esHistorial: true})); carrito = []; guardarTicketParcial(); actualizarTicket(); }
function guardarTicketParcial() { tickets[socioActivo] = [...carrito, ...historial, {esComida:true, datos:listInv}, {esModo:true, m:modoPago}]; localStorage.setItem('shoko_t7', JSON.stringify(tickets)); }
function resetearComida() { listInv = []; modoPago = 'escote'; guardarTicketParcial(); location.reload(); }
function cerrarVenta() { delete tickets[socioActivo]; localStorage.setItem('shoko_t7', JSON.stringify(tickets)); location.reload(); }
function eliminarFila(n) { carrito = carrito.filter(i => i.n !== n); guardarTicketParcial(); actualizarTicket(); }

const k = document.getElementById('teclado-nums');
for(let i=1; i<=9; i++) k.innerHTML += `<button class="tecla" onclick="presionarNum('${i}')">${i}</button>`;
k.innerHTML += `<button class="tecla" onclick="presionarNum('C')">C</button><button class="tecla" onclick="presionarNum('0')">0</button><button class="tecla" style="background:var(--success); color:white;" onclick="confirmar()">OK</button>`;

renderSocios();
</script>
</body>
</html>
