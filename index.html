<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPV Shoko - P1 MASTER TOTAL</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --bg: #f4f7f6; --danger: #e74c3c; --warning: #f39c12; --white: #ffffff; --gray: #95a5a6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        #pantalla-socios { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; height: 100vh; box-sizing: border-box; align-content: start; }
        #interfaz-tpv { display: none; grid-template-columns: 1fr 350px; height: 100vh; }
        .btn-socio { background: var(--white); border: 2px solid var(--primary); border-radius: 15px; padding: 35px 10px; font-weight: bold; font-size: 1.4em; cursor: pointer; text-align: center; position: relative; }
        .btn-socio.activo { background: #ffeaa7; border-color: var(--warning); }
        .sidebar { background: var(--primary); color: var(--white); display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        .lista { flex: 1; overflow-y: auto; margin: 10px 0; }
        .item-tiquet { display: flex; justify-content: space-between; padding: 6px 10px; background: rgba(255,255,255,0.1); margin-bottom: 3px; border-radius: 6px; cursor: pointer; font-size: 0.9em; }
        .item-historial { background: rgba(255,255,255,0.05); color: #bdc3c7; cursor: default; }
        .total-container { border-top: 2px solid rgba(255,255,255,0.2); padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .btn-side { border: none; border-radius: 12px; font-weight: bold; cursor: pointer; padding: 15px; color: white; flex: 1; font-size: 0.9em; margin-bottom: 5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--white); padding: 20px; border-radius: 20px; width: 90%; max-width: 650px; text-align: center; max-height: 98vh; overflow-y: auto; }
        .tiquet-papel { background: #fff; color: #000; padding: 20px; font-family: 'Courier New', monospace; text-align: left; border: 1px solid #ccc; font-size: 0.85em; }
        .tiquet-linea { display: flex; justify-content: space-between; margin-bottom: 3px; border-bottom: 1px dotted #ccc; }
        .grid-teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .tecla { background: #edf2f7; border: none; padding: 20px; font-size: 1.5em; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .fila-inv { display: grid; grid-template-columns: 1fr 60px 60px 80px 40px; gap: 8px; margin-bottom: 10px; }
        .fila-inv div { background: #f8fafc; border: 1px solid #cbd5e0; border-radius: 8px; padding: 12px; font-weight: bold; }
        .bloqueado { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<div id="pantalla-socios"></div>

<div id="interfaz-tpv">
    <div style="padding:10px; display:flex; flex-direction:column; overflow:hidden;">
        <div id="tab-container" style="display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap;"></div>
        <div id="grid-prods" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(145px, 1fr)); gap:12px; overflow-y:auto;"></div>
    </div>
    <div class="sidebar">
        <h2 id="nombre-socio" style="margin:0; text-align:center;">Socio</h2>
        <div class="lista" id="ticket-lista"></div>
        <div class="total-container"><b>TIQUE SHOKO</b><div id="total-txt" style="font-weight:bold;">0.00€</div></div>
        <button class="btn-side" style="background:var(--accent);" onclick="abrirModalReparto()">🍽️ COMIDA</button>
        <button class="btn-side" style="background:var(--warning); color:#000;" onclick="verTiquetDetallado()">👁️ VER TIQUE</button>
        <button id="btn-cierre-parcial" class="btn-side" style="background:var(--success);" onclick="cierreParcial()">📦 CIERRE PARCIAL</button>
        <button class="btn-side" style="background:#4a5568;" onclick="location.reload()">🔙 ATRÁS</button>
    </div>
</div>

<div id="modal-tiquet-final" class="modal">
    <div class="modal-content">
        <h3>DESGLOSE DE CUENTA</h3>
        <div id="cont-tiquet-papel" class="tiquet-papel"></div>
        <button id="btn-cierre-final" style="width:100%; background:var(--danger); color:white; border:none; padding:20px; border-radius:12px; font-weight:bold; margin-top:15px;" onclick="cerrarVenta()">🚩 CIERRE TOTAL (Auto-Mail)</button>
        <button class="btn-side" style="background:#ccc; color:black; width:100%; margin-top:10px;" onclick="document.getElementById('modal-tiquet-final').style.display='none'">VOLVER</button>
    </div>
</div>

<div id="modal-reparto" class="modal">
    <div class="modal-content">
        <h2 id="titulo-reparto">Gestión Comida</h2>
        <div id="invitados-cont"></div>
        <button id="btn-add-inv" onclick="addInv()" style="width:100%; padding:15px; margin: 10px 0; background:#f0f0f0; border:2px dashed #ccc; border-radius:12px;">+ Añadir Comensal</button>
        <button class="btn-side" style="background:var(--primary); width:100%;" onclick="document.getElementById('modal-reparto').style.display='none'">CERRAR</button>
    </div>
</div>

<div id="modal-cantidad" class="modal"><div class="modal-content" style="width: 400px;"><h3 id="titulo-prod-modal"></h3><div id="input-cantidad" style="font-size:4em; font-weight:bold; color: var(--accent);">0</div><div class="grid-teclado" id="teclado-nums"></div><button class="btn-side" style="background:#ccc; color:black; width:100%;" onclick="document.getElementById('modal-cantidad').style.display='none'">CANCELAR</button></div></div>
<div id="modal-teclado-texto" class="modal"><div class="modal-content"><h3>Nombre</h3><div id="display-texto" style="font-size:2em; font-weight:bold; background:#eee; padding:15px; border-radius:10px; margin-bottom:10px;"></div><div class="teclado-texto" style="display:grid; grid-template-columns:repeat(10,1fr); gap:5px;" id="grid-teclado-texto"></div><button class="btn-side" style="background:var(--success); width:100%; margin-top:20px;" onclick="confirmarTexto()">ACEPTAR</button></div></div>
<div id="modal-asignar-comensal" class="modal"><div class="modal-content"><h3>¿Asignar a quién?</h3><div id="grid-comensales-modal" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div><button class="btn-side" style="background:#ccc; color:black; width:100%; margin-top:10px;" onclick="document.getElementById('modal-asignar-comensal').style.display='none'">CANCELAR</button></div></div>

<script>
(function(){ emailjs.init("TU_PUBLIC_KEY"); })();

const EMAILS_SOCIOS = { "MIGUEL": "mguardiz@gmail.com", "FRAN": "", "SANTI": "", "SANTOS": "", "JESÚS": "", "MANU": "", "JR": "", "NUÑEZ": "", "SILVA": "", "LUIS": "", "ROSADO": "" };
const PRECIOS = { "MAHOU 25cl.": 0.90, "ALHAMBRA 33cl.": 1.50, "BUDWEISSER 33cl.": 1.50, "MAHOU SIN 25cl.": 0.90, "COCA COLA": 1.00, "COCA COLA ZERO": 1.00, "FANTA NARANJA": 1.00, "FANTA LIMÓN": 1.00, "SPRITE": 1.00, "ACUARIUS NARANJA": 1.00, "ACUARIUS LIMÓN": 1.00, "NESTEÁ LIMÓN": 1.00, "TÓNICA SCHWEPPES": 1.00, "TÓNICA SCHWEPPES ZERO": 1.00, "CASERA BLANCA 0,5L": 0.50, "AGUA": 0.50, "VIÑAS DEL VERO": 9.00, "BERONIA CRIANZA": 9.00, "BERONIA RESERVA": 16.00, "TIO PEPE 50cl.": 6.00, "MANZANILLA 50CL.": 6.00, "TINTO BÁSICO 70cl.": 2.00, "CROFT TWIST": 6.00, "DESCORCHE VINO": 2.00, "BARCELÓ": 2.00, "WHITE LABEL": 2.00, "RIVES": 2.00, "PINK RIVES": 2.00, "RIVES EXÓTICA": 2.00, "DESCORCHE COPA": 3.00, "ATÚN ENCEBOLLADO": 8.00, "ATÚN FRITADA": 8.00, "PATATAS FRITAS": 0.60 };
const CATEGORIAS = { "CERVEZAS": ["MAHOU 25cl.", "ALHAMBRA 33cl.", "BUDWEISSER 33cl.", "MAHOU SIN 25cl."], "REFRESCOS": ["COCA COLA", "COCA COLA ZERO", "FANTA NARANJA", "FANTA LIMÓN", "SPRITE", "ACUARIUS NARANJA", "ACUARIUS LIMÓN", "NESTEÁ LIMÓN", "TÓNICA SCHWEPPES", "TÓNICA SCHWEPPES ZERO", "CASERA BLANCA 0,5L", "AGUA"], "VINOS": ["VIÑAS DEL VERO", "BERONIA CRIANZA", "BERONIA RESERVA", "TIO PEPE 50cl.", "MANZANILLA 50CL.", "TINTO BÁSICO 70cl.", "CROFT TWIST", "DESCORCHE VINO"], "ESPIRITUOSOS": ["BARCELÓ", "WHITE LABEL", "RIVES", "PINK RIVES", "RIVES EXÓTICA", "DESCORCHE COPA"], "OTROS": ["ATÚN ENCEBOLLADO", "ATÚN FRITADA", "PATATAS FRITAS"] };

let tickets = JSON.parse(localStorage.getItem('v29_tickets')) || {};
let socioActivo = ""; let carrito = []; let historial = []; let catActiva = "CERVEZAS";
let prodTemp = null; let inputVal = ""; let listInv = []; let editingInvIdx = -1;
let currentTexto = ""; let currentEditType = ""; let cantTemp = 1; let flgNuevoInv = false;

function renderSocios() {
    const cont = document.getElementById('pantalla-socios'); cont.innerHTML = '';
    Object.keys(EMAILS_SOCIOS).forEach(s => {
        const data = tickets[s] || []; const cant = data.filter(i => i.n && !i.esComida).reduce((acc, i) => acc + i.cant, 0);
        cont.innerHTML += `<div class="btn-socio ${cant > 0 ? "activo" : ""}" onclick="abrirTPV('${s}')">${s} ${cant > 0 ? `<span style="position:absolute; top:-8px; right:-8px; background:var(--danger); color:white; border-radius:50%; width:30px; height:30px; display:flex; align-items:center; justify-content:center;">${cant}</span>` : ''}</div>`;
    });
}

function abrirTPV(n) { socioActivo = n; let d = tickets[n] || []; carrito = d.filter(i => i.n && !i.esHistorial); historial = d.filter(i => i.esHistorial); let c = d.find(i => i.esComida); listInv = c ? c.datos : []; document.getElementById('pantalla-socios').style.display='none'; document.getElementById('interfaz-tpv').style.display='grid'; document.getElementById('nombre-socio').innerText = n; renderTabs(); renderProds(); actualizarTicket(); }

function renderTabs() { document.getElementById('tab-container').innerHTML = Object.keys(CATEGORIAS).map(c => `<button style="padding:15px; flex:1; border:none; border-radius:10px; font-weight:bold; background:${c===catActiva?'var(--accent)':'#cbd5e0'}; color:${c===catActiva?'white':'black'}" onclick="catActiva='${c}'; renderTabs(); renderProds()">${c}</button>`).join(''); }
function renderProds() { document.getElementById('grid-prods').innerHTML = CATEGORIAS[catActiva].map(n => `<div class="card" style="background:white; padding:20px; text-align:center; border-radius:12px; cursor:pointer;" onclick="abrirTecladoProd('${n}')"><b>${n}</b><br><span style="color:var(--success); font-weight:bold;">${PRECIOS[n].toFixed(2)}€</span></div>`).join(''); }

function verTiquetDetallado() {
    const cont = document.getElementById('cont-tiquet-papel');
    const totalBarHist = historial.reduce((acc, i) => acc + (i.p * i.cant), 0);
    const totalExterno = listInv.reduce((acc, i) => acc + i.g, 0);
    const canonTotal = listInv.reduce((acc, i) => acc + (i.a * 1), 0);
    const totalCoef = listInv.reduce((acc, i) => acc + (i.a * 1) + (i.k * 0.5), 0);
    const precioU = totalCoef > 0 ? (totalBarHist + totalExterno) / totalCoef : 0;
    const hoy = new Date().toLocaleDateString();

    let h = `<div style="text-align:center; font-weight:bold; border-bottom:2px solid #000; margin-bottom:10px;">TIQUE SHOKO - ${socioActivo} - ${hoy}</div>`;
    h += `<b>--- CONSUMO PRODUCTOS SHOKO (PRIMERA CUENTA) ---</b><br>`;
    if (historial.length === 0) {
        carrito.forEach(i => h += `<div class="tiquet-linea"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}</span></div>`);
    } else {
        historial.forEach(i => h += `<div class="tiquet-linea"><span style="color:#555;">${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}</span></div>`);
        if (carrito.length > 0) {
            h += `<br><b>--- CONSUMO PRODUCTOS SHOKO (SEGUNDA CUENTA) ---</b><br>`;
            carrito.forEach(i => h += `<div class="tiquet-linea"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}</span></div>`);
        }
    }
    h += `<br><b>--- COSTES FIJOS ---</b><br><div class="tiquet-linea"><span>Cuota mayores de 13 años</span><span>${canonTotal.toFixed(2)}</span></div>`;
    h += `<br><b>--- GASTOS COMIDA ---</b><br><div class="tiquet-linea"><span>Ingredientes</span><span>${totalExterno.toFixed(2)}</span></div>`;
    const tCta = (historial.length > 0 ? carrito.reduce((acc, i)=>acc+(i.p*i.cant),0) : 0) + totalBarHist + canonTotal;
    h += `<br><div class="tiquet-linea" style="font-weight:bold; font-size:1.2em;"><span>TOTAL TIQUE SHOKO</span><span>${tCta.toFixed(2)}€</span></div><br>`;
    h += `<b>--- DESGLOSE REPARTO ---</b><br>`;
    listInv.forEach(inv => {
        const n = inv.n || socioActivo; const pts = (inv.a * 1) + (inv.k * 0.5); const pH = (pts * precioU) + (inv.a * 1);
        const cI = carrito.filter(it => it.n.includes(`(${n})`)).reduce((acc, it) => acc + (it.p * it.cant), 0);
        const tD = pH + cI; const bal = tD - inv.g;
        let ley = n === socioActivo ? `PAGAR A SHOKO: ${tCta.toFixed(2)}€` : (bal > 0 ? `PAGA A ${socioActivo}: ${bal.toFixed(2)}€` : `RECIBE DE ${socioActivo}: ${Math.abs(bal).toFixed(2)}€`);
        h += `<div style="border-bottom:1px solid #eee; margin-bottom:5px;"><b>${n}</b>: ${tD.toFixed(2)}€ <br><small>${ley}</small></div>`;
    });
    cont.innerHTML = h; document.getElementById('modal-tiquet-final').style.display='flex';
}

function abrirModalReparto() {
    if (listInv.length === 0) listInv = [{n: socioActivo, a: 1, k: 0, g: 0}];
    renderInv();
    const bloq = historial.length > 0;
    document.getElementById('titulo-reparto').innerText = bloq ? "Gestión Comida (BLOQUEADA)" : "Gestión Comida";
    document.getElementById('modal-reparto').style.display = 'flex';
}

function renderInv() {
    const cont = document.getElementById('invitados-cont'); const bloq = historial.length > 0;
    cont.innerHTML = `<div class="fila-inv" style="font-weight:bold; font-size:0.7em;"><span>Nombre</span><span>>13</span><span><13</span><span>Gasto</span><span></span></div>`;
    listInv.forEach((v, i) => {
        cont.innerHTML += `<div class="fila-inv">
            <div onclick="${bloq?'':`abrirTecladoTexto(${i})`}">${v.n||'...'}</div>
            <div onclick="${bloq?'':`abrirTecladoNumComida(${i},'adulto')`}">${v.a}</div>
            <div onclick="${bloq?'':`abrirTecladoNumComida(${i},'nino')`}">${v.k}</div>
            <div onclick="${bloq?'':`abrirTecladoNumComida(${i},'gasto')`}">${v.g.toFixed(2)}€</div>
            <button onclick="${bloq?'':`listInv.splice(${i},1); renderInv(); guardarTicketParcial();`}" style="color:red; border:none; background:none; font-size:1.5em;">×</button>
        </div>`;
    });
}

function addInv() { listInv.push({n: "", a: 0, k: 0, g: 0}); renderInv(); }

function abrirTecladoProd(n) { prodTemp = n; currentEditType = 'prod'; inputVal = ""; document.getElementById('input-cantidad').innerText = "1"; document.getElementById('modal-cantidad').style.display = 'flex'; }

function abrirSelectorComensal() {
    const cont = document.getElementById('grid-comensales-modal'); cont.innerHTML = "";
    listInv.forEach(inv => { const n = inv.n || socioActivo; cont.innerHTML += `<button class="btn-comensal-modal" onclick="finalizarApunte('${n}')" style="padding:15px; border-radius:10px; border:2px solid var(--primary); font-weight:bold;">${n}</button>`; });
    cont.innerHTML += `<button onclick="flgNuevoInv=true; abrirTecladoTexto(listInv.length)" style="grid-column:span 2; padding:10px; background:var(--accent); color:white; border:none; border-radius:10px;">+ NUEVO INVITADO</button>`;
    document.getElementById('modal-asignar-comensal').style.display = 'flex';
}

function finalizarApunte(com) {
    const nF = com ? `${prodTemp} (${com})` : prodTemp; const ex = carrito.find(i => i.n === nF);
    if(ex) ex.cant += cantTemp; else carrito.push({n: nF, cant: cantTemp, p: PRECIOS[prodTemp]});
    document.getElementById('modal-asignar-comensal').style.display = 'none'; guardarTicketParcial();
}

function confirmar() {
    const val = parseFloat(document.getElementById('input-cantidad').innerText) || 0;
    if (currentEditType === 'prod') { cantTemp = val; document.getElementById('modal-cantidad').style.display = 'none'; if(listInv.length > 0) abrirSelectorComensal(); else finalizarApunte(""); }
    else if (currentEditType === 'adulto') listInv[editingInvIdx].a = val;
    else if (currentEditType === 'nino') listInv[editingInvIdx].k = val;
    else if (currentEditType === 'gasto') listInv[editingInvIdx].g = val;
    document.getElementById('modal-cantidad').style.display = 'none'; renderInv(); guardarTicketParcial();
}

function abrirTecladoTexto(idx) { editingInvIdx = idx; currentTexto = ""; document.getElementById('display-texto').innerText = ""; document.getElementById('modal-teclado-texto').style.display = 'flex'; renderTecladoTexto(); }
function renderTecladoTexto() { const cont = document.getElementById('grid-teclado-texto'); cont.innerHTML = "1234567890QWERTYUIOPASDFGHJKLÑZXCVBNM ".split("").map(l => `<button style="padding:10px;" onclick="addLetra('${l}')">${l===' '?'_':l}</button>`).join(""); }
function addLetra(l) { currentTexto += l; document.getElementById('display-texto').innerText = currentTexto; }
function confirmarTexto() { 
    if(flgNuevoInv) { listInv.push({n: currentTexto, a: 0, k: 0, g: 0}); flgNuevoInv=false; finalizarApunte(currentTexto); } 
    else { listInv[editingInvIdx].n = currentTexto; }
    document.getElementById('modal-teclado-texto').style.display = 'none'; renderInv(); 
}

function cierreParcial() { if(!confirm("¿Cerrar ronda actual?")) return; carrito.forEach(i => { const ex = historial.find(h => h.n === i.n); if(ex) ex.cant += i.cant; else historial.push({...i, esHistorial: true}); }); carrito = []; guardarTicketParcial(); actualizarTicket(); }
function guardarTicketParcial() { let d = [...carrito, ...historial]; if(listInv.length > 0) d.push({ esComida: true, datos: listInv }); tickets[socioActivo] = d; localStorage.setItem('v29_tickets', JSON.stringify(tickets)); actualizarTicket(); }
function actualizarTicket() {
    let t = 0; let h = ""; carrito.forEach(i => { t += i.p*i.cant; h += `<div class="item-tiquet"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}€</span></div>`; });
    historial.forEach(i => { t += i.p*i.cant; h += `<div class="item-tiquet item-historial"><span>(Hist) ${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}€</span></div>`; });
    const c = listInv.reduce((acc, i) => acc + (i.a * 1), 0);
    document.getElementById('ticket-lista').innerHTML = h; document.getElementById('total-txt').innerText = (t + c).toFixed(2) + "€";
    document.getElementById('btn-cierre-parcial').disabled = (historial.length > 0);
    if(historial.length > 0) document.getElementById('btn-cierre-parcial').style.opacity = "0.3";
}

function cerrarVenta() {
    if(!confirm("¿Confirmar cierre final y enviar mail?")) return;
    const btn = document.getElementById('btn-cierre-final'); btn.disabled = true; btn.innerText = "Enviando...";
    emailjs.send("TU_SERVICE_ID", "TU_TEMPLATE_ID", {
        to_name: socioActivo, to_email: EMAILS_SOCIOS[socioActivo] || "admin@shoko.com",
        message: document.getElementById('cont-tiquet-papel').innerText, total_price: document.getElementById('total-txt').innerText
    }).then(() => { alert("Enviado con éxito"); delete tickets[socioActivo]; localStorage.setItem('v29_tickets', JSON.stringify(tickets)); location.reload(); }, (e) => { alert("Error"); btn.disabled = false; });
}

function presionarNum(v) { inputVal += v; document.getElementById('input-cantidad').innerText = inputVal; }
function crearTeclado(id, func) { const cont = document.getElementById(id); for(let i=1; i<=9; i++) cont.innerHTML += `<button class="tecla" onclick="${func}('${i}')">${i}</button>`; cont.innerHTML += `<button class="tecla" onclick="${func}('.')">.</button><button class="tecla" onclick="${func}('0')">0</button><button class="tecla" onclick="inputVal=''; document.getElementById('input-cantidad').innerText='0'">C</button>`; cont.innerHTML += `<button class="tecla" style="grid-column:span 3; background:var(--success); color:white;" onclick="confirmar()">ACEPTAR</button>`; }
function abrirTecladoNumComida(idx, tipo) { editingInvIdx = idx; currentEditType = tipo; inputVal = ""; document.getElementById('input-cantidad').innerText = "0"; document.getElementById('modal-cantidad').style.display = 'flex'; }

crearTeclado('teclado-nums', 'presionarNum'); renderSocios();
</script>
</body>
</html>
