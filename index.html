<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPV Shoko - T7 Final</title>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --bg: #f4f7f6; --danger: #e74c3c; --warning: #f39c12; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        
        #pantalla-socios { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; }
        #interfaz-tpv { display: none; grid-template-columns: 1fr 350px; height: 100vh; }
        
        .btn-socio { background: var(--white); border: 2px solid var(--primary); border-radius: 15px; padding: 35px 10px; font-weight: bold; font-size: 1.4em; cursor: pointer; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-socio.activo { background: #ffeaa7; border-color: var(--warning); }

        .sidebar { background: var(--primary); color: var(--white); display: flex; flex-direction: column; padding: 15px; }
        .lista { flex: 1; overflow-y: auto; margin: 10px 0; }
        .item-tiquet { display: flex; justify-content: space-between; padding: 6px 10px; background: rgba(255,255,255,0.1); margin-bottom: 3px; border-radius: 6px; cursor: pointer; font-size: 0.9em; }
        .item-historial { background: rgba(255,255,255,0.05); color: #bdc3c7; }
        
        .total-container { border-top: 2px solid rgba(255,255,255,0.2); padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .tiquet-label { font-size: 0.9em; font-weight: bold; }
        .total { font-size: 1.2em; font-weight: bold; }
        
        .botonera-inferior { display: flex; flex-direction: column; gap: 8px; }
        .btn-side { border: none; border-radius: 12px; font-weight: bold; cursor: pointer; padding: 15px; color: white; flex: 1; }

        .card { background: var(--white); border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--white); padding: 20px; border-radius: 20px; width: 95%; max-width: 600px; color: #333; max-height: 90vh; overflow-y: auto; }
        
        .tiquet-papel { background: #fff; color: #000; padding: 20px; font-family: monospace; text-align: left; border: 1px solid #ccc; font-size: 0.9em; line-height: 1.4; }
        
        /* El selector de comensal sutil */
        .selector-comensal-tpv { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding: 5px; background: #dfe6e9; border-radius: 10px; }
        .btn-com-tpv { padding: 8px 15px; border-radius: 8px; border: 1px solid var(--primary); background: white; white-space: nowrap; font-size: 0.8em; font-weight: bold; }
        .btn-com-tpv.active { background: var(--accent); color: white; }

        .fila-inv { display: grid; grid-template-columns: 1fr 50px 50px 70px 40px; gap: 5px; margin-bottom: 8px; }
        .fila-inv input { width: 100%; padding: 8px 2px; text-align: center; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>

<div id="pantalla-socios"></div>

<div id="interfaz-tpv">
    <div style="padding:15px; display:flex; flex-direction:column; overflow:hidden;">
        <div id="selector-comensal-zona" class="selector-comensal-tpv" style="display:none;"></div>
        
        <div id="tabs" style="display:flex; gap:10px; margin-bottom:15px;"></div>
        <div id="grid-prods" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:10px; overflow-y:auto;"></div>
    </div>

    <div class="sidebar">
        <h2 id="socio-nombre" style="text-align:center; margin-top:0;">SOCIO</h2>
        <div class="lista" id="lista-tiquet"></div>
        
        <div class="total-container">
            <span class="tiquet-label">TIQUET SHOKO</span>
            <span class="total" id="total-txt">0.00€</span>
        </div>

        <div class="botonera-inferior">
            <button class="btn-side" style="background:var(--accent);" onclick="abrirModalComida()">COMIDA</button>
            <button class="btn-side" style="background:var(--warning); color:black;" onclick="abrirTiquetDetallado()">👁️ VER TIQUE</button>
            <button id="btn-cierre-parcial" class="btn-side" style="background:var(--success);" onclick="cierreParcial()">📦 CIERRE PARCIAL</button>
            <button class="btn-side" style="background:#4a5568;" onclick="atras()">🔙 ATRÁS</button>
        </div>
    </div>
</div>

<div id="modal-comida" class="modal">
    <div class="modal-content">
        <h3>Gestión de Comida / Reparto</h3>
        <div id="invitados-cont"></div>
        <button onclick="agregarInvitado()" style="width:100%; padding:12px; margin:10px 0; border:1px dashed #666; border-radius:10px;">+ Añadir Comensal</button>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-side" style="background:var(--primary);" onclick="cerrarModales()">ACEPTAR</button>
            <button class="btn-side" style="background:var(--danger);" onclick="resetComida()">RESET REPARTO</button>
        </div>
    </div>
</div>

<div id="modal-tiquet" class="modal">
    <div class="modal-content">
        <h3>DESGLOSE DE CUENTA</h3>
        <div id="tiquet-final-papel" class="tiquet-papel"></div>
        <button class="btn-side" style="background:var(--danger); width:100%; margin-top:15px; padding:20px;" onclick="cierreTotal()">🚩 CIERRE TOTAL (PAGAR AL CLUB)</button>
        <button onclick="cerrarModales()" style="width:100%; border:none; background:none; color:gray; padding:15px;">Cerrar vista</button>
    </div>
</div>

<script>
const PRECIOS = { "MAHOU": 0.90, "REFRESCO": 1.00, "COPA": 3.50, "PLATO": 7.00 };
const CATEGORIAS = { "BEBIDAS": ["MAHOU", "REFRESCO", "COPA"], "COMIDA": ["PLATO"] };

let datos = JSON.parse(localStorage.getItem('shoko_t7_data')) || {};
let socioActivo = ""; let carrito = []; let historial = []; let invitados = []; let comensalSel = "";

function renderSocios() {
    const p = document.getElementById('pantalla-socios');
    p.innerHTML = '<div style="grid-column:1/-1; background:var(--warning); padding:15px; border-radius:12px; font-weight:bold; text-align:center;">SOCIOS CLUB</div>';
    ["FRAN", "SANTI", "SANTOS", "JESÚS", "MANU"].forEach(s => {
        const hasData = datos[s] ? 'activo' : '';
        p.innerHTML += `<div class="btn-socio ${hasData}" onclick="abrirTPV('${s}')">${s}</div>`;
    });
}

function abrirTPV(s) {
    socioActivo = s;
    const d = datos[s] || { c: [], h: [], i: [] };
    carrito = d.c; historial = d.h; invitados = d.i;
    document.getElementById('pantalla-socios').style.display = 'none';
    document.getElementById('interfaz-tpv').style.display = 'grid';
    document.getElementById('socio-nombre').innerText = s;
    renderTabs();
    actualizar();
}

function actualizar() {
    const lista = document.getElementById('lista-tiquet');
    let total = 0;
    lista.innerHTML = "";

    carrito.forEach((item, idx) => {
        total += item.p;
        lista.innerHTML += `<div class="item-tiquet" onclick="eliminar(${idx})"><span>${item.n}</span><span>${item.p.toFixed(2)}€</span></div>`;
    });

    historial.forEach(item => {
        total += item.p;
        lista.innerHTML += `<div class="item-tiquet item-historial"><span>(H) ${item.n}</span><span>${item.p.toFixed(2)}€</span></div>`;
    });

    const cuotas = invitados.reduce((acc, inv) => acc + (inv.a * 1), 0);
    if(cuotas > 0) {
        total += cuotas;
        lista.innerHTML += `<div class="item-tiquet" style="border:1px dashed #fff"><span>Cuota mayores de 13 años</span><span>${cuotas.toFixed(2)}€</span></div>`;
    }

    document.getElementById('total-txt').innerText = total.toFixed(2) + "€";
    document.getElementById('btn-cierre-parcial').style.display = historial.length > 0 ? 'none' : 'block';
    
    actualizarSelectorTPV();
    datos[socioActivo] = { c: carrito, h: historial, i: invitados };
    localStorage.setItem('shoko_t7_data', JSON.stringify(datos));
}

function add(p) {
    const n = comensalSel ? `${p} (${comensalSel})` : p;
    carrito.push({ n: n, p: PRECIOS[p] });
    actualizar();
}

function eliminar(idx) { carrito.splice(idx, 1); actualizar(); }

function cierreParcial() { historial = [...historial, ...carrito]; carrito = []; actualizar(); }

function abrirModalComida() {
    const cont = document.getElementById('invitados-cont');
    cont.innerHTML = `<div class="fila-inv" style="font-weight:bold; font-size:0.7em;"><div>NOMBRE</div><div>>13</div><div><13</div><div>GASTOS</div><div></div></div>`;
    invitados.forEach((inv, i) => {
        cont.innerHTML += `
            <div class="fila-inv">
                <input type="text" value="${inv.n}" onchange="invitados[${i}].n=this.value; actualizar()">
                <input type="number" value="${inv.a}" onchange="invitados[${i}].a=parseInt(this.value); actualizar()">
                <input type="number" value="${inv.k}" onchange="invitados[${i}].k=parseInt(this.value); actualizar()">
                <input type="number" value="${inv.g}" onchange="invitados[${i}].g=parseFloat(this.value); actualizar()">
                <button onclick="invitados.splice(${i},1); abrirModalComida(); actualizar()" style="border:none; color:red; background:none;">×</button>
            </div>`;
    });
    document.getElementById('modal-comida').style.display = 'flex';
}

function agregarInvitado() { invitados.push({ n: "Inv " + (invitados.length+1), a: 1, k: 0, g: 0 }); abrirModalComida(); actualizar(); }

function actualizarSelectorTPV() {
    const zona = document.getElementById('selector-comensal-zona');
    if (invitados.length === 0) { zona.style.display = "none"; comensalSel = ""; return; }
    zona.style.display = "flex";
    zona.innerHTML = `<button class="btn-com-tpv ${comensalSel===''?'active':''}" onclick="setComensal('')">COMÚN</button>`;
    invitados.forEach(inv => {
        zona.innerHTML += `<button class="btn-com-tpv ${comensalSel===inv.n?'active':''}" onclick="setComensal('${inv.n}')">${inv.n}</button>`;
    });
}
function setComensal(n) { comensalSel = n; actualizarSelectorTPV(); }

function abrirTiquetDetallado() {
    const papel = document.getElementById('tiquet-final-papel');
    const todos = [...historial, ...carrito];
    const barComun = todos.filter(i => !i.n.includes("(")).reduce((acc, i) => acc + i.p, 0);
    const gastosComidaTotal = invitados.reduce((acc, i) => acc + i.g, 0);
    const totalReparto = barComun + gastosComidaTotal;
    const coefTotal = invitados.reduce((acc, i) => acc + (i.a * 1) + (i.k * 0.5), 0);
    const precioU = coefTotal > 0 ? totalReparto / coefTotal : 0;

    let h = `<div style="text-align:center"><b>TIQUE SHOKO</b><br>${socioActivo} - ${new Date().toLocaleDateString()}</div><br>`;
    
    h += `<b>CONSUMO PRODUCTOS SHOKO (PRIMERA CUENTA):</b><br>`;
    historial.forEach(i => h += `<span>- ${i.n}</span><span style="float:right">${i.p.toFixed(2)}</span><br>`);
    
    h += `<br><b>CONSUMO PRODUCTOS SHOKO (SEGUNDA CUENTA):</b><br>`;
    carrito.forEach(i => h += `<span>- ${i.n}</span><span style="float:right">${i.p.toFixed(2)}</span><br>`);

    h += `<br><b>GASTOS COMIDA:</b><br>`;
    invitados.forEach(inv => { if(inv.g > 0) h += `<span>- Gasto ${inv.n}</span><span style="float:right">${inv.g.toFixed(2)}</span><br>`; });
    
    const totalClub = todos.reduce((acc,i)=>acc+i.p,0) + invitados.reduce((acc,i)=>acc+i.a,0);
    h += `<br><div style="border-top:1px solid #000; font-weight:bold;">TOTAL TIQUE SHOKO <span style="float:right">${totalClub.toFixed(2)}€</span></div><hr>`;

    invitados.forEach(inv => {
        const pRep = ((inv.a * 1) + (inv.k * 0.5)) * precioU;
        const pInd = todos.filter(i => i.n.includes(`(${inv.n})`)).reduce((acc, i) => acc + i.p, 0);
        const pCuo = (inv.a * 1);
        const debe = pRep + pInd + pCuo;
        const bal = debe - inv.g;
        h += `<div style="margin-bottom:5px;"><b>${inv.n}:</b> ${debe.toFixed(2)}€<br>`;
        h += `<small>${inv.n === socioActivo ? 'PAGA AL CLUB' : (bal > 0 ? 'PAGA A '+socioActivo : 'RECIBE')} : ${Math.abs(bal).toFixed(2)}€</small></div>`;
    });

    papel.innerHTML = h;
    document.getElementById('modal-tiquet').style.display = 'flex';
}

function renderTabs() {
    const t = document.getElementById('tabs');
    t.innerHTML = "";
    Object.keys(CATEGORIAS).forEach(cat => {
        t.innerHTML += `<button onclick="renderProds('${cat}')" style="flex:1; padding:10px; border:none; background:var(--primary); color:white; border-radius:8px; font-weight:bold;">${cat}</button>`;
    });
    renderProds("BEBIDAS");
}
function renderProds(cat) {
    const g = document.getElementById('grid-prods');
    g.innerHTML = "";
    CATEGORIAS[cat].forEach(p => {
        g.innerHTML += `<div class="card" onclick="add('${p}')"><b>${p}</b><br>${PRECIOS[p].toFixed(2)}€</div>`;
    });
}
function cerrarModales() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }
function resetComida() { invitados = []; comensalSel = ""; actualizar(); cerrarModales(); }
function cierreTotal() { delete datos[socioActivo]; localStorage.setItem('shoko_t7_data', JSON.stringify(datos)); location.reload(); }
function atras() { location.reload(); }

renderSocios();
</script>
</body>
</html>
