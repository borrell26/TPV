<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPV Club - Versión T5 (Base T4)</title>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --bg: #f4f7f6; --danger: #e74c3c; --warning: #f39c12; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        
        /* Pantalla Selección Socios */
        #pantalla-socios { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; height: 100vh; box-sizing: border-box; }
        .btn-socio { background: var(--white); border: 2px solid var(--primary); border-radius: 15px; padding: 35px 10px; font-weight: bold; font-size: 1.4em; cursor: pointer; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; }
        .btn-socio.activo { background: #ffeaa7; border-color: var(--warning); }

        /* Interfaz TPV */
        #interfaz-tpv { display: none; grid-template-columns: 1fr 350px; height: 100vh; }
        
        /* Área Productos */
        .area-productos { padding: 15px; display: flex; flex-direction: column; overflow: hidden; }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab { padding: 12px 25px; background: #e2e8f0; border-radius: 10px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .tab.active { background: var(--primary); color: white; }
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; overflow-y: auto; }
        .card { background: var(--white); border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; border: 1px solid #e2e8f0; }

        /* Lateral Tiquet */
        .sidebar { background: var(--primary); color: var(--white); display: flex; flex-direction: column; padding: 15px; }
        .lista-tiquet { flex: 1; overflow-y: auto; margin: 10px 0; }
        .item-tiquet { display: flex; justify-content: space-between; padding: 8px; background: rgba(255,255,255,0.1); margin-bottom: 4px; border-radius: 6px; font-size: 0.9em; }
        .item-historial { color: #bdc3c7; font-style: italic; background: rgba(255,255,255,0.05); }
        
        .totales { border-top: 2px solid rgba(255,255,255,0.2); padding: 10px 0; }
        .fila-total { display: flex; justify-content: space-between; font-size: 1.3em; font-weight: bold; }
        
        .botonera { display: flex; flex-direction: column; gap: 8px; }
        .btn-accion { border: none; border-radius: 12px; padding: 15px; font-weight: bold; cursor: pointer; color: white; font-size: 1em; }

        /* Modales */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 500px; color: #333; max-height: 90vh; overflow-y: auto; }
        .tiquet-papel { background: #fdfdfd; padding: 20px; font-family: monospace; border: 1px solid #ddd; text-align: left; font-size: 0.9em; line-height: 1.4; }
    </style>
</head>
<body>

<div id="pantalla-socios"></div>

<div id="interfaz-tpv">
    <div class="area-productos">
        <div class="tabs" id="tab-container"></div>
        <div class="grid-productos" id="grid-prods"></div>
    </div>
    <div class="sidebar">
        <h2 id="nombre-socio-tit" style="text-align:center; margin:0 0 10px 0;">SOCIO</h2>
        <div class="lista-tiquet" id="lista-items"></div>
        <div class="totales">
            <div class="fila-total"><span>TOTAL</span><span id="total-txt">0.00€</span></div>
        </div>
        <div class="botonera">
            <button class="btn-accion" style="background:var(--accent);" onclick="abrirComida()">COMIDA/REPARTO</button>
            <button class="btn-accion" style="background:var(--warning); color:black;" onclick="verTiquetDetallado()">👁️ TIQUET DETALLADO</button>
            <button id="btn-parcial" class="btn-accion" style="background:var(--success);" onclick="cierreParcial()">📦 CIERRE PARCIAL</button>
            <button class="btn-accion" style="background:#4a5568;" onclick="location.reload()">🔙 VOLVER</button>
        </div>
    </div>
</div>

<div id="modal-comida" class="modal">
    <div class="modal-content">
        <h3>Gestión de Comida</h3>
        <div id="lista-invitados"></div>
        <button onclick="addInvitado()" style="width:100%; padding:10px; margin:10px 0; border:1px dashed #666; border-radius:10px;">+ Añadir Invitado</button>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-accion" style="background:var(--primary); flex:1;" onclick="cerrarModales()">LISTO</button>
            <button class="btn-accion" style="background:var(--danger); flex:1;" onclick="resetComida()">RESET</button>
        </div>
    </div>
</div>

<div id="modal-tiquet" class="modal">
    <div class="modal-content">
        <h3>RESUMEN DE CUENTA</h3>
        <div id="papel" class="tiquet-papel"></div>
        <button class="btn-accion" style="background:var(--danger); width:100%; margin-top:15px;" onclick="cierreTotal()">🚩 CIERRE TOTAL (BORRAR)</button>
        <button onclick="cerrarModales()" style="width:100%; border:none; background:none; color:gray; padding:10px; cursor:pointer;">Cerrar</button>
    </div>
</div>

<script>
const PRODUCTOS = {
    "BEBIDAS": [{n: "Cerveza", p: 1.00}, {n: "Refresco", p: 1.20}, {n: "Agua", p: 0.50}],
    "COCINA": [{n: "Tapa", p: 2.50}, {n: "Ración", p: 7.00}]
};

let base_datos = JSON.parse(localStorage.getItem('tpv_t5_data')) || {};
let socioActivo = ""; let carrito = []; let historial = []; let invitados = [];

function init() {
    const p = document.getElementById('pantalla-socios');
    p.innerHTML = "";
    ["FRAN", "SANTI", "SANTOS", "JESÚS", "MANU"].forEach(s => {
        const clase = base_datos[s] ? 'activo' : '';
        p.innerHTML += `<div class="btn-socio ${clase}" onclick="abrirTPV('${s}')">${s}</div>`;
    });
}

function abrirTPV(s) {
    socioActivo = s;
    const data = base_datos[s] || { c: [], h: [], i: [] };
    carrito = data.c; historial = data.h; invitados = data.i;
    document.getElementById('pantalla-socios').style.display = 'none';
    document.getElementById('interfaz-tpv').style.display = 'grid';
    document.getElementById('nombre-socio-tit').innerText = s;
    renderTabs();
    actualizarInterfaz();
}

function actualizarInterfaz() {
    const lista = document.getElementById('lista-items');
    let t = 0; lista.innerHTML = "";

    carrito.forEach((item, idx) => {
        t += item.p;
        lista.innerHTML += `<div class="item-tiquet" onclick="eliminar(${idx})"><span>${item.n}</span><span>${item.p.toFixed(2)}€</span></div>`;
    });
    historial.forEach(item => {
        t += item.p;
        lista.innerHTML += `<div class="item-tiquet item-historial"><span>(H) ${item.n}</span><span>${item.p.toFixed(2)}€</span></div>`;
    });

    const canon = invitados.reduce((acc, inv) => acc + (inv.a * 1), 0);
    if(canon > 0) {
        t += canon;
        lista.innerHTML += `<div class="item-tiquet" style="border:1px dashed #2c3e50"><span>Canon Adultos</span><span>${canon.toFixed(2)}€</span></div>`;
    }

    document.getElementById('total-txt').innerText = t.toFixed(2) + "€";
    document.getElementById('btn-parcial').style.display = historial.length > 0 ? 'none' : 'block';
    
    base_datos[socioActivo] = { c: carrito, h: historial, i: invitados };
    localStorage.setItem('tpv_t5_data', JSON.stringify(base_datos));
}

function add(n, p) { carrito.push({n, p}); actualizarInterfaz(); }
function eliminar(idx) { carrito.splice(idx, 1); actualizarInterfaz(); }
function cierreParcial() { historial = [...historial, ...carrito]; carrito = []; actualizarInterfaz(); }

function abrirComida() {
    const cont = document.getElementById('lista-invitados');
    cont.innerHTML = `<div style="display:grid; grid-template-columns: 1fr 50px 50px 70px; font-weight:bold; font-size:0.7em; margin-bottom:5px;"><div>NOMBRE</div><div>ADU</div><div>NIÑ</div><div>GASTO</div></div>`;
    invitados.forEach((inv, i) => {
        cont.innerHTML += `
            <div style="display:grid; grid-template-columns: 1fr 50px 50px 70px 30px; gap:5px; margin-bottom:5px;">
                <input type="text" value="${inv.n}" onchange="invitados[${i}].n=this.value; actualizarInterfaz()" style="width:90%">
                <input type="number" value="${inv.a}" onchange="invitados[${i}].a=parseInt(this.value); actualizarInterfaz()" style="width:100%">
                <input type="number" value="${inv.k}" onchange="invitados[${i}].k=parseInt(this.value); actualizarInterfaz()" style="width:100%">
                <input type="number" value="${inv.g}" onchange="invitados[${i}].g=parseFloat(this.value); actualizarInterfaz()" style="width:100%">
                <button onclick="invitados.splice(${i},1); abrirComida(); actualizarInterfaz()" style="border:none; background:none; color:red;">×</button>
            </div>`;
    });
    document.getElementById('modal-comida').style.display = 'flex';
}

function addInvitado() { invitados.push({n: "Invitado", a: 1, k: 0, g: 0}); abrirComida(); }

function verTiquetDetallado() {
    const papel = document.getElementById('papel');
    const todos = [...historial, ...carrito];
    const totalBar = todos.reduce((acc, i) => acc + i.p, 0);
    const gastosExt = invitados.reduce((acc, i) => acc + i.g, 0);
    const coefTotal = invitados.reduce((acc, i) => acc + (i.a * 1) + (i.k * 0.5), 0);
    const precioU = coefTotal > 0 ? (totalBar + gastosExt) / coefTotal : 0;

    let txt = `<div style="text-align:center"><b>TIQUET CLUB - SOCIO ${socioActivo}</b><br>${new Date().toLocaleDateString()}</div><hr>`;
    txt += `<b>CONSUMO (BAR ACTUAL):</b><br>`;
    carrito.forEach(i => txt += `<span>- ${i.n}</span><span style="float:right">${i.p.toFixed(2)}</span><br>`);
    txt += `<br><b>HISTORIAL (CERRADO):</b><br>`;
    historial.forEach(i => txt += `<span>- ${i.n}</span><span style="float:right">${i.p.toFixed(2)}</span><br>`);
    txt += `<br><b>COSTES FIJOS:</b><br>`;
    invitados.forEach(inv => { if(inv.g > 0) txt += `<span>- Gasto Externo ${inv.n}</span><span style="float:right">${inv.g.toFixed(2)}</span><br>`; });
    
    const tTotal = totalBar + invitados.reduce((acc, i) => acc + (i.a * 1), 0);
    txt += `<br><div style="border-top:1px solid #000; font-weight:bold;">TOTAL CUENTA <span style="float:right">${tTotal.toFixed(2)}€</span></div><hr>`;
    
    txt += `<b>REPARTO COMIDA (A Escote):</b><br>`;
    invitados.forEach(inv => {
        const debe = ((inv.a * 1) + (inv.k * 0.5)) * precioU + (inv.a * 1);
        const balance = debe - inv.g;
        txt += `<div>${inv.n}: <b>${debe.toFixed(2)}€</b><br><small>(${balance > 0 ? 'Paga a '+socioActivo : 'Recibe de '+socioActivo}: ${Math.abs(balance).toFixed(2)}€)</small></div>`;
    });

    papel.innerHTML = txt;
    document.getElementById('modal-tiquet').style.display = 'flex';
}

function renderTabs() {
    const cont = document.getElementById('tab-container');
    cont.innerHTML = "";
    Object.keys(PRODUCTOS).forEach(cat => {
        cont.innerHTML += `<div class="tab" onclick="renderProds('${cat}')">${cat}</div>`;
    });
    renderProds("BEBIDAS");
}

function renderProds(cat) {
    const g = document.getElementById('grid-prods');
    g.innerHTML = "";
    PRODUCTOS[cat].forEach(p => {
        g.innerHTML += `<div class="card" onclick="add('${p.n}', ${p.p})"><b>${p.n}</b><br>${p.p.toFixed(2)}€</div>`;
    });
}

function cerrarModales() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
function resetComida() { invitados = []; actualizarInterfaz(); cerrarModales(); }
function cierreTotal() { delete base_datos[socioActivo]; localStorage.setItem('tpv_t5_data', JSON.stringify(base_datos)); location.reload(); }

init();
</script>
</body>
</html>
