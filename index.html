<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPV Shoko - MASTER CORREO</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --bg: #f4f7f6; --danger: #e74c3c; --warning: #f39c12; --white: #ffffff; --gray: #95a5a6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        #pantalla-socios { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; height: 100vh; box-sizing: border-box; align-content: start; }
        #interfaz-tpv { display: none; grid-template-columns: 1fr 350px; height: 100vh; }
        #pantalla-reposicion { display: none; flex-direction: column; gap: 15px; padding: 20px; height: 100vh; box-sizing: border-box; overflow-y: auto; }
        .btn-socio { background: var(--white); border: 2px solid var(--primary); border-radius: 15px; padding: 35px 10px; font-weight: bold; font-size: 1.4em; cursor: pointer; text-align: center; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-socio.activo { background: #ffeaa7; border-color: var(--warning); }
        .nav-reponedor { background: #cbd5e0; color: var(--primary); padding: 10px; border-radius: 10px; text-align: center; font-weight: normal; cursor: pointer; width: 100%; border: 1px solid var(--gray); box-sizing: border-box; grid-column: 1 / -1; font-size: 1em; margin-top: 20px; opacity: 0.7; }
        .card { background: var(--white); border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; height: 145px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; }
        .card img { height: 60px; width: auto; max-width: 90%; object-fit: contain; }
        .sidebar { background: var(--primary); color: var(--white); display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        .lista { flex: 1; overflow-y: auto; margin: 10px 0; }
        .item-tiquet { display: flex; justify-content: space-between; padding: 6px 10px; background: rgba(255,255,255,0.1); margin-bottom: 3px; border-radius: 6px; cursor: pointer; font-size: 0.9em; }
        .item-historial { background: rgba(255,255,255,0.05); color: #bdc3c7; font-size: 0.8em; cursor: default; }
        .total-container { border-top: 2px solid rgba(255,255,255,0.2); padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .tiquet-label, .total { font-size: 1.1em; font-weight: bold; }
        .botonera-inferior { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .fila-botones { display: flex; gap: 8px; }
        .btn-side { border: none; border-radius: 12px; font-weight: bold; cursor: pointer; padding: 15px; color: white; flex: 1; font-size: 0.9em; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--white); padding: 20px; border-radius: 20px; width: 90%; max-width: 650px; text-align: center; color: #333; max-height: 98vh; overflow-y: auto; }
        .tiquet-papel { background: #fff; color: #000; padding: 20px; font-family: 'Courier New', monospace; text-align: left; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-top: 10px; }
        .tiquet-linea { display: flex; justify-content: space-between; margin-bottom: 3px; border-bottom: 1px dotted #ccc; }
        .btn-cancelar { background: #cbd5e0; color: #2d3748; padding: 12px; border-radius: 12px; border: none; font-weight: bold; margin-top: 10px; width: 100%; cursor: pointer; }
        .grid-teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .tecla { background: #edf2f7; border: none; padding: 20px; font-size: 1.5em; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-accion { padding: 18px; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 1.2em; cursor: pointer; flex: 1; }
        .btn-comensal-modal { padding: 20px; border-radius: 12px; border: 2px solid var(--primary); background: white; font-weight: bold; cursor: pointer; font-size: 1.2em; }
        .tecla-t { background: #edf2f7; border: none; padding: 15px 2px; font-size: 1.1em; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .teclado-texto { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 10px; }
        .fila-inv { display: grid; grid-template-columns: 1fr 60px 60px 80px 40px; gap: 8px; margin-bottom: 10px; }
        .fila-inv div { background: #f8fafc; border: 1px solid #cbd5e0; border-radius: 8px; padding: 12px 2px; text-align: center; font-size: 1.1em; font-weight: bold; }
    </style>
</head>
<body>

<div id="pantalla-socios"></div>
<div id="pantalla-reposicion">
    <div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2>Reposición</h2>
        <button onclick="location.reload()" style="background:var(--success); color:white; padding:15px; border-radius:10px; border:none; font-weight:bold;">SALIR</button>
    </div>
    <div id="repo-menu-cats" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:15px;"></div>
    <div id="repo-menu-items" style="display:none; width: 100%;">
        <button onclick="mostrarMenuCats()" style="margin-bottom:15px; padding:15px 30px; background:#4a5568; color:white; border:none; border-radius:10px; font-weight:bold;">VOLVER</button>
        <div id="repo-grid-productos" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:15px;"></div>
    </div>
</div>

<div id="interfaz-tpv">
    <div style="padding:10px; display:flex; flex-direction:column; overflow:hidden;">
        <div class="tabs" id="tab-container" style="display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap;"></div>
        <div id="grid-prods" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(145px, 1fr)); gap:12px; overflow-y:auto;"></div>
    </div>
    <div class="sidebar">
        <h2 id="nombre-socio" style="margin:0; font-size:1.8em; text-align:center;">Socio</h2>
        <div class="lista" id="ticket-lista"></div>
        <div class="total-container">
            <span class="tiquet-label">TIQUE SHOKO</span>
            <div class="total" id="total-txt">0.00€</div>
        </div>
        <div class="botonera-inferior">
            <div class="fila-botones">
                <button class="btn-side" style="background:var(--accent);" onclick="abrirModalReparto()">🍽️ COMIDA</button>
                <button class="btn-side" style="background:var(--warning); color:#000;" onclick="verTiquetDetallado()">👁️ VER TIQUE</button>
            </div>
            <button id="btn-cierre-parcial" class="btn-side" style="background:var(--success);" onclick="cierreParcial()">📦 CIERRE PARCIAL</button>
            <button class="btn-side" style="background:#4a5568;" onclick="location.reload()">🔙 ATRÁS</button>
        </div>
    </div>
</div>

<div id="modal-tiquet-final" class="modal">
    <div class="modal-content" style="max-width: 450px;">
        <h3>DESGLOSE DE CUENTA</h3>
        <div id="cont-tiquet-papel" class="tiquet-papel"></div>
        <button id="btn-final-enviar" style="width:100%; background:var(--danger); color:white; border:none; padding:20px; border-radius:12px; font-weight:bold; margin-top:15px; cursor:pointer; font-size:1.1em;" onclick="cerrarVenta()">🚩 CIERRE TOTAL (Pagar a SHOKO)</button>
        <button class="btn-cancelar" onclick="document.getElementById('modal-tiquet-final').style.display='none'">VOLVER AL TPV</button>
    </div>
</div>

<div id="modal-teclado-texto" class="modal"><div class="modal-content"><h3 id="titulo-teclado">Nombre</h3><div id="display-texto" style="font-size:2em; padding:10px; border:1px solid #ccc; margin-bottom:10px;"></div><div class="teclado-texto" id="grid-teclado-texto"></div><button onclick="confirmarTexto()">ACEPTAR</button></div></div>
<div id="modal-cantidad" class="modal"><div class="modal-content"><h3 id="titulo-prod-modal"></h3><div id="input-cantidad" style="font-size:3em;">0</div><div class="grid-teclado" id="teclado-nums"></div><button onclick="document.getElementById('modal-cantidad').style.display='none'">X</button></div></div>
<div id="modal-edit" class="modal"><div class="modal-content"><h3 id="edit-nombre"></h3><div id="edit-input-display" style="font-size:3em;">0</div><div class="grid-teclado" id="teclado-edit"></div><button onclick="aplicarEdicion(1)">APLICAR</button><button onclick="eliminarFilaEdicion()">BORRAR</button></div></div>
<div id="modal-reparto" class="modal"><div class="modal-content"><h2>Gestión Comida</h2><div id="invitados-cont"></div><button onclick="addInv()">+ Añadir</button><button onclick="cerrarTPVCompletamente()">VOLVER</button></div></div>
<div id="modal-asignar-comensal" class="modal"><div class="modal-content"><h3>¿Quién consume?</h3><div id="grid-comensales-modal"></div></div></div>

<script>
// --- CONFIGURACIÓN EMAILJS ---
const PUBLIC_KEY = "lc8woRfpiuAUn_9QM";
const SERVICE_ID = "service_zchbl2f";
const TEMPLATE_ID = "template_qqn30c5";

// Inicialización con control de errores
try {
    emailjs.init(PUBLIC_KEY);
    console.log("EmailJS inicializado");
} catch(e) {
    alert("Error cargando EmailJS: Revisa tu conexión a internet.");
}

const EMAILS_SOCIOS = { 
    "MIGUEL": "mguardiz@gmail.com", 
    "SANTI": "sbborrell@gmail.com" 
};

// --- DATOS TPV ---
const PRECIOS = { "MAHOU 25cl.": 0.90, "ALHAMBRA 33cl.": 1.50, "BUDWEISSER 33cl.": 1.50, "MAHOU SIN 25cl.": 0.90, "COCA COLA": 1.00, "COCA COLA ZERO": 1.00, "FANTA NARANJA": 1.00, "FANTA LIMÓN": 1.00, "SPRITE": 1.00, "ACUARIUS NARANJA": 1.00, "ACUARIUS LIMÓN": 1.00, "NESTEÁ LIMÓN": 1.00, "TÓNICA SCHWEPPES": 1.00, "TÓNICA SCHWEPPES ZERO": 1.00, "CASERA BLANCA 0,5L": 0.50, "AGUA": 0.50, "VIÑAS DEL VERO": 9.00, "BERONIA CRIANZA": 9.00, "BERONIA RESERVA": 16.00, "TIO PEPE 50cl.": 6.00, "MANZANILLA 50CL.": 6.00, "TINTO BÁSICO 70cl.": 2.00, "CROFT TWIST": 6.00, "DESCORCHE VINO": 2.00, "BARCELÓ": 2.00, "WHITE LABEL": 2.00, "RIVES": 2.00, "PINK RIVES": 2.00, "RIVES EXÓTICA": 2.00, "DESCORCHE COPA": 3.00, "ATÚN ENCEBOLLADO": 8.00, "ATÚN FRITADA": 8.00, "PATATAS FRITAS": 0.60 };
const CATEGORIAS = { "CERVEZAS": ["MAHOU 25cl.", "ALHAMBRA 33cl.", "BUDWEISSER 33cl.", "MAHOU SIN 25cl."], "REFRESCOS": ["COCA COLA", "COCA COLA ZERO", "FANTA NARANJA", "FANTA LIMÓN", "SPRITE", "ACUARIUS NARANJA", "ACUARIUS LIMÓN", "NESTEÁ LIMÓN", "TÓNICA SCHWEPPES", "TÓNICA SCHWEPPES ZERO", "CASERA BLANCA 0,5L", "AGUA"], "VINOS": ["VIÑAS DEL VERO", "BERONIA CRIANZA", "BERONIA RESERVA", "TIO PEPE 50cl.", "MANZANILLA 50CL.", "TINTO BÁSICO 70cl.", "CROFT TWIST", "DESCORCHE VINO"], "ESPIRITUOSOS": ["BARCELÓ", "WHITE LABEL", "RIVES", "PINK RIVES", "RIVES EXÓTICA", "DESCORCHE COPA"], "OTROS": ["ATÚN ENCEBOLLADO", "ATÚN FRITADA", "PATATAS FRITAS"] };
const STOCK_IDEAL = { "MAHOU 25cl.": 180, "ALHAMBRA 33cl.": 12, "BUDWEISSER 33cl.": 12, "MAHOU SIN 25cl.": 60, "COCA COLA": 60, "COCA COLA ZERO": 60, "FANTA NARANJA": 60, "FANTA LIMÓN": 60, "SPRITE": 60, "ACUARIUS NARANJA": 60, "ACUARIUS LIMÓN": 60, "NESTEÁ LIMÓN": 60, "TÓNICA SCHWEPPES": 60, "TÓNICA SCHWEPPES ZERO": 60, "CASERA BLANCA 0,5L": 60, "AGUA": 60, "VIÑAS DEL VERO": 6, "BERONIA CRIANZA": 6, "BERONIA RESERVA": 6, "TIO PEPE 50cl.": 6, "MANZANILLA 50CL.": 6, "TINTO BÁSICO 70cl.": 6, "CROFT TWIST": 6, "BARCELÓ": 3000, "WHITE LABEL": 3000, "RIVES": 3000, "PINK RIVES": 3000, "RIVES EXÓTICA": 3000, "ATÚN ENCEBOLLADO": 8, "ATÚN FRITADA": 8, "PATATAS FRITAS": 20 };

let stockActual = JSON.parse(localStorage.getItem('v29_stock')) || {...STOCK_IDEAL};
let tickets = JSON.parse(localStorage.getItem('v29_tickets')) || {};
let socioActivo = ""; let carrito = []; let historial = []; let catActiva = "CERVEZAS";
let prodTemp = null; let inputVal = ""; let listInv = []; let modoRepoActivo = false;
let editingInvIdx = -1; let currentTexto = ""; let currentEditType = ""; let cantTemp = 1; let flgNuevoInv = false;

// --- FUNCIONES CORE ---
function renderSocios() {
    document.getElementById('pantalla-socios').innerHTML = ["FRAN", "SANTI", "SANTOS", "JESÚS", "MANU", "JR", "MIGUEL", "NUÑEZ", "SILVA", "LUIS", "ROSADO"].map(s => {
        const d = tickets[s] || [];
        const c = d.filter(i => i.n && !i.esComida).reduce((acc, i) => acc + i.cant, 0);
        return `<div class="btn-socio ${c>0?'activo':''}" onclick="abrirTPV('${s}')">${s} ${c>0?`<span>(${c})</span>`:''}</div>`;
    }).join('') + '<div class="nav-reponedor" onclick="abrirReposicion()">🛠️ REPONEDOR</div>';
}

function abrirTPV(n) { 
    socioActivo = n; 
    let d = tickets[n] || []; 
    carrito = d.filter(i => i.n && !i.esHistorial); 
    historial = d.filter(i => i.esHistorial); 
    let cG = d.find(i => i.esComida); 
    listInv = cG ? cG.datos : []; 
    document.getElementById('pantalla-socios').style.display = 'none'; 
    document.getElementById('interfaz-tpv').style.display = 'grid'; 
    document.getElementById('nombre-socio').innerText = n; 
    renderTabs(); renderProds(); actualizarTicket(); 
}

function renderTabs() { 
    document.getElementById('tab-container').innerHTML = Object.keys(CATEGORIAS).map(c => `<button style="background:${c===catActiva?'var(--accent)':'#ccc'}; flex:1; padding:10px; border:none;" onclick="catActiva='${c}'; renderTabs(); renderProds()">${c}</button>`).join(''); 
}

function renderProds() { 
    document.getElementById('grid-prods').innerHTML = CATEGORIAS[catActiva].map(n => `<div class="card" onclick="abrirTecladoProd('${n}')"><b>${n}</b><br>${PRECIOS[n].toFixed(2)}€</div>`).join(''); 
}

function actualizarTicket() {
    let t = 0; let h = "";
    carrito.forEach(i => { t += i.p * i.cant; h += `<div class="item-tiquet" onclick="abrirEdicionTicket('${i.n}')"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}€</span></div>`; });
    historial.forEach(i => { if(i.p > 0) { t += i.p * i.cant; h += `<div class="item-tiquet item-historial"><span>(H) ${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}€</span></div>`; } });
    const canon = listInv.reduce((acc, i) => acc + (i.a * 1), 0);
    document.getElementById('ticket-lista').innerHTML = h + (canon > 0 ? `<div>Canon: ${canon}€</div>` : "");
    document.getElementById('total-txt').innerText = (t + canon).toFixed(2) + "€";
}

// --- LÓGICA DE CORREO Y CIERRE ---

function enviarCorreo(htmlTiquet) {
    const emailDestino = EMAILS_SOCIOS[socioActivo] || "mguardiz@gmail.com";
    const params = {
        to_email: emailDestino,
        to_name: socioActivo,
        message_html: htmlTiquet,
        subject: `TIQUE SHOKO - ${socioActivo}`
    };

    console.log("Enviando...", params);

    emailjs.send(SERVICE_ID, TEMPLATE_ID, params)
        .then(() => {
            alert("✅ CORREO ENVIADO con éxito a " + emailDestino);
        })
        .catch((err) => {
            alert("❌ ERROR AL ENVIAR: " + JSON.stringify(err));
        });
}

function cerrarVenta() {
    if(!confirm("¿Confirmar pago y enviar tiquet?")) return;
    
    // Deshabilitar botón para evitar doble clic
    document.getElementById('btn-final-enviar').disabled = true;
    document.getElementById('btn-final-enviar').innerText = "ENVIANDO...";

    verTiquetDetallado();
    const contenido = document.getElementById('cont-tiquet-papel').innerHTML;
    
    enviarCorreo(contenido);

    // Limpieza de datos
    [...carrito, ...historial].forEach(i => { 
        if(i.n && i.p > 0) {
            const base = i.n.split(" (")[0];
            stockActual[base] -= (CATEGORIAS["ESPIRITUOSOS"].includes(base) ? i.cant*30 : i.cant);
        }
    });
    localStorage.setItem('v29_stock', JSON.stringify(stockActual));
    delete tickets[socioActivo];
    localStorage.setItem('v29_tickets', JSON.stringify(tickets));
    
    setTimeout(() => location.reload(), 3000);
}

// --- FUNCIONES AUXILIARES (MODALES, ETC) ---
function verTiquetDetallado() {
    const cont = document.getElementById('cont-tiquet-papel');
    let h = `<h3>TIQUE SHOKO - ${socioActivo}</h3>`;
    carrito.forEach(i => h += `<div class="tiquet-linea"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}</span></div>`);
    cont.innerHTML = h;
    document.getElementById('modal-tiquet-final').style.display = 'flex';
}
function abrirTecladoProd(n) { prodTemp = n; currentEditType = 'prod'; inputVal = ""; document.getElementById('titulo-prod-modal').innerText = n; document.getElementById('input-cantidad').innerText = "1"; document.getElementById('modal-cantidad').style.display = 'flex'; }
function presionarNum(v) { inputVal += v; document.getElementById('input-cantidad').innerText = inputVal; }
function confirmar() {
    const val = parseFloat(inputVal) || 1;
    carrito.push({n: prodTemp, cant: val, p: PRECIOS[prodTemp]});
    document.getElementById('modal-cantidad').style.display = 'none';
    guardarTicketParcial();
}
function cierreParcial() { 
    carrito.forEach(i => { historial.push({...i, esHistorial: true}); }); 
    carrito = []; guardarTicketParcial(); 
}
function guardarTicketParcial() { 
    tickets[socioActivo] = [...carrito, ...historial]; 
    if(listInv.length > 0) tickets[socioActivo].push({esComida: true, datos: listInv});
    localStorage.setItem('v29_tickets', JSON.stringify(tickets)); 
    actualizarTicket(); 
}
function abrirModalReparto() { listInv = [{n: socioActivo, a: 1, k: 0, g: 0}]; guardarTicketParcial(); alert("Comida activada"); }

// Inicialización de teclados
function crearTeclado(id, func) {
    const cont = document.getElementById(id);
    for(let i=1; i<=9; i++) cont.innerHTML += `<button class="tecla" onclick="${func}('${i}')">${i}</button>`;
    cont.innerHTML += `<button class="tecla" onclick="confirmar()" style="background:green;color:white;grid-column:span 3">ACEPTAR</button>`;
}
crearTeclado('teclado-nums', 'presionarNum');
renderSocios();
</script>
</body>
</html>
