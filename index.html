<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPV Club Pro - Cierre Dividido</title>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --bg: #f4f7f6; --danger: #e74c3c; --warning: #f39c12; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        
        #pantalla-socios { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; height: 100vh; box-sizing: border-box; align-content: start; }
        #interfaz-tpv { display: none; grid-template-columns: 1fr 350px; height: 100vh; }
        
        .btn-socio { background: var(--white); border: 2px solid var(--primary); border-radius: 15px; padding: 35px 10px; font-weight: bold; font-size: 1.4em; cursor: pointer; text-align: center; position: relative; }
        .btn-socio.activo { background: #ffeaa7; border-color: var(--warning); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        #modal-cantidad { z-index: 2100; }
        #modal-teclado-texto { z-index: 2200; } 
        
        .modal-content { background: var(--white); padding: 20px; border-radius: 20px; width: 90%; max-width: 500px; text-align: center; max-height: 95vh; overflow-y: auto; }
        
        .fila-inv { display: grid; grid-template-columns: 1fr 60px 60px 80px 40px; gap: 8px; margin-bottom: 10px; }
        .fila-inv div { background: #f8fafc; border: 1px solid #cbd5e0; border-radius: 8px; padding: 12px 2px; text-align: center; font-weight: bold; }

        .sidebar { background: var(--primary); color: var(--white); display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        .lista { flex: 1; overflow-y: auto; }
        .total { font-size: 2.8em; font-weight: bold; text-align: center; border-top: 2px solid rgba(255,255,255,0.2); }

        .btn-accion { padding: 18px; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 1.1em; cursor: pointer; flex: 1; }
        .btn-cancelar { background: #cbd5e0; color: #2d3748; padding: 12px; border-radius: 12px; border: none; font-weight: bold; margin-top: 10px; width: 100%; cursor: pointer; }
        
        .card { background: var(--white); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; border: 1px solid #e2e8f0; height: 140px; display: flex; flex-direction: column; justify-content: space-between; }
        .teclado-texto { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 10px; }
        .tecla-t { background: #edf2f7; border: none; padding: 12px 2px; font-size: 1em; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .grid-teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .tecla { background: #edf2f7; border: none; padding: 18px; font-size: 1.5em; border-radius: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div id="pantalla-socios"></div>

<div id="interfaz-tpv">
    <div style="padding:10px; display:flex; flex-direction:column; overflow:hidden;">
        <div class="tabs" id="tab-container" style="display:flex; gap:8px; margin-bottom:15px;"></div>
        <div id="grid-prods" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(145px, 1fr)); gap:12px; overflow-y:auto;"></div>
    </div>
    <div class="sidebar">
        <h2 id="nombre-socio" style="margin:0; text-align:center;">Socio</h2>
        <div class="lista" id="ticket-lista"></div>
        <button onclick="abrirModalReparto()" style="background:var(--accent); color:white; border:none; padding:15px; border-radius:12px; font-weight:bold; margin-bottom:10px; cursor:pointer;">🍽️ COMIDA / REPARTO</button>
        <div class="total" id="total-txt">0.00€</div>
        <div style="display: flex; gap: 10px;">
            <button style="flex: 1; background:var(--success); color:white; border:none; padding:20px 5px; border-radius:15px; font-weight:bold; cursor:pointer;" onclick="document.getElementById('modal-opciones-cierre').style.display='flex'">CERRAR TIQUE</button>
            <button style="flex: 1; background:#4a5568; color:white; border:none; padding:20px 5px; border-radius:15px; font-weight:bold; cursor:pointer;" onclick="location.reload()">ATRÁS</button>
        </div>
    </div>
</div>

<div id="modal-opciones-cierre" class="modal">
    <div class="modal-content">
        <h2>Opciones de Cierre</h2>
        <button class="btn-accion" style="background:var(--success); width:100%; margin-bottom:15px; padding:25px;" onclick="cerrarVenta()">CIERRE TOTAL (Fin de sesión)</button>
        <button class="btn-accion" style="background:var(--accent); width:100%; padding:25px;" onclick="abrirSubOpciones()">CIERRE PARCIAL / DIVIDIR</button>
        <button class="btn-cancelar" onclick="cerrarModales()">VOLVER</button>
    </div>
</div>

<div id="modal-sub-opciones" class="modal">
    <div class="modal-content">
        <h3>Imputar nuevos productos a:</h3>
        <div style="display:flex; gap:15px;">
            <button class="btn-accion" style="background:var(--primary);" onclick="cambiarModo('socio')">SOLO SOCIO</button>
            <button class="btn-accion" style="background:var(--warning); color:black;" onclick="cambiarModo('invitados')">DIVIDIR POR INVITADOS</button>
        </div>
        <button class="btn-cancelar" onclick="cerrarModales()">CANCELAR</button>
    </div>
</div>

<div id="modal-seleccion-comensal" class="modal">
    <div class="modal-content">
        <h3>¿Quién está consumiendo?</h3>
        <div id="grid-comensales-seleccion" style="display:grid; grid-template-columns:1fr; gap:10px;"></div>
        <button class="btn-cancelar" onclick="cerrarModales()">VOLVER</button>
    </div>
</div>

<div id="modal-teclado-texto" class="modal"><div class="modal-content" style="max-width:800px;"><h3>Nombre</h3><div id="display-texto" style="font-size:2em; border:2px solid var(--accent); padding:10px; margin-bottom:10px; border-radius:10px;"></div><div class="teclado-texto" id="grid-teclado-texto"></div><button class="btn-accion" style="background:var(--success); margin-top:20px; width:100%;" onclick="confirmarTexto()">ACEPTAR</button></div></div>
<div id="modal-cantidad" class="modal"><div class="modal-content"><h3 id="titulo-prod-modal"></h3><div id="input-cantidad" style="font-size:4em; color:var(--accent);">0</div><div class="grid-teclado" id="teclado-nums"></div><button class="btn-cancelar" onclick="cerrarModales()">CANCELAR</button></div></div>
<div id="modal-reparto" class="modal"><div class="modal-content" style="max-width:700px;"><h2>Gestión Comida</h2><div id="invitados-cont"></div><button onclick="addInv()" style="width:100%; padding:15px; background:#f0f0f0; border:2px dashed #ccc; border-radius:12px;">+ Añadir Comensal</button><div id="resumen-reparto" style="display:none; text-align:left; background:#eef2f7; padding:15px; margin-top:10px; border-radius:10px;"></div><div style="display:flex; gap:10px; margin-top:15px;"><button class="btn-accion" style="background:var(--accent);" onclick="calcularCuentas()">CALCULAR</button><button class="btn-accion" style="background:var(--primary);" onclick="cerrarModales()">CERRAR</button></div></div></div>

<script>
// Lógica de datos (simplificada para el ejemplo)
const PRECIOS = { "MAHOU 25cl.": 0.90, "ALHAMBRA 33cl.": 1.50, "COCA COLA": 1.00, "AGUA": 0.50, "PATATAS FRITAS": 0.60 };
const CATEGORIAS = { "BEBIDAS": ["MAHOU 25cl.", "ALHAMBRA 33cl.", "COCA COLA", "AGUA"], "COMIDA": ["PATATAS FRITAS"] };

let tickets = JSON.parse(localStorage.getItem('v29_tickets')) || {};
let socioActivo = ""; let comensalActivo = ""; let carrito = []; let listInv = [];
let catActiva = "BEBIDAS"; let inputVal = ""; let currentEditType = ""; let editingInvIdx = -1;
let modoImputacion = localStorage.getItem('v29_modo') || "socio"; 

function renderSocios() {
    const cont = document.getElementById('pantalla-socios');
    cont.innerHTML = "";
    ["FRAN", "SANTI", "SANTOS", "JESÚS", "MANU"].forEach(s => {
        const cant = (tickets[s] || []).filter(i => i.n).length;
        cont.innerHTML += `<div class="btn-socio ${cant > 0 ? 'activo' : ''}" onclick="abrirSocio('${s}')">${s}</div>`;
    });
}

function abrirSocio(s) {
    socioActivo = s;
    let data = tickets[s] || [];
    carrito = data.filter(i => i.n);
    let comidaG = data.find(i => i.esComida);
    listInv = comidaG ? comidaG.datos : [];

    // Si el modo es "invitados" y hay gente en la lista, preguntamos quién consume
    if (modoImputacion === "invitados" && listInv.length > 0) {
        const cont = document.getElementById('grid-comensales-seleccion');
        cont.innerHTML = `<button class="btn-accion" style="background:var(--primary);" onclick="setComensal('${s}')">CARGAR A SOCIO (${s})</button>`;
        listInv.forEach(inv => {
            if(inv.n) cont.innerHTML += `<button class="btn-accion" style="background:var(--warning); color:black;" onclick="setComensal('${inv.n}')">${inv.n}</button>`;
        });
        document.getElementById('modal-seleccion-comensal').style.display = 'flex';
    } else {
        setComensal(s);
    }
}

function setComensal(nombre) {
    comensalActivo = nombre;
    cerrarModales();
    document.getElementById('pantalla-socios').style.display = 'none';
    document.getElementById('interfaz-tpv').style.display = 'grid';
    document.getElementById('nombre-socio').innerText = comensalActivo;
    renderTabs(); renderProds(); actualizarTicket();
}

function cambiarModo(modo) {
    modoImputacion = modo;
    localStorage.setItem('v29_modo', modo);
    cerrarModales();
    location.reload(); // Recargamos para aplicar el cambio de flujo
}

// FUNCIONES DE SOPORTE (Basadas en tu código original)
function abrirModalReparto() { if(listInv.length===0) listInv=[{n:socioActivo,a:1,k:0,g:0}]; renderInv(); document.getElementById('modal-reparto').style.display='flex'; }
function addInv() { listInv.push({n:"",a:0,k:0,g:0}); renderInv(); }
function renderInv() {
    const cont = document.getElementById('invitados-cont');
    cont.innerHTML = "";
    listInv.forEach((inv, i) => {
        cont.innerHTML += `<div class="fila-inv">
            <div onclick="abrirTecladoTexto(${i})">${inv.n || '...'}</div>
            <div onclick="abrirTecladoNumComida(${i}, 'adulto')">${inv.a}</div>
            <div onclick="abrirTecladoNumComida(${i}, 'nino')">${inv.k}</div>
            <div onclick="abrirTecladoNumComida(${i}, 'gasto')">${inv.g}€</div>
            <button onclick="listInv.splice(${i},1); renderInv();" style="color:red; border:none; background:none; font-size:1.5em;">×</button>
        </div>`;
    });
}

function abrirTecladoProd(n) { 
    prodTemp = n; currentEditType = 'prod'; inputVal = "";
    document.getElementById('titulo-prod-modal').innerText = n;
    document.getElementById('input-cantidad').innerText = "1";
    document.getElementById('modal-cantidad').style.display = 'flex';
}

function confirmar() {
    const val = parseFloat(document.getElementById('input-cantidad').innerText) || 1;
    if (currentEditType === 'prod') {
        // Si estamos cargando a un invitado, le ponemos el prefijo al nombre
        const nombreItem = (comensalActivo !== socioActivo) ? `(${comensalActivo}) ${prodTemp}` : prodTemp;
        const ex = carrito.find(i => i.n === nombreItem);
        if(ex) ex.cant += val; else carrito.push({n: nombreItem, cant: val, p: PRECIOS[prodTemp]});
    } else if (currentEditType === 'adulto') listInv[editingInvIdx].a = val;
    // ... resto de lógica de adultos/niños
    guardarTicketParcial();
    cerrarModales();
}

function guardarTicketParcial() {
    let d = carrito.filter(i => i.n);
    if(listInv.length > 0) d.push({ esComida: true, datos: listInv });
    tickets[socioActivo] = d;
    localStorage.setItem('v29_tickets', JSON.stringify(tickets));
    actualizarTicket();
}

function actualizarTicket() {
    let tS = 0;
    document.getElementById('ticket-lista').innerHTML = carrito.map(i => {
        tS += i.p * i.cant;
        return `<div style="padding:10px; border-bottom:1px solid #444; display:flex; justify-content:space-between;"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}€</span></div>`;
    }).join('');
    document.getElementById('total-txt').innerText = tS.toFixed(2) + "€";
}

function abrirSubOpciones() { cerrarModales(); document.getElementById('modal-sub-opciones').style.display = 'flex'; }
function cerrarModales() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
function cerrarVenta() { delete tickets[socioActivo]; localStorage.setItem('v29_tickets', JSON.stringify(tickets)); location.reload(); }

// Teclados...
function renderTabs() { document.getElementById('tab-container').innerHTML = Object.keys(CATEGORIAS).map(c => `<button style="padding:10px; flex:1; background:${c===catActiva?'var(--accent)':'#ccc'}" onclick="catActiva='${c}'; renderTabs(); renderProds()">${c}</button>`).join(''); }
function renderProds() { document.getElementById('grid-prods').innerHTML = CATEGORIAS[catActiva].map(n => `<div class="card" onclick="abrirTecladoProd('${n}')"><b>${n}</b><br>${PRECIOS[n].toFixed(2)}€</div>`).join(''); }
function presionarNum(v) { inputVal += v; document.getElementById('input-cantidad').innerText = inputVal; }
function crearTeclado(id, func) {
    const cont = document.getElementById(id); cont.innerHTML = "";
    for(let i=1; i<=9; i++) cont.innerHTML += `<button class="tecla" onclick="${func}('${i}')">${i}</button>`;
    cont.innerHTML += `<button class="tecla" onclick="${func}('0')">0</button><button class="tecla" style="grid-column: span 2; background:var(--success); color:white;" onclick="confirmar()">ACEPTAR</button>`;
}
crearTeclado('teclado-nums', 'presionarNum');
renderSocios();
</script>
</body>
</html>
