<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPV Club Pro</title>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --bg: #f4f7f6; --danger: #e74c3c; --warning: #f39c12; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        
        #pantalla-socios { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; height: 100vh; box-sizing: border-box; align-content: start; }
        #interfaz-tpv { display: none; grid-template-columns: 1fr 350px; height: 100vh; }
        
        .btn-socio { background: var(--white); border: 2px solid var(--primary); border-radius: 15px; padding: 35px 10px; font-weight: bold; font-size: 1.4em; cursor: pointer; text-align: center; position: relative; }
        .btn-socio.activo { background: #ffeaa7; border-color: var(--warning); }

        /* MODALES */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        /* El teclado de texto debe estar por encima de otros modales */
        #modal-teclado-texto { z-index: 2000; } 
        
        .modal-content { background: var(--white); padding: 15px; border-radius: 20px; width: 95%; max-width: 500px; text-align: center; max-height: 95vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* TABLA COMENSALES COMPACTA */
        .fila-inv { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr 0.5fr; gap: 5px; margin-bottom: 5px; align-items: center; }
        .fila-inv div { background: #f1f5f9; border: 1px solid #cbd5e0; border-radius: 8px; padding: 10px 2px; font-size: 0.9em; font-weight: bold; cursor: pointer; overflow: hidden; white-space: nowrap; }

        /* TECLADOS */
        .grid-teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .tecla { background: #edf2f7; border: none; padding: 15px; font-size: 1.3em; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .teclado-texto { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 10px; }
        .tecla-t { background: #edf2f7; border: none; padding: 10px 0; font-size: 0.9em; border-radius: 5px; font-weight: bold; cursor: pointer; }

        .btn-accion { padding: 15px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-cancelar { background: #cbd5e0; color: #2d3748; padding: 12px; border-radius: 12px; border: none; font-weight: bold; margin-top: 10px; width: 100%; cursor: pointer; }

        .sidebar { background: var(--primary); color: var(--white); display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        .lista { flex: 1; overflow-y: auto; }
        .total { font-size: 2.5em; font-weight: bold; text-align: center; border-top: 1px solid rgba(255,255,255,0.2); }
        .card { background: var(--white); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; border: 1px solid #eee; }
    </style>
</head>
<body>

<div id="pantalla-socios"></div>

<div id="modal-reparto" class="modal">
    <div class="modal-content" style="max-width: 600px;">
        <h2 style="margin-top:0;">Gestión Comida</h2>
        <div id="invitados-cont" style="margin-bottom:10px;"></div>
        <button onclick="addInv()" style="width:100%; padding:10px; background:#f0f0f0; border:2px dashed #ccc; border-radius:10px; font-weight:bold; cursor:pointer;">+ Añadir Comensal</button>
        <div id="resumen-reparto" style="text-align:left; background:#eef2f7; padding:10px; border-radius:10px; margin-top:10px; display:none; font-size:0.85em;"></div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-accion" style="background:var(--accent);" onclick="calcularCuentas()">CALCULAR</button>
            <button class="btn-accion" style="background:var(--primary);" onclick="cerrarModales()">CERRAR</button>
        </div>
        <button class="btn-cancelar" style="background:var(--danger); color:white;" onclick="resetearComida()">BORRAR TODO</button>
    </div>
</div>

<div id="modal-teclado-texto" class="modal">
    <div class="modal-content" style="max-width: 800px; background: #fff;">
        <h3 id="titulo-teclado" style="margin:0;">Nombre del Comensal</h3>
        <div id="display-texto" style="font-size:2em; font-weight:bold; background:#f8fafc; padding:10px; border-radius:10px; margin:10px 0; border:2px solid var(--accent); min-height:1.2em;"></div>
        <div class="teclado-texto" id="grid-teclado-texto"></div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-accion" style="background:var(--success); padding:20px;" onclick="confirmarTexto()">ACEPTAR</button>
            <button class="btn-accion" style="background:var(--danger); padding:20px;" onclick="document.getElementById('modal-teclado-texto').style.display='none'">CANCELAR</button>
        </div>
    </div>
</div>

<div id="interfaz-tpv">
    <div style="padding:10px; display:flex; flex-direction:column; overflow:hidden;">
        <div class="tabs" id="tab-container" style="display:flex; gap:5px; margin-bottom:10px;"></div>
        <div id="grid-prods" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:10px; overflow-y:auto;"></div>
    </div>
    <div class="sidebar">
        <h2 id="nombre-socio" style="text-align:center; margin:0;">Socio</h2>
        <div class="lista" id="ticket-lista"></div>
        <button onclick="abrirModalReparto()" style="background:var(--accent); color:white; border:none; padding:15px; border-radius:10px; font-weight:bold; margin-bottom:10px; cursor:pointer;">🍽️ COMIDA / REPARTO</button>
        <div class="total" id="total-txt">0.00€</div>
        <div style="display: flex; gap: 5px;">
            <button style="flex: 1; background:var(--success); color:white; border:none; padding:15px 0; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="document.getElementById('modal-opciones-cierre').style.display='flex'">CERRAR TIQUE</button>
            <button style="flex: 1; background:#4a5568; color:white; border:none; padding:15px 0; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="location.reload()">ATRÁS</button>
        </div>
    </div>
</div>

<div id="modal-cantidad" class="modal"><div class="modal-content"><h3 id="titulo-prod-modal"></h3><div id="input-cantidad" style="font-size:3em; font-weight:bold; color:var(--accent);">1</div><div class="grid-teclado" id="teclado-nums"></div><button class="btn-cancelar" onclick="cerrarModales()">CANCELAR</button></div></div>
<div id="modal-opciones-cierre" class="modal"><div class="modal-content"><h2>¿Cómo cerrar?</h2><button class="btn-accion" style="background:var(--success); width:100%; margin-bottom:10px; padding:20px;" onclick="cerrarVenta()">CIERRE TOTAL</button><button class="btn-accion" style="background:var(--accent); width:100%; padding:20px;" onclick="abrirSubOpciones()">PARCIAL / INVITADOS</button><button class="btn-cancelar" onclick="cerrarModales()">VOLVER</button></div></div>
<div id="modal-sub-opciones" class="modal"><div class="modal-content"><h3>Imputar productos a:</h3><div style="display:flex; gap:10px;"><button class="btn-accion" style="background:var(--primary);" onclick="imputarASocio()">SOCIO</button><button class="btn-accion" style="background:var(--warning); color:black;" onclick="imputarAInvitados()">INVITADOS</button></div><button class="btn-cancelar" onclick="cerrarModales()">VOLVER</button></div></div>
<div id="modal-seleccion-comensal" class="modal"><div class="modal-content"><h3>¿Quién consume?</h3><div id="grid-comensales-seleccion" style="display:grid; gap:10px;"></div><button class="btn-cancelar" onclick="cerrarModales()">VOLVER</button></div></div>

<script>
// VARIABLES Y DATOS
const PRECIOS = { "MAHOU 25cl.": 0.90, "ALHAMBRA 33cl.": 1.50, "BUDWEISSER 33cl.": 1.50, "MAHOU SIN 25cl.": 0.90, "COCA COLA": 1.00, "COCA COLA ZERO": 1.00, "FANTA NARANJA": 1.00, "FANTA LIMÓN": 1.00, "SPRITE": 1.00, "ACUARIUS NARANJA": 1.00, "ACUARIUS LIMÓN": 1.00, "NESTEÁ LIMÓN": 1.00, "TÓNICA SCHWEPPES": 1.00, "TÓNICA SCHWEPPES ZERO": 1.00, "CASERA BLANCA 0,5L": 0.50, "AGUA": 0.50, "VIÑAS DEL VERO": 9.00, "BERONIA CRIANZA": 9.00, "BERONIA RESERVA": 16.00, "TIO PEPE 50cl.": 6.00, "MANZANILLA 50CL.": 6.00, "TINTO BÁSICO 70cl.": 2.00, "CROFT TWIST": 6.00, "DESCORCHE VINO": 2.00, "BARCELÓ": 2.00, "WHITE LABEL": 2.00, "RIVES": 2.00, "PINK RIVES": 2.00, "RIVES EXÓTICA": 2.00, "DESCORCHE COPA": 3.00, "ATÚN ENCEBOLLADO": 8.00, "ATÚN FRITADA": 8.00, "PATATAS FRITAS": 0.60 };
const CATEGORIAS = { "CERVEZAS": ["MAHOU 25cl.", "ALHAMBRA 33cl.", "BUDWEISSER 33cl.", "MAHOU SIN 25cl."], "REFRESCOS": ["COCA COLA", "COCA COLA ZERO", "FANTA NARANJA", "FANTA LIMÓN", "SPRITE", "ACUARIUS NARANJA", "ACUARIUS LIMÓN", "NESTEÁ LIMÓN", "TÓNICA SCHWEPPES", "TÓNICA SCHWEPPES ZERO", "CASERA BLANCA 0,5L", "AGUA"], "VINOS": ["VIÑAS DEL VERO", "BERONIA CRIANZA", "BERONIA RESERVA", "TIO PEPE 50cl.", "MANZANILLA 50CL.", "TINTO BÁSICO 70cl.", "CROFT TWIST", "DESCORCHE VINO"], "ESPIRITUOSOS": ["BARCELÓ", "WHITE LABEL", "RIVES", "PINK RIVES", "RIVES EXÓTICA", "DESCORCHE COPA"], "OTROS": ["ATÚN ENCEBOLLADO", "ATÚN FRITADA", "PATATAS FRITAS"] };

let stockActual = JSON.parse(localStorage.getItem('v29_stock')) || {};
let tickets = JSON.parse(localStorage.getItem('v29_tickets')) || {};
let socioActivo = ""; let carrito = []; let catActiva = "CERVEZAS";
let listInv = []; let editingInvIdx = -1; let currentTexto = ""; let currentEditType = "";
let modoImputacion = localStorage.getItem('v29_modo') || "socio";
let comensalActivo = ""; let inputVal = "";

function renderSocios() {
    const cont = document.getElementById('pantalla-socios');
    cont.innerHTML = '<div style="grid-column:1/-1; background:var(--warning); padding:15px; border-radius:10px; text-align:center; font-weight:bold; margin-bottom:10px;">TPV CLUB PRO</div>';
    ["FRAN", "SANTI", "SANTOS", "JESÚS", "MANU", "JR", "MIGUEL", "NUÑEZ", "SILVA", "LUIS", "ROSADO"].forEach(s => {
        const cant = (tickets[s] || []).filter(i => i.n).reduce((acc, i) => acc + i.cant, 0);
        cont.innerHTML += `<div class="btn-socio ${cant > 0 ? 'activo' : ''}" onclick="abrirTPV('${s}')">${s} ${cant > 0 ? `(${cant})` : ''}</div>`;
    });
}

function abrirTPV(s) {
    socioActivo = s;
    let data = tickets[s] || [];
    carrito = data.filter(i => i.n);
    let comidaG = data.find(i => i.esComida);
    listInv = comidaG ? comidaG.datos : [];
    
    if (modoImputacion === "invitados" && listInv.length > 0) {
        const cont = document.getElementById('grid-comensales-seleccion');
        cont.innerHTML = `<button class="btn-accion" style="background:var(--primary); padding:15px;" onclick="comensalActivo='${s}'; entrarTPV()">Socio: ${s}</button>`;
        listInv.forEach(inv => { if(inv.n) cont.innerHTML += `<button class="btn-accion" style="background:var(--warning); color:black; padding:15px;" onclick="comensalActivo='${inv.n}'; entrarTPV()">${inv.n}</button>`; });
        document.getElementById('modal-seleccion-comensal').style.display = 'flex';
    } else { comensalActivo = s; entrarTPV(); }
}

function entrarTPV() {
    cerrarModales();
    document.getElementById('pantalla-socios').style.display = 'none';
    document.getElementById('interfaz-tpv').style.display = 'grid';
    document.getElementById('nombre-socio').innerText = comensalActivo;
    renderTabs(); renderProds(); actualizarTicket();
}

function abrirModalReparto() { if (listInv.length === 0) listInv = [{n: socioActivo, a: 1, k: 0, g: 0}]; renderInv(); document.getElementById('modal-reparto').style.display = 'flex'; }
function addInv() { listInv.push({n: "", a: 0, k: 0, g: 0}); renderInv(); }

function renderInv() {
    const cont = document.getElementById('invitados-cont');
    cont.innerHTML = `<div class="fila-inv" style="font-size:0.7em; font-weight:bold; color:#666;"><span>NOMBRE</span><span>>13</span><span><13</span><span>GASTO</span><span></span></div>`;
    listInv.forEach((inv, i) => {
        cont.innerHTML += `<div class="fila-inv">
            <div onclick="abrirTecladoTexto(${i})">${inv.n || 'Toque...'}</div>
            <div onclick="editingInvIdx=${i}; currentEditType='adulto'; abrirTecladoNumComida()">${inv.a}</div>
            <div onclick="editingInvIdx=${i}; currentEditType='nino'; abrirTecladoNumComida()">${inv.k}</div>
            <div onclick="editingInvIdx=${i}; currentEditType='gasto'; abrirTecladoNumComida()">${inv.g}€</div>
            <button onclick="listInv.splice(${i},1); renderInv(); guardarTicketParcial();" style="color:red; background:none; border:none; font-weight:bold;">X</button>
        </div>`;
    });
}

function abrirTecladoTexto(idx) { 
    editingInvIdx = idx; 
    currentTexto = listInv[idx].n; 
    document.getElementById('display-texto').innerText = currentTexto; 
    document.getElementById('modal-teclado-texto').style.display = 'flex'; 
    renderTecladoTexto(); 
}

function renderTecladoTexto() {
    const cont = document.getElementById('grid-teclado-texto');
    const teclas = "1234567890QWERTYUIOPASDFGHJKLÑZXCVBNM ".split("");
    cont.innerHTML = teclas.map(l => `<button class="tecla-t" onclick="addLetra('${l}')">${l===' '?'_':l}</button>`).join('');
    cont.innerHTML += `<button class="tecla-t" style="background:var(--warning); grid-column: span 2;" onclick="addLetra('BACK')">BORRAR</button>`;
}

function addLetra(l) { 
    if(l === 'BACK') currentTexto = currentTexto.slice(0, -1); 
    else if(currentTexto.length < 12) currentTexto += l; 
    document.getElementById('display-texto').innerText = currentTexto; 
}

function confirmarTexto() { 
    listInv[editingInvIdx].n = currentTexto; 
    document.getElementById('modal-teclado-texto').style.display = 'none'; 
    renderInv(); 
}

function abrirTecladoNumComida() { inputVal = ""; document.getElementById('input-cantidad').innerText = "0"; document.getElementById('modal-cantidad').style.display = 'flex'; }

function confirmar() {
    const c = parseFloat(document.getElementById('input-cantidad').innerText) || 0;
    if (currentEditType === 'adulto') listInv[editingInvIdx].a = c;
    else if (currentEditType === 'nino') listInv[editingInvIdx].k = c;
    else if (currentEditType === 'gasto') listInv[editingInvIdx].g = c;
    else if (currentEditType === 'prod') {
        const itemN = (comensalActivo !== socioActivo) ? `(${comensalActivo}) ${prodTemp}` : prodTemp;
        const ex = carrito.find(i => i.n === itemN);
        if(ex) ex.cant += (c || 1); else carrito.push({n: itemN, cant: (c || 1), p: PRECIOS[prodTemp]});
    }
    guardarTicketParcial(); cerrarModales(); renderInv();
}

function renderProds() {
    document.getElementById('grid-prods').innerHTML = CATEGORIAS[catActiva].map(n => 
        `<div class="card" onclick="prodTemp='${n}'; currentEditType='prod'; abrirTecladoNumComida()"><b>${n}</b><br><span style="color:var(--success)">${PRECIOS[n].toFixed(2)}€</span></div>`
    ).join('');
}

function renderTabs() { 
    const cont = document.getElementById('tab-container'); 
    cont.innerHTML = Object.keys(CATEGORIAS).map(c => 
        `<button style="flex:1; padding:10px; border-radius:8px; border:none; background:${c===catActiva?'var(--accent)':'#ccc'}; color:white; font-weight:bold;" onclick="catActiva='${c}'; renderTabs(); renderProds()">${c}</button>`
    ).join(''); 
}

function guardarTicketParcial() {
    let d = carrito.filter(i => i.n);
    if(listInv.length > 0) d.push({ esComida: true, datos: listInv });
    tickets[socioActivo] = d;
    localStorage.setItem('v29_tickets', JSON.stringify(tickets));
    actualizarTicket();
}

function actualizarTicket() {
    let total = 0;
    document.getElementById('ticket-lista').innerHTML = carrito.map(i => {
        total += i.p * i.cant;
        return `<div style="display:flex; justify-content:space-between; padding:5px; border-bottom:1px solid #444; font-size:0.9em;"><span>${i.cant}x ${i.n}</span><span>${(i.p*i.cant).toFixed(2)}€</span></div>`;
    }).join('');
    const canon = listInv.reduce((acc, i) => acc + (i.a * 1), 0);
    document.getElementById('total-txt').innerText = (total + canon).toFixed(2) + "€";
}

function calcularCuentas() {
    const totalBar = carrito.reduce((acc, i) => acc + (i.p * i.cant), 0);
    const totalExt = listInv.reduce((acc, i) => acc + i.g, 0);
    const totalCoef = listInv.reduce((acc, i) => acc + (i.a * 1) + (i.k * 0.5), 0);
    if (totalCoef === 0) return;
    const precioU = (totalBar + totalExt) / totalCoef;
    let h = "";
    listInv.forEach(inv => {
        const bal = ((inv.a * 1) + (inv.k * 0.5)) * precioU + (inv.a * 1) - inv.g;
        h += `<div>${inv.n || '?'}: <b>${bal.toFixed(2)}€</b></div>`;
    });
    document.getElementById('resumen-reparto').innerHTML = h; document.getElementById('resumen-reparto').style.display = 'block';
}

function cerrarVenta() { delete tickets[socioActivo]; localStorage.setItem('v29_tickets', JSON.stringify(tickets)); location.reload(); }
function abrirSubOpciones() { cerrarModales(); document.getElementById('modal-sub-opciones').style.display = 'flex'; }
function imputarASocio() { localStorage.setItem('v29_modo', 'socio'); location.reload(); }
function imputarAInvitados() { localStorage.setItem('v29_modo', 'invitados'); location.reload(); }
function cerrarModales() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
function presionarNum(v) { inputVal += v; document.getElementById('input-cantidad').innerText = inputVal; }
function resetearComida() { if(confirm("¿Borrar todo?")) { listInv=[]; guardarTicketParcial(); renderInv(); } }

function crearTeclado(id, func) {
    const cont = document.getElementById(id); cont.innerHTML = "";
    for(let i=1; i<=9; i++) cont.innerHTML += `<button class="tecla" onclick="${func}('${i}')">${i}</button>`;
    cont.innerHTML += `<button class="tecla" onclick="${func}('.')">.</button><button class="tecla" onclick="${func}('0')">0</button><button class="tecla" onclick="inputVal=''; document.getElementById('input-cantidad').innerText='0'">C</button>`;
    cont.innerHTML += `<button class="tecla" style="background:var(--success); color:white; grid-column: span 3;" onclick="confirmar()">ACEPTAR</button>`;
}

crearTeclado('teclado-nums', 'presionarNum');
renderSocios();
</script>
</body>
</html>
