<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPV Shoko - T6 Híbrido</title>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --accent: #3498db; --bg: #f4f7f6; --danger: #e74c3c; --warning: #f39c12; --white: #ffffff; --gray: #95a5a6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); height: 100vh; overflow: hidden; }
        #pantalla-socios { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; height: 100vh; box-sizing: border-box; align-content: start; }
        #interfaz-tpv { display: none; grid-template-columns: 1fr 350px; height: 100vh; }
        .btn-socio { background: var(--white); border: 2px solid var(--primary); border-radius: 15px; padding: 35px 10px; font-weight: bold; font-size: 1.4em; cursor: pointer; text-align: center; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-socio.activo { background: #ffeaa7; border-color: var(--warning); }
        .sidebar { background: var(--primary); color: var(--white); display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        .lista { flex: 1; overflow-y: auto; margin: 10px 0; }
        .item-tiquet { display: flex; justify-content: space-between; padding: 6px 10px; background: rgba(255,255,255,0.1); margin-bottom: 3px; border-radius: 6px; cursor: pointer; font-size: 0.9em; }
        .total-container { border-top: 2px solid rgba(255,255,255,0.2); padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .total { font-size: 1.5em; font-weight: bold; }
        .botonera-inferior { display: flex; flex-direction: column; gap: 8px; }
        .btn-side { border: none; border-radius: 12px; font-weight: bold; cursor: pointer; padding: 15px; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--white); padding: 20px; border-radius: 20px; width: 95%; max-width: 700px; text-align: center; color: #333; max-height: 98vh; overflow-y: auto; }
        .tiquet-papel { background: #fff; color: #000; padding: 20px; font-family: 'Courier New', monospace; text-align: left; border: 1px solid #ccc; font-size: 0.85em; }
        /* Nuevos estilos mínimos para el selector de comensal */
        .selector-comensal-tpv { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; padding: 5px; background: #dfe6e9; border-radius: 10px; }
        .btn-com-tpv { padding: 8px 15px; border-radius: 8px; border: 1px solid var(--primary); background: white; white-space: nowrap; font-size: 0.8em; font-weight: bold; cursor: pointer; }
        .btn-com-tpv.active { background: var(--accent); color: white; }
    </style>
</head>
<body>

<div id="pantalla-socios"></div>

<div id="interfaz-tpv">
    <div style="padding:10px; display:flex; flex-direction:column; overflow:hidden;">
        <div id="comensal-tpv-zona" class="selector-comensal-tpv" style="display:none;"></div>
        
        <div id="tabs-prods" style="display:flex; gap:10px; margin-bottom:15px;"></div>
        <div id="grid-prods" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; overflow-y:auto;"></div>
    </div>

    <div class="sidebar">
        <h2 id="socio-display" style="text-align:center; margin:0;">SOCIO</h2>
        <div class="lista" id="lista-tiquet"></div>
        <div class="total-container">
            <span style="font-size:0.8em;">TIQUET SHOKO</span>
            <div class="total" id="total-txt">0.00€</div>
        </div>
        <div class="botonera-inferior">
            <button class="btn-side" style="background:var(--accent);" onclick="abrirModalComida()">COMIDA</button>
            <button class="btn-side" style="background:var(--warning); color:black;" onclick="verTiquetDetallado()">👁️ VER TIQUE</button>
            <button id="btn-cierre-parcial" class="btn-side" style="background:var(--success);" onclick="cierreParcial()">📦 CIERRE PARCIAL</button>
            <button class="btn-side" style="background:#4a5568;" onclick="location.reload()">🔙 ATRÁS</button>
        </div>
    </div>
</div>

<div id="modal-comida" class="modal">
    <div class="modal-content">
        <h2 style="margin:0 0 15px 0;">Gestión COMIDA / REPARTO</h2>
        <div id="invitados-lista-zona"></div>
        <button onclick="addInvitado()" style="width:100%; padding:15px; margin:10px 0; border:1px dashed #666; border-radius:10px; font-weight:bold;">+ Añadir Comensal</button>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-side" style="background:var(--primary); flex:1;" onclick="cerrarModales()">ACEPTAR</button>
            <button class="btn-side" style="background:var(--danger); flex:1;" onclick="resetReparto()">BORRAR TODO</button>
        </div>
    </div>
</div>

<div id="modal-tiquet" class="modal">
    <div class="modal-content">
        <h3>DESGLOSE DE CUENTA</h3>
        <div id="papel-final" class="tiquet-papel"></div>
        <button class="btn-side" style="background:var(--danger); width:100%; margin-top:15px; padding:20px;" onclick="cierreTotal()">🚩 CIERRE TOTAL (PAGAR AL CLUB)</button>
        <button onclick="cerrarModales()" style="width:100%; border:none; background:none; color:gray; padding:15px;">Volver</button>
    </div>
</div>

<div id="modal-cantidad" class="modal">...</div> <script>
// BASE DE DATOS T6
const PRECIOS = { "MAHOU": 0.90, "REFRESCO": 1.00, "PLATO": 8.00 };
const CATEGORIAS = { "BAR": ["MAHOU", "REFRESCO"], "COMIDA": ["PLATO"] };

let storage = JSON.parse(localStorage.getItem('shoko_t6_data')) || {};
let socio = ""; let carrito = []; let historial = []; let invitados = []; let comensalActivo = "";

function renderSocios() {
    const p = document.getElementById('pantalla-socios');
    p.innerHTML = '<div style="grid-column:1/-1; background:var(--warning); padding:15px; border-radius:12px; font-weight:bold; text-align:center;">MENU PRINCIPAL</div>';
    ["FRAN", "SANTI", "SANTOS", "JESÚS", "MANU"].forEach(s => {
        const act = storage[s] ? 'activo' : '';
        p.innerHTML += `<div class="btn-socio ${act}" onclick="iniciar('${s}')">${s}</div>`;
    });
}

function iniciar(s) {
    socio = s;
    const d = storage[s] || { c: [], h: [], i: [] };
    carrito = d.c; historial = d.h; invitados = d.i;
    document.getElementById('pantalla-socios').style.display = 'none';
    document.getElementById('interfaz-tpv').style.display = 'grid';
    document.getElementById('socio-display').innerText = s;
    renderTabs();
    actualizar();
}

function actualizar() {
    const lista = document.getElementById('lista-tiquet');
    let total = 0;
    lista.innerHTML = "";

    // Mantenemos lógica T6 de cuentas
    carrito.forEach((item, idx) => {
        total += item.p;
        lista.innerHTML += `<div class="item-tiquet" onclick="eliminar(${idx})"><span>${item.n}</span><span>${item.p.toFixed(2)}€</span></div>`;
    });
    historial.forEach(item => {
        total += item.p;
        lista.innerHTML += `<div class="item-tiquet item-historial"><span>(H) ${item.n}</span><span>${item.p.toFixed(2)}€</span></div>`;
    });

    const cuotas = invitados.reduce((acc, inv) => acc + (inv.a * 1), 0);
    if(cuotas > 0) {
        total += cuotas;
        lista.innerHTML += `<div class="item-tiquet" style="border:1px dashed #fff"><span>Cuota mayores de 13 años</span><span>${cuotas.toFixed(2)}€</span></div>`;
    }

    document.getElementById('total-txt').innerText = total.toFixed(2) + "€";
    document.getElementById('btn-cierre-parcial').style.display = historial.length > 0 ? 'none' : 'block';
    
    actualizarSelectorComensal();
    storage[socio] = { c: carrito, h: historial, i: invitados };
    localStorage.setItem('shoko_t6_data', JSON.stringify(storage));
}

// Única modificación en la adición de productos
function addProducto(p) {
    const nombre = comensalActivo ? `${p} (${comensalActivo})` : p;
    carrito.push({ n: nombre, p: PRECIOS[p] });
    actualizar();
}

// Selector sutil que no estaba en T6 pero es necesario para la mejora
function actualizarSelectorComensal() {
    const zona = document.getElementById('comensal-tpv-zona');
    if (invitados.length === 0) { zona.style.display = "none"; comensalActivo = ""; return; }
    zona.style.display = "flex";
    zona.innerHTML = `<button class="btn-com-tpv ${comensalActivo===''?'active':''}" onclick="comensalActivo=''; actualizar()">COMÚN</button>`;
    invitados.forEach(inv => {
        zona.innerHTML += `<button class="btn-com-tpv ${comensalActivo===inv.n?'active':''}" onclick="comensalActivo='${inv.n}'; actualizar()">${inv.n}</button>`;
    });
}

function abrirModalComida() {
    const cont = document.getElementById('invitados-lista-zona');
    cont.innerHTML = `<div style="display:grid; grid-template-columns: 1fr 50px 50px 70px 30px; font-weight:bold; font-size:0.7em; margin-bottom:5px;"><div>NOMBRE</div><div>>13</div><div><13</div><div>GASTOS</div></div>`;
    invitados.forEach((inv, i) => {
        cont.innerHTML += `
            <div style="display:grid; grid-template-columns: 1fr 50px 50px 70px 30px; gap:5px; margin-bottom:5px;">
                <input type="text" value="${inv.n}" onchange="invitados[${i}].n=this.value; actualizar()">
                <input type="number" value="${inv.a}" onchange="invitados[${i}].a=parseInt(this.value); actualizar()">
                <input type="number" value="${inv.k}" onchange="invitados[${i}].k=parseInt(this.value); actualizar()">
                <input type="number" value="${inv.g}" onchange="invitados[${i}].g=parseFloat(this.value); actualizar()">
                <button onclick="invitados.splice(${i},1); actualizar(); abrirModalComida()" style="border:none; color:red; background:none;">×</button>
            </div>`;
    });
    document.getElementById('modal-comida').style.display = 'flex';
}

function addInvitado() { invitados.push({ n: "Inv " + (invitados.length+1), a: 1, k: 0, g: 0 }); abrirModalComida(); actualizar(); }

function verTiquetDetallado() {
    const papel = document.getElementById('papel-final');
    const todos = [...historial, ...carrito];
    
    // MEJORA: Cálculo híbrido
    const barComun = todos.filter(i => !i.n.includes("(")).reduce((acc, i) => acc + i.p, 0);
    const gastosComida = invitados.reduce((acc, i) => acc + i.g, 0);
    const coefTotal = invitados.reduce((acc, i) => acc + (i.a * 1) + (i.k * 0.5), 0);
    const precioU = coefTotal > 0 ? (barComun + gastosComida) / coefTotal : 0;

    let h = `<div style="text-align:center"><b>TIQUE SHOKO</b><br>${socio} - ${new Date().toLocaleDateString()}</div><br>`;
    
    // Estructura T6 original
    h += `<b>CONSUMO PRODUCTOS SHOKO (PRIMERA CUENTA):</b><br>`;
    historial.forEach(i => h += `<span>- ${i.n}</span><span style="float:right">${i.p.toFixed(2)}</span><br>`);
    
    h += `<br><b>CONSUMO PRODUCTOS SHOKO (SEGUNDA CUENTA):</b><br>`;
    carrito.forEach(i => h += `<span>- ${i.n}</span><span style="float:right">${i.p.toFixed(2)}</span><br>`);

    h += `<br><b>GASTOS COMIDA:</b><br>`;
    invitados.forEach(inv => { if(inv.g > 0) h += `<span>- Gasto ${inv.n}</span><span style="float:right">${inv.g.toFixed(2)}</span><br>`; });
    
    const totalTique = todos.reduce((acc,i)=>acc+i.p,0) + invitados.reduce((acc,i)=>acc+i.a,0);
    h += `<br><div style="border-top:1px solid #000; font-weight:bold;">TOTAL TIQUE SHOKO <span style="float:right">${totalTique.toFixed(2)}€</span></div><hr>`;

    // Desglose por persona híbrido
    invitados.forEach(inv => {
        const pComun = ((inv.a * 1) + (inv.k * 0.5)) * precioU;
        const pIndiv = todos.filter(i => i.n.includes(`(${inv.n})`)).reduce((acc, i) => acc + i.p, 0);
        const pCuota = (inv.a * 1);
        const debe = pComun + pIndiv + pCuota;
        const bal = debe - inv.g;
        h += `<div><b>${inv.n}:</b> ${debe.toFixed(2)}€ <small>(${inv.n===socio?'Paga Club':'Paga a '+socio}: ${Math.abs(bal).toFixed(2)}€)</small></div>`;
    });

    papel.innerHTML = h;
    document.getElementById('modal-tiquet').style.display = 'flex';
}

// RESTO DE FUNCIONES T6 (renderTabs, eliminar, cierreTotal...) SIN CAMBIOS
function renderTabs() { /* Lógica T6 */ }
function renderProds(cat) { /* Lógica T6 */ }
function cerrarModales() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }
function cierreTotal() { delete storage[socio]; localStorage.setItem('shoko_t6_data', JSON.stringify(storage)); location.reload(); }
function resetReparto() { invitados = []; actualizar(); cerrarModales(); }

renderSocios();
</script>
</body>
</html>
